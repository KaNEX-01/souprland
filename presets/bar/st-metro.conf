# ---------------------------------------------------------------------------
#  preset: st-metro
#  title: Metro — Bottom Taskbar
#  desc: Script Test. A classic flat, square taskbar at the bottom: square
#        workspace boxes on the left, the active window boxed like a task
#        button next to them, tray and 12-hour clock right. Thin mustard top line.
#
#  Usage:  ./install.sh --bar-preset st-metro
# ---------------------------------------------------------------------------

BAR="waybar"
BAR_POSITION="bottom"
BAR_HEIGHT=29
BAR_MARGIN=0
BAR_SPACING=4
BAR_PADDING=6
BAR_RADIUS=0
BAR_OPACITY=1.0
BAR_WORKSPACE_STYLE="numbers"
BAR_CLOCK_FORMAT="%I:%M %p"
BAR_CLOCK_FORMAT_ALT="%Y-%m-%d %H:%M"
BAR_MODULES_LEFT="hyprland/workspaces,hyprland/window"
BAR_MODULES_CENTER=""
BAR_MODULES_RIGHT="tray,pulseaudio,clock"
