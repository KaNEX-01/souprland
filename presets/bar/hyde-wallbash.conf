# ---------------------------------------------------------------------------
#  preset: hyde-wallbash
#  title: HyDE — Wallbash
#  desc: Power button on the left, a workspace capsule next to it; rounded
#        module groups on the right. Dimensions of the setup that derives its
#        colors from the wallpaper. Source: prasanthrangan/hyprdots (HyDE).
#        Pairs with THEME="auto".
#
#  Usage:  ./install.sh --bar-preset hyde-wallbash
# ---------------------------------------------------------------------------

BAR_POSITION="top"
BAR_HEIGHT=30
BAR_MARGIN=4
BAR_SPACING=8
BAR_PADDING=10
BAR_RADIUS=10
BAR_OPACITY=0.95
BAR_WORKSPACE_STYLE="pill-expand"
BAR_MODULES_LEFT="custom/mic,custom/power,hyprland/workspaces,hyprland/window"
BAR_MODULES_CENTER="clock"
BAR_MODULES_RIGHT="mpris,pulseaudio,network,battery,tray"
