# ---------------------------------------------------------------------------
#  preset: quickshell-bar
#  title: Quickshell Bar
#  desc: A QtQuick-based shell that draws the bar and desktop widgets in ONE
#        process, inside a single shell.qml. If Quickshell is also chosen as
#        the widget engine, both share the same file.
#
#  Usage:  ./install.sh --bar-preset quickshell-bar
#
#  What sets it apart from Waybar and HyprPanel is the backend, not the layout: BAR
#  becomes "quickshell-bar" here (see config/components.json → bar category) and
#  templates/waybar/* is never generated. Unlike HyprPanel, it is a repo package;
#  no AUR needed.
#
#  The module lists really are read: render.py turns the three zones below into
#  QS_{L,C,R}_<MODULE> flags and shell.qml.tmpl draws only the selected
#  ones. Modules with a QML implementation:
#  hyprland/workspaces, hyprland/window, clock, cpu, memory, battery,
#  pulseaudio, network. Any other name in the list is not an error; it is
#  silently skipped (same behavior as Waybar).
# ---------------------------------------------------------------------------

BAR="quickshell-bar"

BAR_POSITION="top"
BAR_HEIGHT=34
BAR_WIDTH=48
BAR_MARGIN=6
BAR_SPACING=10
BAR_PADDING=12
BAR_RADIUS=12
BAR_OPACITY=0.9
BAR_WORKSPACE_STYLE="dots"
BAR_MODULES_LEFT="hyprland/workspaces,hyprland/window"
BAR_MODULES_CENTER="clock"
BAR_MODULES_RIGHT="cpu,memory,pulseaudio,network,battery"
