# ---------------------------------------------------------------------------
#  preset: hyprpanel-media
#  title: HyprPanel — Media
#  desc: Now playing in the center, flanked by an audio visualizer and the
#        notification center. A floating, heavily rounded bar. The media menu
#        is one of HyprPanel's features with no Waybar equivalent.
#
#  Usage:  ./install.sh --bar-preset hyprpanel-media
# ---------------------------------------------------------------------------

BAR="hyprpanel"

BAR_POSITION="top"
BAR_HEIGHT=38
BAR_MARGIN=8
BAR_SPACING=10
BAR_PADDING=14
BAR_RADIUS=18
BAR_OPACITY=0.88
BAR_WORKSPACE_STYLE="pill-expand"
BAR_MODULES_LEFT="hyprland/workspaces"
BAR_MODULES_CENTER="mpris"
BAR_MODULES_RIGHT="cava,pulseaudio,notifications,clock"
