# ---------------------------------------------------------------------------
#  preset: st-siyah
#  title: Black — Thin Text Line
#  desc: Script Test. A 20px jet-black strip, small mono type: workspace digits
#        on the left, now playing or window name in the center, memory,
#        battery, network icons and clock on the right. No boxes at all.
#
#  Usage:  ./install.sh --bar-preset st-siyah
# ---------------------------------------------------------------------------

BAR="waybar"
BAR_POSITION="top"
BAR_HEIGHT=20
BAR_MARGIN=0
BAR_SPACING=2
BAR_PADDING=4
BAR_RADIUS=0
BAR_OPACITY=1.0
BAR_WORKSPACE_STYLE="numbers"
BAR_CLOCK_FORMAT="%H:%M"
BAR_CLOCK_FORMAT_ALT="%d.%m.%Y"
BAR_WINDOW_MAX_LENGTH=70
BAR_MODULES_LEFT="hyprland/workspaces"
BAR_MODULES_CENTER="hyprland/window"
BAR_MODULES_RIGHT="memory,battery,bluetooth,network,pulseaudio,clock"
