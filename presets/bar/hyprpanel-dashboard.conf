# ---------------------------------------------------------------------------
#  preset: hyprpanel-dashboard
#  title: HyprPanel — Dashboard
#  desc: Puts HyprPanel's dashboard (quick settings), notification center and
#        media menus — which have no Waybar equivalent — up front. Only
#        meaningful with BAR=hyprpanel — Waybar never shows these modules.
#
#  Usage:  ./install.sh --bar-preset hyprpanel-dashboard
# ---------------------------------------------------------------------------

BAR="hyprpanel"

BAR_POSITION="top"
BAR_HEIGHT=36
BAR_MARGIN=6
BAR_SPACING=10
BAR_PADDING=12
BAR_RADIUS=14
BAR_OPACITY=0.92
BAR_WORKSPACE_STYLE="dots"
BAR_MODULES_LEFT="dashboard,hyprland/workspaces,hyprland/submap"
BAR_MODULES_CENTER="mpris"
BAR_MODULES_RIGHT="notifications,pulseaudio,network,battery,clock"
