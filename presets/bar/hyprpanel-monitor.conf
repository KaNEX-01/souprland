# ---------------------------------------------------------------------------
#  preset: hyprpanel-monitor
#  title: HyprPanel — Rich Monitoring
#  desc: A dense system-monitoring bar that gathers HyprPanel-only modules
#        (network speed, microphone, pending updates, world clock, weather,
#        notification center). Only meaningful with BAR=hyprpanel.
#
#  Usage:  ./install.sh --bar-preset hyprpanel-monitor
# ---------------------------------------------------------------------------

BAR="hyprpanel"

BAR_POSITION="top"
BAR_HEIGHT=28
BAR_MARGIN=0
BAR_SPACING=6
BAR_PADDING=8
BAR_RADIUS=0
BAR_OPACITY=1.0
BAR_WORKSPACE_STYLE="numbers"
BAR_MODULES_LEFT="hyprland/workspaces,hyprland/submap"
BAR_MODULES_CENTER="hyprland/window"
BAR_MODULES_RIGHT="weather,updates,netstat,microphone,cpu,memory,worldclock,notifications,clock,custom/power"
