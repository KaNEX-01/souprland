# ---------------------------------------------------------------------------
#  preset: quickshell-dense
#  title: Quickshell — Dense
#  desc: All eight modules the Quickshell bar supports: workspaces, window
#        title, clock, CPU, RAM, volume, network, battery. Square, edge-hugging,
#        fully opaque — this backend's "show everything" extreme.
#
#  Usage:  ./install.sh --bar-preset quickshell-dense
# ---------------------------------------------------------------------------

BAR="quickshell-bar"

BAR_POSITION="top"
BAR_HEIGHT=28
BAR_WIDTH=48
BAR_MARGIN=0
BAR_SPACING=10
BAR_PADDING=10
BAR_RADIUS=0
BAR_OPACITY=1.0
BAR_WORKSPACE_STYLE="dots"
BAR_MODULES_LEFT="hyprland/workspaces,hyprland/window"
BAR_MODULES_CENTER="clock"
BAR_MODULES_RIGHT="cpu,memory,pulseaudio,network,battery"
