# ---------------------------------------------------------------------------
#  preset: st-kizil
#  title: Crimson — Cream-Framed Boxes
#  desc: Script Test. Three floating boxes on black with thin cream frames:
#        icon + clock on the left, Roman-numeral workspaces in the center,
#        system readings in a single box on the right.
#
#  Usage:  ./install.sh --bar-preset st-kizil
# ---------------------------------------------------------------------------

BAR="waybar"
BAR_POSITION="top"
BAR_HEIGHT=30
BAR_MARGIN=8
BAR_SPACING=8
BAR_PADDING=10
BAR_RADIUS=4
BAR_OPACITY=0.94
BAR_WORKSPACE_STYLE="roman"
BAR_CLOCK_FORMAT="%I:%M %p"
BAR_CLOCK_FORMAT_ALT="%d.%m.%Y %H:%M"
BAR_MODULES_LEFT="custom/mic,custom/power,clock"
BAR_MODULES_CENTER="hyprland/workspaces"
BAR_MODULES_RIGHT="cpu,memory,pulseaudio,backlight,battery"
