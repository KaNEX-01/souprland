# ---------------------------------------------------------------------------
#  preset: st-zirve
#  title: Summit — Light Strip, Navy Clock
#  desc: Script Test. A full-width light gray strip: workspaces and a
#        peach network-speed capsule on the left, a solid navy clock capsule
#        in the center, tray and system icons on the right.
#
#  Usage:  ./install.sh --bar-preset st-zirve
# ---------------------------------------------------------------------------

BAR="waybar"
BAR_POSITION="top"
BAR_HEIGHT=30
BAR_MARGIN=0
BAR_SPACING=4
BAR_PADDING=8
BAR_RADIUS=10
BAR_OPACITY=0.96
BAR_WORKSPACE_STYLE="numbers"
BAR_CLOCK_FORMAT="%H:%M · %A %d %B %Y"
BAR_CLOCK_FORMAT_ALT="%H:%M:%S"
BAR_MODULES_LEFT="hyprland/workspaces,network"
BAR_MODULES_CENTER="clock"
BAR_MODULES_RIGHT="tray,cpu,memory,pulseaudio,battery,custom/mic,custom/power"
