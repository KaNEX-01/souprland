# ---------------------------------------------------------------------------
#  preset: hyprpanel-stats
#  title: HyprPanel — Counters Only
#  desc: No workspace indicator; the bar is given over entirely to system
#        counters. For people who track workspaces with Hyprland's own
#        keybindings. The HyprPanel counterpart of Waybar's "stats-only".
#
#  Usage:  ./install.sh --bar-preset hyprpanel-stats
# ---------------------------------------------------------------------------

BAR="hyprpanel"

BAR_POSITION="top"
BAR_HEIGHT=26
BAR_MARGIN=0
BAR_SPACING=6
BAR_PADDING=8
BAR_RADIUS=0
BAR_OPACITY=1.0
BAR_WORKSPACE_STYLE="numbers"
BAR_MODULES_LEFT="hyprland/window"
BAR_MODULES_CENTER=""
BAR_MODULES_RIGHT="cpu,memory,temperature,disk,netstat,updates,clock"
