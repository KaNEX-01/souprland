# ---------------------------------------------------------------------------
#  preset: glass
#  title: Frosted Glass
#  desc: Fully floating, with heavy rounding and low opacity for a true
#        frosted-glass look — combined with the layerrule blur Hyprland
#        already applies to the waybar layer (see windowrules.conf) it becomes
#        a translucent capsule with a blurred backdrop. The active workspace
#        stands out with a subtle glow (box-shadow).
#
#  Usage:  ./install.sh --bar-preset glass
#
#  NOTE — this preset was NOT derived from a reference in temaornek/. Every
#  other preset is the measured equivalent of a rice screenshot; this one is
#  a pure style choice from the modern glassmorphism trend (e.g.
#  hyprland-glass, sivert-oss/hypr-glass). That is why no profile uses it —
#  it is here for users to pick directly.
#
#  Also: the actual blur comes from `layerrule = blur`, and that rule applies
#  to EVERY bar preset (see windowrules.conf), not just this one. What really
#  sets this preset apart is low opacity + heavy rounding + a tall bar, plus
#  the thin top glow.
#
#  Bar presets ONLY define layout; color always comes from THEME.
#  That way every bar preset works with every theme.
# ---------------------------------------------------------------------------

BAR_POSITION="top"
BAR_HEIGHT=42
BAR_MARGIN=10
BAR_SPACING=14
BAR_PADDING=14
BAR_RADIUS=20
BAR_OPACITY=0.5
BAR_WORKSPACE_STYLE="pill-expand"
BAR_MODULES_LEFT="hyprland/workspaces"
BAR_MODULES_CENTER="hyprland/window"
BAR_MODULES_RIGHT="pulseaudio,network,bluetooth,battery,tray,clock,custom/mic,custom/power"
