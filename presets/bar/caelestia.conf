# ---------------------------------------------------------------------------
#  preset: caelestia
#  title: Caelestia — Fluid Shell
#  desc: A tall, generously rounded bar floating clear of the screen edges;
#        media in the center, a workspace capsule on the left. Source:
#        caelestia-dots/shell (Quickshell/QML, GitHub's most-starred
#        Hyprland shell). Requires the Quickshell backend.
#
#  Usage:  ./install.sh --bar-preset caelestia
# ---------------------------------------------------------------------------

BAR="quickshell-bar"

BAR_POSITION="top"
BAR_HEIGHT=36
BAR_MARGIN=10
BAR_SPACING=12
BAR_PADDING=14
BAR_RADIUS=20
BAR_OPACITY=0.82
BAR_WORKSPACE_STYLE="pill-expand"
BAR_MODULES_LEFT="hyprland/workspaces,hyprland/window"
BAR_MODULES_CENTER="mpris"
BAR_MODULES_RIGHT="pulseaudio,network,battery,tray,clock"
