# ---------------------------------------------------------------------------
#  preset: st-yaprak
#  title: Leaf — Material Top Bar
#  desc: Script Test. A dark, slightly transparent edge-to-edge bar: active
#        window on the left, workspace capsules with number + app icons in the
#        center, tray, weather, connections and a two-line clock on the right.
#
#  Usage:  ./install.sh --bar-preset st-yaprak
# ---------------------------------------------------------------------------

BAR="waybar"
BAR_POSITION="top"
BAR_HEIGHT=40
BAR_MARGIN=0
BAR_SPACING=6
BAR_PADDING=10
BAR_RADIUS=10
BAR_OPACITY=0.88
BAR_WORKSPACE_STYLE="id-icons"
BAR_CLOCK_FORMAT="%I:%M %p%n%a, %d %b %Y"
BAR_CLOCK_FORMAT_ALT="%H:%M · %d.%m.%Y"
BAR_WINDOW_MAX_LENGTH=40
BAR_MODULES_LEFT="hyprland/window"
BAR_MODULES_CENTER="hyprland/workspaces"
BAR_MODULES_RIGHT="tray,custom/weather,pulseaudio,network,bluetooth,battery,clock"
