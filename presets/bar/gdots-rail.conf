# ---------------------------------------------------------------------------
#  preset: gdots-rail
#  title: Gdots — Icon Rail
#  desc: A narrow, square, fully opaque left rail; only occupied workspaces
#        and a few icon-sized indicators. Source: Gdots' vertical side bar
#        (an icon rail colored by pywal16).
#
#  Usage:  ./install.sh --bar-preset gdots-rail
# ---------------------------------------------------------------------------

BAR_POSITION="left"
BAR_WIDTH=40
BAR_MARGIN=0
BAR_SPACING=10
BAR_PADDING=6
BAR_RADIUS=0
BAR_OPACITY=1.0
BAR_WORKSPACE_STYLE="occupied-only"
BAR_CLOCK_FORMAT="%H%n%M"
BAR_MODULES_LEFT="hyprland/workspaces"
BAR_MODULES_CENTER=""
BAR_MODULES_RIGHT="pulseaudio,battery,clock"
