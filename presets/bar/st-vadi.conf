# ---------------------------------------------------------------------------
#  preset: st-vadi
#  title: Valley — Left Rail (Quickshell)
#  desc: Script Test. A Quickshell left rail: dot workspaces on top, clock and
#        system indicators at the bottom; thin and semi-transparent, with the
#        side-bar feel of niri desktops.
#
#  Usage:  ./install.sh --bar-preset st-vadi
# ---------------------------------------------------------------------------

BAR="quickshell-bar"
BAR_POSITION="left"
BAR_HEIGHT=34
BAR_WIDTH=40
BAR_MARGIN=6
BAR_SPACING=12
BAR_PADDING=12
BAR_RADIUS=18
BAR_OPACITY=0.55
BAR_WORKSPACE_STYLE="dots"
BAR_CLOCK_FORMAT="%H%n%M"
BAR_MODULES_LEFT="hyprland/workspaces"
BAR_MODULES_CENTER="clock"
BAR_MODULES_RIGHT="pulseaudio,network,bluetooth,battery"
