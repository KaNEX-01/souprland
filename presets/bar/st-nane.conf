# ---------------------------------------------------------------------------
#  preset: st-nane
#  title: Mint — Floating Center Pill
#  desc: Script Test. A single thin pill floating mid-screen: numbered
#        workspaces on the left (active one a filled circle), clock in the
#        center, a row of icons on the right. Dark mint base, bright mint frame.
#
#  Usage:  ./install.sh --bar-preset st-nane
# ---------------------------------------------------------------------------

BAR="waybar"
BAR_POSITION="top"
BAR_HEIGHT=28
BAR_MARGIN=8
BAR_SPACING=4
BAR_PADDING=8
BAR_RADIUS=8
BAR_OPACITY=0.82
BAR_WORKSPACE_STYLE="numbers"
BAR_CLOCK_FORMAT="%I:%M %p"
BAR_CLOCK_FORMAT_ALT="%a %d %b"
BAR_MODULES_LEFT=""
BAR_MODULES_CENTER="hyprland/workspaces,clock,tray,pulseaudio,bluetooth,network,custom/mic,custom/power"
BAR_MODULES_RIGHT=""
