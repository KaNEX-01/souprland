# ---------------------------------------------------------------------------
#  preset: st-limon
#  title: Lemon — Black Side Rail
#  desc: Script Test. A thin black rail on the left, floating rather than
#        hugging the edges: lemon dot workspaces on top, a two-line clock in
#        the middle, volume and power at the bottom. Cards (widgets) fill the desktop.
#
#  Usage:  ./install.sh --bar-preset st-limon
# ---------------------------------------------------------------------------

BAR="waybar"
BAR_POSITION="left"
BAR_WIDTH=36
BAR_HEIGHT=34
BAR_MARGIN=8
BAR_SPACING=12
BAR_PADDING=8
BAR_RADIUS=18
BAR_OPACITY=0.95
BAR_WORKSPACE_STYLE="dots"
BAR_CLOCK_FORMAT="%H%n%M"
BAR_CLOCK_FORMAT_ALT="%d%n%m"
BAR_MODULES_LEFT="hyprland/workspaces"
BAR_MODULES_CENTER="clock"
BAR_MODULES_RIGHT="pulseaudio,network,custom/mic,custom/power"
