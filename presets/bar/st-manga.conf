# ---------------------------------------------------------------------------
#  preset: st-manga
#  title: Manga — White Side Rail
#  desc: Script Test. A paper-white vertical rail on the left: dot workspaces,
#        a two-line clock in the middle, mic/network/bluetooth icons and the
#        power button at the bottom. So plain it barely has a background.
#
#  Usage:  ./install.sh --bar-preset st-manga
# ---------------------------------------------------------------------------

BAR="waybar"
BAR_POSITION="left"
BAR_WIDTH=44
BAR_HEIGHT=34
BAR_MARGIN=0
BAR_SPACING=10
BAR_PADDING=8
BAR_RADIUS=12
BAR_OPACITY=1.0
BAR_WORKSPACE_STYLE="dots"
BAR_CLOCK_FORMAT="%H%n%M"
BAR_CLOCK_FORMAT_ALT="%d%n%m"
BAR_MODULES_LEFT="custom/mic,custom/power,hyprland/workspaces"
BAR_MODULES_CENTER="clock"
BAR_MODULES_RIGHT="pulseaudio,network,bluetooth"
