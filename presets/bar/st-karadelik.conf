# ---------------------------------------------------------------------------
#  preset: st-karadelik
#  title: Black Hole — On the Frame
#  desc: Script Test. A thin, backgroundless strip that melts into the screen
#        frame: battery and dot workspaces on the left, a small two-line
#        time-date in the center, only network, volume and power icons right.
#
#  Usage:  ./install.sh --bar-preset st-karadelik
# ---------------------------------------------------------------------------

BAR="waybar"
BAR_POSITION="top"
BAR_HEIGHT=34
BAR_MARGIN=0
BAR_SPACING=10
BAR_PADDING=6
BAR_RADIUS=0
BAR_OPACITY=1.0
BAR_WORKSPACE_STYLE="dots"
BAR_CLOCK_FORMAT="%I:%M %p%n%a %m/%d/%Y"
BAR_CLOCK_FORMAT_ALT="%H:%M"
BAR_MODULES_LEFT="battery,hyprland/workspaces"
BAR_MODULES_CENTER="clock"
BAR_MODULES_RIGHT="network,pulseaudio,custom/mic,custom/power"
