# ---------------------------------------------------------------------------
#  preset: quickshell-dock
#  title: Quickshell — Bottom Pill
#  desc: A floating, heavily rounded pill at the bottom, clear of the edges.
#        Focused window in the center, volume/battery/clock on the right.
#
#  Usage:  ./install.sh --bar-preset quickshell-dock
# ---------------------------------------------------------------------------

BAR="quickshell-bar"

BAR_POSITION="bottom"
BAR_HEIGHT=40
BAR_WIDTH=48
BAR_MARGIN=12
BAR_SPACING=12
BAR_PADDING=16
BAR_RADIUS=20
BAR_OPACITY=0.8
BAR_WORKSPACE_STYLE="dots"
BAR_MODULES_LEFT="hyprland/workspaces"
BAR_MODULES_CENTER="hyprland/window"
BAR_MODULES_RIGHT="pulseaudio,battery,clock"
