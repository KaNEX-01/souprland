# ---------------------------------------------------------------------------
#  preset: st-galaksi
#  title: Galaxy — Pixel Tiles
#  desc: Script Test. Small pixel tiles with thin frames on a transparent base:
#        window name on the left, dot workspaces in the center, now playing,
#        tray and clock on the right. Slightly rounded corners.
#
#  Usage:  ./install.sh --bar-preset st-galaksi
# ---------------------------------------------------------------------------

BAR="waybar"
BAR_POSITION="top"
BAR_HEIGHT=27
BAR_MARGIN=4
BAR_SPACING=4
BAR_PADDING=6
BAR_RADIUS=5
BAR_OPACITY=0.75
BAR_WORKSPACE_STYLE="dots"
BAR_CLOCK_FORMAT="%H:%M"
BAR_CLOCK_FORMAT_ALT="%a %d %b"
BAR_WINDOW_MAX_LENGTH=30
BAR_MODULES_LEFT="hyprland/window"
BAR_MODULES_CENTER="hyprland/workspaces"
BAR_MODULES_RIGHT="mpris,tray,pulseaudio,network,clock"
