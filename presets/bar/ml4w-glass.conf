# ---------------------------------------------------------------------------
#  preset: ml4w-glass
#  title: ML4W — Centered Glass
#  desc: ML4W's signature: workspaces in the CENTER, a tall translucent
#        (glass) bar floating clear of the edges. Power and update counter on
#        the left, tray on the right. Source: mylinuxforwork/dotfiles (ML4W).
#
#  Usage:  ./install.sh --bar-preset ml4w-glass
# ---------------------------------------------------------------------------

BAR_POSITION="top"
BAR_HEIGHT=38
BAR_MARGIN=10
BAR_SPACING=10
BAR_PADDING=14
BAR_RADIUS=16
BAR_OPACITY=0.55
BAR_WORKSPACE_STYLE="numbers"
BAR_MODULES_LEFT="custom/mic,custom/power,updates,hyprland/window"
BAR_MODULES_CENTER="hyprland/workspaces"
BAR_MODULES_RIGHT="pulseaudio,backlight,network,battery,clock,tray"
