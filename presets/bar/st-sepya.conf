# ---------------------------------------------------------------------------
#  preset: st-sepya
#  title: Sepia — Framed Strip
#  desc: Script Test. A single full-width strip with a 2px dark-brown frame;
#        only occupied workspaces as plain digits on the left, network, volume
#        and date-time boxes on the right, each in its own small frame.
#
#  Usage:  ./install.sh --bar-preset st-sepya
# ---------------------------------------------------------------------------

BAR="waybar"
BAR_POSITION="top"
BAR_HEIGHT=30
BAR_MARGIN=10
BAR_SPACING=6
BAR_PADDING=8
BAR_RADIUS=0
BAR_OPACITY=1.0
BAR_WORKSPACE_STYLE="occupied-only"
BAR_CLOCK_FORMAT="%a %d-%m-%Y %H:%M"
BAR_CLOCK_FORMAT_ALT="%H:%M:%S"
BAR_MODULES_LEFT="hyprland/workspaces"
BAR_MODULES_CENTER=""
BAR_MODULES_RIGHT="network,pulseaudio,clock"
