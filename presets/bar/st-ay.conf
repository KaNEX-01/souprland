# ---------------------------------------------------------------------------
#  preset: st-ay
#  title: Moon — Colorful Capsules
#  desc: Script Test. Backgroundless floating capsules: search/settings + boxed
#        workspaces + now playing on the left, a two-line clock and weather in
#        the center, network, bluetooth, volume and battery capsules on the
#        right, each filled with its own pastel.
#
#  Usage:  ./install.sh --bar-preset st-ay
# ---------------------------------------------------------------------------

BAR="waybar"
BAR_POSITION="top"
BAR_HEIGHT=36
BAR_MARGIN=6
BAR_SPACING=6
BAR_PADDING=9
BAR_RADIUS=8
BAR_OPACITY=0.9
BAR_WORKSPACE_STYLE="numbers"
BAR_CLOCK_FORMAT="%H:%M:%S%n%A, %B %d"
BAR_CLOCK_FORMAT_ALT="%d.%m.%Y"
BAR_MODULES_LEFT="custom/mic,custom/power,hyprland/workspaces,mpris"
BAR_MODULES_CENTER="clock,custom/weather"
BAR_MODULES_RIGHT="tray,network,bluetooth,pulseaudio,battery"
