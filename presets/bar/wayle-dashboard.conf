# ---------------------------------------------------------------------------
#  preset: wayle-dashboard
#  title: Wayle — Dashboard
#  desc: Dashboard button and workspaces on the left, now playing in the
#        center, notification center + device controls on the right. The
#        preset that makes the most of Wayle's drop-down menus.
#
#  Usage:  ./install.sh --bar-preset wayle-dashboard
#
#  Bar presets ONLY define layout; color always comes from THEME.
# ---------------------------------------------------------------------------

BAR="wayle"

BAR_POSITION="top"
BAR_HEIGHT=38
BAR_WIDTH=44
BAR_MARGIN=8
BAR_SPACING=10
BAR_PADDING=12
BAR_RADIUS=14
BAR_OPACITY=0.92
BAR_WORKSPACE_STYLE="pill-expand"
BAR_MODULES_LEFT="dashboard,hyprland/workspaces,hyprland/submap"
BAR_MODULES_CENTER="mpris"
BAR_MODULES_RIGHT="notifications,pulseaudio,bluetooth,network,battery,tray,custom/power"
