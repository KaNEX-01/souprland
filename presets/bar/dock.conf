# ---------------------------------------------------------------------------
#  preset: dock
#  title: Thin Top Bar
#  desc: A thin, square top status bar. Source: nixos, ambxst, kde-nothingos,
#        gnome-tokyo-night, cinnamon, gnome-warm, hyperland.
#
#  Usage:  ./install.sh --bar-preset dock
# ---------------------------------------------------------------------------

BAR_POSITION="top"
BAR_HEIGHT=28
BAR_MARGIN=0
BAR_SPACING=8
BAR_PADDING=10
BAR_RADIUS=0
BAR_OPACITY=0.9
BAR_WORKSPACE_STYLE="dots"
BAR_MODULES_LEFT="hyprland/workspaces,hyprland/submap"
BAR_MODULES_CENTER="clock"
BAR_MODULES_RIGHT="pulseaudio,network,battery,tray"
