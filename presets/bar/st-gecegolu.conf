# ---------------------------------------------------------------------------
#  preset: st-gecegolu
#  title: Night Lake — Thin Mono Strip
#  desc: Script Test. A low, dark purple strip running edge to edge; small
#        mono type. System readings and round workspaces on the left, time
#        and date in the center, volume, battery, connections and window name right.
#
#  Usage:  ./install.sh --bar-preset st-gecegolu
# ---------------------------------------------------------------------------

BAR="waybar"
BAR_POSITION="top"
BAR_HEIGHT=24
BAR_MARGIN=0
BAR_SPACING=4
BAR_PADDING=5
BAR_RADIUS=8
BAR_OPACITY=0.9
BAR_WORKSPACE_STYLE="numbers"
BAR_CLOCK_FORMAT="%H:%M %a %d %B"
BAR_CLOCK_FORMAT_ALT="%d.%m.%Y %H:%M:%S"
BAR_WINDOW_MAX_LENGTH=30
BAR_MODULES_LEFT="cpu,temperature,memory,disk,hyprland/workspaces"
BAR_MODULES_CENTER="clock"
BAR_MODULES_RIGHT="pulseaudio,battery,network,bluetooth,tray,hyprland/window"
