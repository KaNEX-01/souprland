# ---------------------------------------------------------------------------
#  preset: stats-only
#  title: No Workspaces
#  desc: The bar has no workspace indicator at all; only system/media info
#        and the clock. A "the bar informs, it doesn't navigate" approach.
#        Source: gnome-paperwm-bluefin, videoframe_1112.
#
#  Usage:  ./install.sh --bar-preset stats-only
# ---------------------------------------------------------------------------

BAR_POSITION="top"
BAR_HEIGHT=20
BAR_MARGIN=0
BAR_SPACING=8
BAR_PADDING=8
BAR_RADIUS=0
BAR_OPACITY=1.0
BAR_MODULES_LEFT="hyprland/window"
BAR_MODULES_CENTER="mpris"
BAR_MODULES_RIGHT="cpu,memory,temperature,pulseaudio,battery,tray,clock"
