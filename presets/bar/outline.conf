# ---------------------------------------------------------------------------
#  preset: outline
#  title: Outlined Segments
#  desc: Unfilled modules, each sitting in its own box with a 1-pixel outline.
#        A linear look inherited from dwm/dzen — especially legible on
#        light palettes.
#
#  Usage:  ./install.sh --bar-preset outline
#
#  Source: sway-simple-monochrome (docs/gallery-catalog.md §2)
#  In the source the bar is a flat strip; each module on the right ("wifi up",
#  "vol 95%", date) sits on the same background but in boxes set apart by a thin outline.
#  Outlines, not fills, separate them — hence a preset of its own.
# ---------------------------------------------------------------------------

BAR_POSITION="top"
BAR_HEIGHT=26
BAR_MARGIN=0
BAR_SPACING=6
BAR_PADDING=10
BAR_RADIUS=0
BAR_OPACITY=1.0
BAR_WORKSPACE_STYLE="occupied-only"
BAR_MODULES_LEFT="hyprland/workspaces"
BAR_MODULES_CENTER=""
BAR_MODULES_RIGHT="tray,network,pulseaudio,clock"
