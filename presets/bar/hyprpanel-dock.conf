# ---------------------------------------------------------------------------
#  preset: hyprpanel-dock
#  title: HyprPanel — Bottom Dock
#  desc: A floating panel at the bottom, clear of the edges. Dashboard button
#        and workspaces with app icons on the left, quick settings right.
#        HyprPanel only supports top/bottom placement, so "bottom" is this
#        backend's only real layout alternative.
#
#  Usage:  ./install.sh --bar-preset hyprpanel-dock
# ---------------------------------------------------------------------------

BAR="hyprpanel"

BAR_POSITION="bottom"
BAR_HEIGHT=42
BAR_MARGIN=10
BAR_SPACING=12
BAR_PADDING=14
BAR_RADIUS=20
BAR_OPACITY=0.85
BAR_WORKSPACE_STYLE="app-icons"
BAR_MODULES_LEFT="dashboard,hyprland/workspaces"
BAR_MODULES_CENTER="hyprland/window"
BAR_MODULES_RIGHT="pulseaudio,network,bluetooth,battery,clock"
