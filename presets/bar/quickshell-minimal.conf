# ---------------------------------------------------------------------------
#  preset: quickshell-minimal
#  title: Quickshell — Minimal
#  desc: Workspace dots on the left, clock on the right. Uses Quickshell's
#        single-process design at the lowest information density; for those
#        who want to leave the information load to desktop widgets.
#
#  Usage:  ./install.sh --bar-preset quickshell-minimal
#
#  Bar presets ONLY define layout; color always comes from THEME.
# ---------------------------------------------------------------------------

BAR="quickshell-bar"

BAR_POSITION="top"
BAR_HEIGHT=26
BAR_WIDTH=44
BAR_MARGIN=0
BAR_SPACING=8
BAR_PADDING=10
BAR_RADIUS=0
BAR_OPACITY=0.85
BAR_WORKSPACE_STYLE="dots"
BAR_MODULES_LEFT="hyprland/workspaces"
BAR_MODULES_CENTER=""
BAR_MODULES_RIGHT="clock"
