# ---------------------------------------------------------------------------
#  preset: wayle-rail
#  title: Wayle — Vertical Rail
#  desc: A vertical rail on the left. Wayle supports vertical layout natively
#        (unlike HyprPanel, it doesn't fall back to the top); leaves horizontal
#        space to windows on wide screens.
#
#  Usage:  ./install.sh --bar-preset wayle-rail
#
#  Bar presets ONLY define layout; color always comes from THEME.
# ---------------------------------------------------------------------------

BAR="wayle"

BAR_POSITION="left"
BAR_HEIGHT=38
BAR_WIDTH=48
BAR_MARGIN=6
BAR_SPACING=10
BAR_PADDING=10
BAR_RADIUS=12
BAR_OPACITY=0.9
BAR_WORKSPACE_STYLE="dots"
BAR_MODULES_LEFT="dashboard,hyprland/workspaces"
BAR_MODULES_CENTER=""
BAR_MODULES_RIGHT="pulseaudio,network,battery,clock,custom/power"
