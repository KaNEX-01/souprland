# ---------------------------------------------------------------------------
#  preset: wayle-minimal
#  title: Wayle — Minimal
#  desc: Workspaces on the left, volume/network/clock on the right. Wayle's
#        built-in notification center and OSD already run, so the bar
#        needn't carry information; the lowest density.
#
#  Usage:  ./install.sh --bar-preset wayle-minimal
#
#  Bar presets ONLY define layout; color always comes from THEME.
# ---------------------------------------------------------------------------

BAR="wayle"

BAR_POSITION="top"
BAR_HEIGHT=30
BAR_WIDTH=44
BAR_MARGIN=0
BAR_SPACING=8
BAR_PADDING=10
BAR_RADIUS=0
BAR_OPACITY=1.0
BAR_WORKSPACE_STYLE="dots"
BAR_MODULES_LEFT="hyprland/workspaces"
BAR_MODULES_CENTER=""
BAR_MODULES_RIGHT="pulseaudio,network,clock"
