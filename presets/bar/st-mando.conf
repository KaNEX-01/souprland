# ---------------------------------------------------------------------------
#  preset: st-mando
#  title: Mando — Row of Framed Capsules
#  desc: Script Test. On a dark steel strip every module sits in its own
#        thin sand-colored capsule: workspaces and CPU/memory on the left, a
#        clock in the center instead of a window counter, network, volume, battery and power right.
#
#  Usage:  ./install.sh --bar-preset st-mando
# ---------------------------------------------------------------------------

BAR="waybar"
BAR_POSITION="top"
BAR_HEIGHT=35
BAR_MARGIN=4
BAR_SPACING=4
BAR_PADDING=8
BAR_RADIUS=6
BAR_OPACITY=0.9
BAR_WORKSPACE_STYLE="pill-expand"
BAR_CLOCK_FORMAT="%I:%M %p"
BAR_CLOCK_FORMAT_ALT="%A %d %B"
BAR_MODULES_LEFT="hyprland/workspaces,cpu,memory"
BAR_MODULES_CENTER="clock"
BAR_MODULES_RIGHT="tray,network,pulseaudio,battery,custom/mic,custom/power"
