# ---------------------------------------------------------------------------
#  preset: jakoolit-simple-l
#  title: JaKooLit — Simple-L
#  desc: Workspaces + window on the left, clock in the center, tray and power
#        button as a capsule on the right; thin edge margin, medium rounding.
#        Source: JaKooLit/Hyprland-Dots' "Simple-L [TOP]" Waybar layout.
#
#  Usage:  ./install.sh --bar-preset jakoolit-simple-l
# ---------------------------------------------------------------------------

BAR_POSITION="top"
BAR_HEIGHT=32
BAR_MARGIN=6
BAR_SPACING=8
BAR_PADDING=12
BAR_RADIUS=12
BAR_OPACITY=0.85
BAR_WORKSPACE_STYLE="numbers"
BAR_MODULES_LEFT="hyprland/workspaces,hyprland/submap,hyprland/window"
BAR_MODULES_CENTER="clock"
BAR_MODULES_RIGHT="idle_inhibitor,pulseaudio,backlight,network,bluetooth,battery,tray,custom/mic,custom/power"
