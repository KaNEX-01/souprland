# ---------------------------------------------------------------------------
#  preset: st-gunbatimi
#  title: Sunset — Black Strip
#  desc: Script Test. A jet-black, thin edge-to-edge strip; single-color
#        (salmon) text. Workspaces as framed tiles next to the window name;
#        only icons, battery and date on the right.
#
#  Usage:  ./install.sh --bar-preset st-gunbatimi
# ---------------------------------------------------------------------------

BAR="waybar"
BAR_POSITION="top"
BAR_HEIGHT=32
BAR_MARGIN=0
BAR_SPACING=4
BAR_PADDING=8
BAR_RADIUS=3
BAR_OPACITY=1.0
BAR_WORKSPACE_STYLE="numbers"
BAR_CLOCK_FORMAT="%a %d %b %H:%M"
BAR_CLOCK_FORMAT_ALT="%d.%m.%Y %H:%M:%S"
BAR_WINDOW_MAX_LENGTH=50
BAR_MODULES_LEFT="hyprland/workspaces,hyprland/window"
BAR_MODULES_CENTER=""
BAR_MODULES_RIGHT="idle_inhibitor,tray,bluetooth,network,battery,clock"
