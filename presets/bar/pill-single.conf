# ---------------------------------------------------------------------------
#  preset: pill-single
#  title: Single Long Pill
#  desc: All modules inside one rounded pill; the pill is centered and
#        narrower than the screen. Unlike islands, it is not split into groups.
#        Source: hyprlust (top bar), kde-no-waifu, evercal, videoframe_690.
#        Few modules fit in one pill (it looks cluttered when full) — the
#        lowest information density.
#
#  Usage:  ./install.sh --bar-preset pill-single
# ---------------------------------------------------------------------------

BAR_POSITION="top"
BAR_HEIGHT=32
BAR_MARGIN=6
BAR_SPACING=14
BAR_PADDING=16
BAR_RADIUS=16
BAR_OPACITY=0.95
BAR_WORKSPACE_STYLE="dots"
BAR_MODULES_LEFT="hyprland/workspaces"
BAR_MODULES_CENTER=""
BAR_MODULES_RIGHT="tray,clock"
