# ---------------------------------------------------------------------------
#  preset: hyprpanel-minimal
#  title: HyprPanel — Minimal
#  desc: HyprPanel at its leanest: workspaces, volume, battery and clock.
#        The menus (dashboard, notification center) stay installed but take
#        no bar space — for those who want the menus without the heavy panel.
#
#  Usage:  ./install.sh --bar-preset hyprpanel-minimal
#
#  Bar presets ONLY define layout; color always comes from THEME.
# ---------------------------------------------------------------------------

BAR="hyprpanel"

BAR_POSITION="top"
BAR_HEIGHT=30
BAR_MARGIN=0
BAR_SPACING=8
BAR_PADDING=10
BAR_RADIUS=0
BAR_OPACITY=0.95
BAR_WORKSPACE_STYLE="dots"
BAR_MODULES_LEFT="hyprland/workspaces"
BAR_MODULES_CENTER=""
BAR_MODULES_RIGHT="pulseaudio,battery,clock"
