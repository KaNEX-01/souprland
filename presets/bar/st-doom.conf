# ---------------------------------------------------------------------------
#  preset: st-doom
#  title: DOOM — Square HUD
#  desc: Script Test. A black-ember strip, thin orange frames and square
#        brackets: workspaces inside [ ] on the left, an all-caps window name
#        in the center, CPU/memory/temperature readings and clock on the right.
#
#  Usage:  ./install.sh --bar-preset st-doom
# ---------------------------------------------------------------------------

BAR="waybar"
BAR_POSITION="top"
BAR_HEIGHT=29
BAR_MARGIN=4
BAR_SPACING=4
BAR_PADDING=6
BAR_RADIUS=0
BAR_OPACITY=0.88
BAR_WORKSPACE_STYLE="bracket"
BAR_CLOCK_FORMAT="%a %d %b · %H:%M"
BAR_CLOCK_FORMAT_ALT="%H:%M:%S"
BAR_WINDOW_MAX_LENGTH=40
BAR_MODULES_LEFT="hyprland/workspaces"
BAR_MODULES_CENTER="hyprland/window"
BAR_MODULES_RIGHT="cpu,memory,temperature,pulseaudio,clock"
