# ---------------------------------------------------------------------------
#  preset: st-kule
#  title: Tower — Night Strip
#  desc: Personal. A semi-transparent (blurred), soft night strip flush with
#        the top of the screen (no corners); accents shaped as pills.
#        Workspace number with icons of its open windows on the left, a
#        detailed player capsule in the center (title · artist · position/length,
#        prev/play/next; click for a media panel with cover art), and on the
#        right CPU, memory, volume, network, tray, clock and power.
#
#  Usage:  ./install.sh --bar-preset st-kule
# ---------------------------------------------------------------------------

BAR="waybar"
BAR_POSITION="top"
BAR_HEIGHT=34
BAR_MARGIN=0
BAR_SPACING=0
BAR_PADDING=2
BAR_RADIUS=0
BAR_OPACITY=0.78
BAR_WORKSPACE_STYLE="id-icons"
BAR_CLOCK_FORMAT="%H:%M"
BAR_CLOCK_FORMAT_ALT="%A %d %B"
BAR_WINDOW_MAX_LENGTH=40
BAR_MODULES_LEFT="hyprland/workspaces,hyprland/window"
BAR_MODULES_CENTER="custom/media,custom/media-prev,custom/media-play,custom/media-next,custom/shazam"
BAR_MODULES_RIGHT="custom/gamemode,custom/updates,cpu,memory,pulseaudio,network,bluetooth,tray,custom/notifications,clock,custom/mic,custom/power"
