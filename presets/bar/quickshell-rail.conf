# ---------------------------------------------------------------------------
#  preset: quickshell-rail
#  title: Quickshell — Vertical Rail
#  desc: A vertical rail on the left edge; workspace dots on top, counters
#        and clock at the bottom. No window title, on purpose — it would be
#        unreadable on a narrow rail. The Quickshell take on Waybar's "rail"
#        preset; HyprPanel does not support this position at all.
#
#  Usage:  ./install.sh --bar-preset quickshell-rail
# ---------------------------------------------------------------------------

BAR="quickshell-bar"

BAR_POSITION="left"
BAR_HEIGHT=34
BAR_WIDTH=46
BAR_MARGIN=6
BAR_SPACING=14
BAR_PADDING=14
BAR_RADIUS=16
BAR_OPACITY=0.9
BAR_WORKSPACE_STYLE="dots"
BAR_MODULES_LEFT="hyprland/workspaces"
BAR_MODULES_CENTER=""
BAR_MODULES_RIGHT="cpu,memory,battery,clock"
