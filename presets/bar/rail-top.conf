# ---------------------------------------------------------------------------
#  preset: rail-top
#  title: Left Rail + Top Bar
#  desc: A vertical app-icon strip on the left edge and a thin status bar on
#        top. Unlike "rail", the rail carries no information — the top bar
#        does, and the rail stays an app strip.
#
#  Usage:  ./install.sh --bar-preset rail-top
#
#  Source: videoframe_2481 (mando), videoframe_1509 (alpine),
#          niri-my-abomination (docs/gallery-catalog.md §2)
#  In these three references there is also a top bar NEXT TO the left rail; the
#  "rail" preset alone only produced the rail and the top bar was lost. Here Waybar
#  emits a two-element bar array (see render.py → BAR_MULTI / BAR_HAS_RAIL).
#
#  BAR_POSITION is "top" ON PURPOSE here: the first element of the array is the
#  main bar carrying all the module definitions; the rail is added second.
#  BAR_WIDTH sets the rail's width.
# ---------------------------------------------------------------------------

BAR_POSITION="top"
BAR_HEIGHT=24
BAR_WIDTH=48
BAR_MARGIN=0
BAR_SPACING=8
BAR_PADDING=8
BAR_RADIUS=0
BAR_OPACITY=0.9
BAR_WORKSPACE_STYLE="dots"
BAR_MODULES_LEFT="hyprland/workspaces,cpu,memory"
BAR_MODULES_CENTER="mpris"
BAR_MODULES_RIGHT="pulseaudio,network,battery,tray,clock"
