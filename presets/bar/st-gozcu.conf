# ---------------------------------------------------------------------------
#  preset: st-gozcu
#  title: Sentinel — Green Moon Strip
#  desc: Personal. A semi-transparent (blurred) charcoal strip flush with the
#        top of the screen. Workspace number + window icons on the left (the
#        active one a mint-green pill), a detailed player capsule in the
#        center, metrics, tray, clock pill and power on the right.
#
#  Usage:  ./install.sh --bar-preset st-gozcu
# ---------------------------------------------------------------------------

BAR="waybar"
BAR_POSITION="top"
BAR_HEIGHT=34
BAR_MARGIN=0
BAR_SPACING=0
BAR_PADDING=2
BAR_RADIUS=0
BAR_OPACITY=0.78
BAR_WORKSPACE_STYLE="id-icons"
BAR_CLOCK_FORMAT="%H:%M"
BAR_CLOCK_FORMAT_ALT="%A %d %B"
BAR_WINDOW_MAX_LENGTH=40
BAR_MODULES_LEFT="hyprland/workspaces,hyprland/window"
BAR_MODULES_CENTER="custom/media,custom/media-prev,custom/media-play,custom/media-next,custom/shazam"
BAR_MODULES_RIGHT="custom/gamemode,custom/updates,cpu,memory,pulseaudio,network,bluetooth,tray,custom/notifications,clock,custom/mic,custom/power"
