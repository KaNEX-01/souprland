# ---------------------------------------------------------------------------
#  preset: st-lavanta
#  title: Lavender — i3 Status Line
#  desc: Script Test. A full-width, boxless text line at the bottom: workspaces
#        with number + window icons, the active one on lavender; on the right
#        a long run of readings separated by vertical bars.
#
#  Usage:  ./install.sh --bar-preset st-lavanta
# ---------------------------------------------------------------------------

BAR="waybar"
BAR_POSITION="bottom"
BAR_HEIGHT=24
BAR_MARGIN=0
BAR_SPACING=0
BAR_PADDING=6
BAR_RADIUS=0
BAR_OPACITY=0.96
BAR_WORKSPACE_STYLE="id-icons"
BAR_CLOCK_FORMAT="%a %d %b %H:%M:%S"
BAR_CLOCK_FORMAT_ALT="%Y-%m-%d"
BAR_MODULES_LEFT="hyprland/workspaces"
BAR_MODULES_CENTER=""
BAR_MODULES_RIGHT="battery,pulseaudio,backlight,cpu,memory,disk,network,clock"
