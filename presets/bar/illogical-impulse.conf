# ---------------------------------------------------------------------------
#  preset: illogical-impulse
#  title: Illogical Impulse — Material 3
#  desc: Material Design 3 proportions: medium height, wide corner radius,
#        clock in the center, a cluster of counters on the right. Source:
#        end-4/dots-hyprland (illogical-impulse) — a setup that uses
#        Quickshell instead of Waybar and derives its colors from the
#        wallpaper. This preset is likewise meant to be used with THEME="auto".
#
#  Usage:  ./install.sh --bar-preset illogical-impulse
# ---------------------------------------------------------------------------

BAR="quickshell-bar"

BAR_POSITION="top"
BAR_HEIGHT=38
BAR_MARGIN=8
BAR_SPACING=10
BAR_PADDING=16
BAR_RADIUS=18
BAR_OPACITY=0.9
BAR_WORKSPACE_STYLE="dots"
BAR_MODULES_LEFT="hyprland/workspaces,hyprland/submap"
BAR_MODULES_CENTER="clock"
BAR_MODULES_RIGHT="cpu,memory,pulseaudio,network,battery,tray"
