# ilyamiro/imperative-dots — r/unixporn "[Hyprland] As fluid as it gets" (15)
# and early versions of the same shell: r/hyprland "Matugen with quickshell" (7),
# "A beautiful dashboard with weather" (8).
# Post 15: 2026-03-30 ("first official release"); imperative-dots started on 2026-03-29.
# Matugen/kitty/rofi arrived with the 2026-04-01 release; that day's first consistent commit
# is the one installed. 7 and 8 were in a NixOS repo; that history was lost when the author
# renamed the repo to serpantinum — this version of the same shell
# also produces those looks (colors from the wallpaper via matugen).
#
# The author's install.sh links the .config folders, copies the fonts and
# adapts hyprland.conf to the machine (monitor, personal app keybindings,
# WALLPAPER_DIR/SCRIPT_DIR). The same adaptations are made below.

default_variant = "gunbatimi"
shims = ["swww"]

post_install = [
  "fc-cache -f ~/.local/share/fonts/imperative-dots >/dev/null 2>&1 || true",
  "chmod +x -R ~/.config/hypr/scripts 2>/dev/null || true",
  "hyprctl reload >/dev/null 2>&1 || true",
]

notes = [
  "Wallpapers are downloaded from the author's shell-wallpapers repo via a raw URL pinned to the commit containing the file (no license stated; not copied into the repo).",
  "OpenWeather key for the weather: ~/.config/hypr/scripts/quickshell/calendar/.env (OWM_API_KEY=...).",
  "Posts 7 and 8 are early NixOS versions of this shell; the layout speaks the same language as this version, details may differ.",
]

[source]
repo = "https://github.com/ilyamiro/imperative-dots"
commit = "bd8561bd6115e0adfb3f2ace2d84cc91e521eb82"
post = "https://www.reddit.com/r/unixporn/comments/1s84jik/hyprland_as_fluid_as_it_gets/"
license = ""

[[install]]
from = ".config/hypr"
to = "~/.config/hypr"
[[install]]
from = ".config/kitty"
to = "~/.config/kitty"
[[install]]
from = ".config/rofi"
to = "~/.config/rofi"
[[install]]
from = ".config/swaync"
to = "~/.config/swaync"
[[install]]
from = ".config/matugen"
to = "~/.config/matugen"
[[install]]
from = ".config/cava"
to = "~/.config/cava"
[[install]]
from = ".local/share/fonts"
to = "~/.local/share/fonts/imperative-dots"
[[install]]
from = ".config/zsh"
to = "~/.config/zsh"
group = "shell"
[[install]]
from = ".config/nvim"
to = "~/.config/nvim"
group = "editor"

[[fix]]
file = "~/.config/hypr/hyprland.conf"
replace = [
  "monitor = eDP-1, 1920x1080@144, 0x0, 1.0", "monitor = ,preferred,auto,1",
  "bind = $mainMod, F, exec, firefox", "# (hyprsetup: removed by the author's install.sh) bind = $mainMod, F, exec, firefox",
  "bind = $mainMod, T, exec, Telegram", "# (hyprsetup: removed by the author's install.sh) bind = $mainMod, T, exec, Telegram",
  "bind = $mainMod, O, exec, obsidian", "# (hyprsetup: removed by the author's install.sh) bind = $mainMod, O, exec, obsidian",
  "env = NIXOS_OZONE_WL,1", "env = NIXOS_OZONE_WL,1\nenv = WALLPAPER_DIR,{home}/Pictures/Wallpapers\nenv = SCRIPT_DIR,{home}/.config/hypr/scripts",
]
why = "the adaptations the author's install.sh makes (monitor, personal apps, paths)"
[[fix]]
file = "~/.config/hypr/user_prefs.conf"
create = "# Auto-generated by install script (hyprsetup)\n$wallpaper_dir = {home}/Pictures/Wallpapers\n"
why = "created by the author's install.sh"
[[fix]]
file = "~/.config/hypr/scripts/quickshell/wallpaper/WallpaperPicker.qml"
replace = ['Quickshell.env("HOME") + "/Images/Wallpapers"', 'Quickshell.env("WALLPAPER_DIR")',
           'matugen image "$FINAL_THUMB"', 'matugen image "$FINAL_THUMB" --source-color-index 0',
           'matugen image "$THUMB_FILE"', 'matugen image "$THUMB_FILE" --source-color-index 0']
why = "the author's install.sh does it; matugen 4 asks a question when there are several source colors — the author added the same flag in later versions"
[[fix]]
file = "~/.config/hypr/scripts/quickshell/calendar/diary_manager.sh"
delete = true
why = "the author's install.sh deletes it (personal)"
[[fix]]
file = "~/.config/hypr/scripts/quickshell/TopBar.qml"
replace = [
  "import Quickshell.Services.SystemTray\n\nPanelWindow {\n    id: barWindow\n",
  "import Quickshell.Services.SystemTray\n\n// hyprsetup: one bar per display\nVariants {\nmodel: Quickshell.screens\ndelegate: Component {\nPanelWindow {\n    id: barWindow\n    required property var modelData\n    screen: modelData\n",
  "workspaces.sh > /tmp/qs_workspaces.json\"]\n        running: true",
  "workspaces.sh > /tmp/qs_workspaces.json\"]\n        // hyprsetup: a single writer; all bars read the same file\n        running: barWindow.modelData === Quickshell.screens[0]",
]
append = "}  // hyprsetup: Component\n}  // hyprsetup: Variants\n"
why = "in this version the bar is a single PanelWindow (on one display only); the author added the same Variants wrapper in a later version (ilyamiro-ay)"

[packages]
repo = ["kitty", "cava", "rofi", "swaync", "pavucontrol", "alsa-utils", "awww",
        "wl-clipboard", "fd", "qt6-multimedia", "qt6-5compat", "ripgrep", "cliphist",
        "jq", "socat", "pamixer", "brightnessctl", "acpi", "iw", "bluez", "bluez-utils",
        "libnotify", "networkmanager", "lm_sensors", "bc", "pulseaudio-alsa", "ladspa",
        "imagemagick", "wget", "file", "psmisc", "ffmpeg", "fastfetch", "quickshell",
        "grim", "playerctl", "satty", "yq", "xdg-desktop-portal-gtk", "slurp", "wmctrl",
        "power-profiles-daemon", "matugen"]
aur = ["networkmanager-dmenu-git", "mpvpaper"]

[variants.gunbatimi]
title = "Mountain lake at sunset (lemon)"
wallpaper = "https://raw.githubusercontent.com/ilyamiro/shell-wallpapers/4b940811d375a5553ac97ac8824e571b9a5bace7/images/ddg_1774891011316616769.jpg"
wallpaper_dest = "~/Pictures/Wallpapers/ilyamiro-gunbatimi.jpg"
apply = [
  "cp {wallpaper} /tmp/lock_bg.png",
  "pkill mpvpaper || true",
  "swww img {wallpaper} --transition-type grow --transition-pos 0.5,0.5 --transition-fps 144 --transition-duration 1 &",
  "matugen image {wallpaper} --source-color-index 0 && bash ~/.config/hypr/scripts/quickshell/wallpaper/matugen_reload.sh",
]
credit = "ilyamiro/shell-wallpapers (post 15)"

