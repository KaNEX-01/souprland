[variants.orman]
title = "Misty forest — animated (teal)"
wallpaper = "https://raw.githubusercontent.com/ilyamiro/shell-wallpapers/4b940811d375a5553ac97ac8824e571b9a5bace7/videos/echoes-of-a-fallen-world.1920x1080.mp4"
wallpaper_dest = "~/Pictures/Wallpapers/ilyamiro-orman.mp4"
apply = [
  "ffmpeg -y -loglevel error -i {wallpaper} -frames:v 1 /tmp/ilyamiro-thumb.png",
  "cp /tmp/ilyamiro-thumb.png /tmp/lock_bg.png",
  "pkill mpvpaper || true",
  "mpvpaper -o 'loop --no-audio --hwdec=auto --profile=high-quality --video-sync=display-resample --interpolation --tscale=oversample' '*' {wallpaper} >/dev/null 2>&1 &",
  "matugen image /tmp/ilyamiro-thumb.png --source-color-index 0 && bash ~/.config/hypr/scripts/quickshell/wallpaper/matugen_reload.sh",
]
credit = "ilyamiro/shell-wallpapers (post 7)"

