# The settings app's Bar page recognizes this bar (ricebar.py).
[bar]
kind = "quickshell"
label = "ilyamiro (Quickshell)"
note = "The shell's settings live in the author's QML code; there is no settings file. Colors from the wallpaper (Looks)."

# --- Mix parts (python -m hyprsetup mix; see python/hyprsetup/mix.py) ---
[[part]]
slot = "launcher"
title = "Rofi"
paths = ["~/.config/rofi"]
commands = { CMD_LAUNCHER = "rofi -show drun" }
packages = ["rofi"]
palette_files = ["matugen:~/.config/matugen/templates/rofi.rasi.template=~/.config/rofi/theme.rasi"]

[[part]]
slot = "notify"
title = "SwayNC bildirim merkezi"
paths = ["~/.config/swaync"]
start = "swaync"
provides = ["notify"]
packages = ["swaync"]
palette_files = ["matugen:~/.config/matugen/templates/swaync.css.template=~/.config/swaync/style.css"]
