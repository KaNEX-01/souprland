# ---------------------------------------------------------------------------
#  preset: st-cam
#  title: Frosted Glass — Glassmorphism
#  desc: Transparent frosted-glass windows over blurred color blobs. A glass
#        bar in the center, very round corners, strong blur, a glass rofi
#        launcher, kitty, swaync and a media widget.
# ---------------------------------------------------------------------------

THEME="st-cam"
FONT_FAMILY="SF Pro Display"
FONT_MONO="MesloLGS Nerd Font"
FONT_SIZE=10

# --- layout ----------------------------------------------------------------
LAYOUT="dwindle"
GAPS_IN=10
GAPS_OUT=20
BORDER_SIZE=1
BORDER_ANGLE=30
ROUNDING=24
ROUNDING_POWER=2

# --- decoration ------------------------------------------------------------
BLUR="true"
BLUR_SIZE=14
BLUR_PASSES=4
BLUR_XRAY="false"
BLUR_POPUPS="true"
SHADOW="true"
SHADOW_RANGE=30
SHADOW_RENDER_POWER=3
SHADOW_OFFSET="0 10"
ACTIVE_OPACITY=0.82
INACTIVE_OPACITY=0.72
DIM_INACTIVE="false"

# --- animation -------------------------------------------------------------
ANIMATIONS="true"
ANIMATION_PRESET="fluid"
ANIMATION_SPEED=1.0

# --- wallpaper -------------------------------------------------------------
WALLPAPER_IMAGE="wallpapers/st-cam.png"
PROFILE_VARIANT="photo"

# --- programs and presets (selected when the profile is applied) -----------
BAR="waybar"
BAR_PRESET="ml4w-glass"
LAUNCHER="rofi"
TERMINAL="kitty"
NOTIFIER="swaync"
WIDGET_ENGINE="eww"
WIDGET_SET="media"
DOCK_ENABLE="false"
