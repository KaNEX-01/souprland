# ---------------------------------------------------------------------------
#  preset: st-gunbatimi
#  title: Sunset — Monochrome Salmon
#  desc: A blurred crimson sun over a black ground. Everything is one color: near-black
#        windows, salmon text. Borderless, slightly rounded windows
#        and a jet-black thin top strip; a mono font.
# ---------------------------------------------------------------------------

THEME="st-gunbatimi"
FONT_FAMILY="Iosevka Nerd Font"
FONT_MONO="Iosevka Nerd Font Mono"
FONT_SIZE=11

# --- layout --------------------------------------------------------------
LAYOUT="dwindle"
GAPS_IN=8
GAPS_OUT=28
BORDER_SIZE=0
BORDER_ANGLE=0
ROUNDING=8
ROUNDING_POWER=2

# --- decoration ----------------------------------------------------------
BLUR="true"
BLUR_SIZE=6
BLUR_PASSES=2
BLUR_XRAY="false"
BLUR_POPUPS="true"
SHADOW="true"
SHADOW_RANGE=30
SHADOW_RENDER_POWER=3
SHADOW_OFFSET="0 8"
ACTIVE_OPACITY=0.96
INACTIVE_OPACITY=0.92
DIM_INACTIVE="false"

# --- animation -----------------------------------------------------------
ANIMATIONS="true"
ANIMATION_PRESET="minimal"
ANIMATION_SPEED=1.0

# --- wallpaper -----------------------------------------------------------
WALLPAPER_IMAGE="wallpapers/profile/st-gunbatimi.jpg"
PROFILE_VARIANT="matched"

# --- presets -------------------------------------------------------------
BAR="waybar"
LAUNCHER="wofi"
TERMINAL="foot"
NOTIFIER="mako"
BAR_PRESET="st-gunbatimi"
DOCK_ENABLE="false"
WIDGET_SET=""
