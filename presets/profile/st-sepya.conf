# ---------------------------------------------------------------------------
#  preset: st-sepya
#  title: Sepia — Monochrome Paper
#  desc: A beige paper ground, dark brown ink: a monochrome sway feel.
#        Square windows with thick dark borders that look like they have thick
#        title strips; a turquoise-beige oil-painted sea wallpaper. Iosevka,
#        alacritty, mako.
#  source: a reference image in temaornek/; the wallpaper was
#          drawn by us with tools/script-test-wallpapers.py.
# ---------------------------------------------------------------------------

THEME="st-sepya"
FONT_FAMILY="Iosevka"
FONT_MONO="Iosevka Nerd Font Mono"
FONT_SIZE=10

# --- layout ----------------------------------------------------------------
LAYOUT="dwindle"
GAPS_IN=8
GAPS_OUT=18
BORDER_SIZE=2
BORDER_ANGLE=0
ROUNDING=0
ROUNDING_POWER=2

# --- decoration ------------------------------------------------------------
BLUR="false"
BLUR_SIZE=1
BLUR_PASSES=1
BLUR_XRAY="false"
BLUR_POPUPS="false"
SHADOW="false"
SHADOW_RANGE=0
SHADOW_RENDER_POWER=3
SHADOW_OFFSET="0 0"
ACTIVE_OPACITY=1.0
INACTIVE_OPACITY=1.0
DIM_INACTIVE="false"

# --- animation -------------------------------------------------------------
ANIMATIONS="true"
ANIMATION_PRESET="minimal"
ANIMATION_SPEED=1.0

# --- wallpaper -------------------------------------------------------------
WALLPAPER_IMAGE="wallpapers/st-sepya.png"
PROFILE_VARIANT="wallhaven"

# --- programs and presets (selected when the profile is applied) -----------
BAR="waybar"
BAR_PRESET="st-sepya"
LAUNCHER="wofi"
TERMINAL="alacritty"
NOTIFIER="mako"
WIDGET_SET=""
DOCK_ENABLE="false"
