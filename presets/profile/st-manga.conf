# ---------------------------------------------------------------------------
#  preset: st-manga
#  title: Manga — White Page
#  desc: A light theme: a pure white manga page, vertical Japanese text and a
#        screentoned ink drawing. A white rail on the left, softly rounded
#        windows, light shadows. Noto Sans, kitty, swaync.
#  source: a reference image in temaornek/; the wallpaper was
#          drawn by us with tools/script-test-wallpapers.py.
# ---------------------------------------------------------------------------

THEME="st-manga"
FONT_FAMILY="Noto Sans"
FONT_MONO="JetBrains Mono"
FONT_SIZE=10

# --- layout ----------------------------------------------------------------
LAYOUT="dwindle"
GAPS_IN=8
GAPS_OUT=14
BORDER_SIZE=1
BORDER_ANGLE=90
ROUNDING=18
ROUNDING_POWER=3

# --- decoration ------------------------------------------------------------
BLUR="false"
BLUR_SIZE=1
BLUR_PASSES=1
BLUR_XRAY="false"
BLUR_POPUPS="false"
SHADOW="true"
SHADOW_RANGE=28
SHADOW_RENDER_POWER=2
SHADOW_OFFSET="0 6"
ACTIVE_OPACITY=1.0
INACTIVE_OPACITY=0.97
DIM_INACTIVE="false"

# --- animation -------------------------------------------------------------
ANIMATIONS="true"
ANIMATION_PRESET="default"
ANIMATION_SPEED=1.0

# --- wallpaper -------------------------------------------------------------
WALLPAPER_IMAGE="wallpapers/st-manga.png"
PROFILE_VARIANT="wallhaven"

# --- programs and presets (selected when the profile is applied) -----------
BAR="waybar"
BAR_PRESET="st-manga"
LAUNCHER="fuzzel"
TERMINAL="kitty"
NOTIFIER="swaync"
WIDGET_SET=""
DOCK_ENABLE="false"
