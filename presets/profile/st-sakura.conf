# ---------------------------------------------------------------------------
#  preset: st-sakura
#  title: Sakura — Pastel Light
#  desc: A light theme: a pink-cream sky, cherry branches. Very round corners,
#        soft shadows, fluid animations. A Caelestia-style shell on
#        Quickshell, fuzzel, foot, swaync and Material widgets.
# ---------------------------------------------------------------------------

THEME="st-sakura"
FONT_FAMILY="SF Pro Rounded"
FONT_MONO="FantasqueSansM Nerd Font"
FONT_SIZE=11

# --- layout ----------------------------------------------------------------
LAYOUT="dwindle"
GAPS_IN=10
GAPS_OUT=22
BORDER_SIZE=2
BORDER_ANGLE=45
ROUNDING=22
ROUNDING_POWER=2

# --- decoration ------------------------------------------------------------
BLUR="true"
BLUR_SIZE=10
BLUR_PASSES=3
BLUR_XRAY="false"
BLUR_POPUPS="true"
SHADOW="true"
SHADOW_RANGE=28
SHADOW_RENDER_POWER=3
SHADOW_OFFSET="0 8"
ACTIVE_OPACITY=0.98
INACTIVE_OPACITY=0.94
DIM_INACTIVE="false"

# --- animation -------------------------------------------------------------
ANIMATIONS="true"
ANIMATION_PRESET="fluid"
ANIMATION_SPEED=1.0

# --- wallpaper -------------------------------------------------------------
WALLPAPER_IMAGE="wallpapers/profile/st-sakura.jpg"
PROFILE_VARIANT="matched"

# --- programs and presets (selected when the profile is applied) -----------
BAR="quickshell-bar"
BAR_PRESET="caelestia"
LAUNCHER="fuzzel"
TERMINAL="foot"
NOTIFIER="swaync"
WIDGET_ENGINE="eww"
WIDGET_SET="material"
DOCK_ENABLE="false"
