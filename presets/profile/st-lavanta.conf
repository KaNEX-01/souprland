# ---------------------------------------------------------------------------
#  preset: st-lavanta
#  title: Lavender — Neon Tubes (i3 layout)
#  desc: A midnight-navy ground, lavender neon tubes. Widely spaced,
#        square terminal windows with thin lavender borders; an i3-style
#        boxless status line at the bottom. Iosevka, kitty, dunst.
#  source: a reference image in temaornek/; the wallpaper was
#          drawn by us with tools/script-test-wallpapers.py.
# ---------------------------------------------------------------------------

THEME="st-lavanta"
FONT_FAMILY="Iosevka Nerd Font"
FONT_MONO="Iosevka Nerd Font Mono"
FONT_SIZE=10

# --- layout ----------------------------------------------------------------
LAYOUT="master"
GAPS_IN=14
GAPS_OUT=40
BORDER_SIZE=1
BORDER_ANGLE=90
ROUNDING=0
ROUNDING_POWER=2

# --- decoration ------------------------------------------------------------
BLUR="false"
BLUR_SIZE=1
BLUR_PASSES=1
BLUR_XRAY="false"
BLUR_POPUPS="false"
SHADOW="true"
SHADOW_RANGE=30
SHADOW_RENDER_POWER=2
SHADOW_OFFSET="0 0"
ACTIVE_OPACITY=0.95
INACTIVE_OPACITY=0.88
DIM_INACTIVE="false"

# --- animation -------------------------------------------------------------
ANIMATIONS="true"
ANIMATION_PRESET="snappy"
ANIMATION_SPEED=1.0

# --- wallpaper -------------------------------------------------------------
WALLPAPER_IMAGE="wallpapers/st-lavanta.png"
PROFILE_VARIANT="wallhaven"

# --- programs and presets (selected when the profile is applied) -----------
BAR="waybar"
BAR_PRESET="st-lavanta"
LAUNCHER="rofi"
TERMINAL="kitty"
NOTIFIER="dunst"
WIDGET_SET=""
DOCK_ENABLE="false"
