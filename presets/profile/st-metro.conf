# ---------------------------------------------------------------------------
#  preset: st-metro
#  title: Metro — Sovietpunk
#  desc: A dried-blood red ground, mustard-yellow text and frames:
#        a gas-mask propaganda poster wallpaper. Square windows,
#        a classic taskbar at the bottom. Hack, alacritty, dunst.
#  source: a reference image in temaornek/; the wallpaper was
#          drawn by us with tools/script-test-wallpapers.py.
# ---------------------------------------------------------------------------

THEME="st-metro"
FONT_FAMILY="Hack"
FONT_MONO="Hack"
FONT_SIZE=9

# --- layout ----------------------------------------------------------------
LAYOUT="dwindle"
GAPS_IN=6
GAPS_OUT=14
BORDER_SIZE=2
BORDER_ANGLE=90
ROUNDING=0
ROUNDING_POWER=2

# --- decoration ------------------------------------------------------------
BLUR="false"
BLUR_SIZE=1
BLUR_PASSES=1
BLUR_XRAY="false"
BLUR_POPUPS="false"
SHADOW="true"
SHADOW_RANGE=6
SHADOW_RENDER_POWER=3
SHADOW_OFFSET="4 4"
ACTIVE_OPACITY=1.0
INACTIVE_OPACITY=0.95
DIM_INACTIVE="false"

# --- animation -------------------------------------------------------------
ANIMATIONS="true"
ANIMATION_PRESET="snappy"
ANIMATION_SPEED=1.0

# --- wallpaper -------------------------------------------------------------
WALLPAPER_IMAGE="wallpapers/st-metro.png"
PROFILE_VARIANT="photo"

# --- programs and presets (selected when the profile is applied) -----------
BAR="waybar"
BAR_PRESET="st-metro"
LAUNCHER="rofi"
TERMINAL="alacritty"
NOTIFIER="dunst"
WIDGET_SET=""
DOCK_ENABLE="false"
