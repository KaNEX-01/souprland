# ---------------------------------------------------------------------------
#  preset: st-orman
#  title: Autumn Forest — Warm Block
#  desc: Layer upon layer of pine forest in orange mist. A solid block bar with
#        Gruvbox warmth, system-monitoring widgets, rofi, kitty and dunst;
#        medium-rounded corners.
# ---------------------------------------------------------------------------

THEME="st-orman"
FONT_FAMILY="FantasqueSansM Nerd Font"
FONT_MONO="FantasqueSansM Nerd Font Mono"
FONT_SIZE=11

# --- layout ----------------------------------------------------------------
LAYOUT="dwindle"
GAPS_IN=5
GAPS_OUT=10
BORDER_SIZE=3
BORDER_ANGLE=45
ROUNDING=6
ROUNDING_POWER=2

# --- decoration ------------------------------------------------------------
BLUR="false"
BLUR_SIZE=1
BLUR_PASSES=1
BLUR_XRAY="false"
BLUR_POPUPS="false"
SHADOW="true"
SHADOW_RANGE=14
SHADOW_RENDER_POWER=3
SHADOW_OFFSET="0 4"
ACTIVE_OPACITY=1.0
INACTIVE_OPACITY=0.95
DIM_INACTIVE="false"

# --- animation -------------------------------------------------------------
ANIMATIONS="true"
ANIMATION_PRESET="default"
ANIMATION_SPEED=1.0

# --- wallpaper -------------------------------------------------------------
WALLPAPER_IMAGE="wallpapers/st-orman.png"
PROFILE_VARIANT="wallhaven"

# --- programs and presets (selected when the profile is applied) -----------
BAR="waybar"
BAR_PRESET="gruvbox-solid"
LAUNCHER="rofi"
TERMINAL="kitty"
NOTIFIER="dunst"
WIDGET_ENGINE="eww"
WIDGET_SET="monitor"
DOCK_ENABLE="false"
