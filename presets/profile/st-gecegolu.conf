# ---------------------------------------------------------------------------
#  preset: st-gecegolu
#  title: Night Lake — Purple Pixels
#  desc: A pixel-art night lake: stars, purple mountains, a lantern on a boat.
#        A low, dark purple mono strip edge to edge; lavender accents, softly
#        rounded windows and calm animations.
# ---------------------------------------------------------------------------

THEME="st-gecegolu"
FONT_FAMILY="JetBrains Mono"
FONT_MONO="JetBrains Mono"
FONT_SIZE=10

# --- layout --------------------------------------------------------------
LAYOUT="dwindle"
GAPS_IN=6
GAPS_OUT=12
BORDER_SIZE=2
BORDER_ANGLE=45
ROUNDING=10
ROUNDING_POWER=2

# --- decoration ----------------------------------------------------------
BLUR="true"
BLUR_SIZE=6
BLUR_PASSES=3
BLUR_XRAY="false"
BLUR_POPUPS="true"
SHADOW="true"
SHADOW_RANGE=18
SHADOW_RENDER_POWER=3
SHADOW_OFFSET="0 4"
ACTIVE_OPACITY=0.95
INACTIVE_OPACITY=0.88
DIM_INACTIVE="false"

# --- animation -----------------------------------------------------------
ANIMATIONS="true"
ANIMATION_PRESET="default"
ANIMATION_SPEED=1.0

# --- wallpaper -----------------------------------------------------------
WALLPAPER_IMAGE="wallpapers/st-gecegolu.png"
PROFILE_VARIANT="wallhaven"

# --- presets -------------------------------------------------------------
BAR="waybar"
LAUNCHER="fuzzel"
TERMINAL="kitty"
NOTIFIER="dunst"
BAR_PRESET="st-gecegolu"
DOCK_ENABLE="false"
WIDGET_SET=""
