[packages]
repo = ["rofi", "wofi", "kitty", "hyprlock", "matugen", "playerctl", "pamixer",
        "brightnessctl", "jq", "socat", "python", "python-dbus", "python-gobject",
        "python-requests", "libnotify", "wf-recorder", "grim", "slurp",
        "networkmanager", "bluez-utils", "ttf-jetbrains-mono-nerd"]
aur = ["eww", "wlogout", "otf-apple-sf-pro"]

# Looks: the author's light/dark mode + colors from the wallpaper. The
# wallpapers are this project's (wallpapers/); the author's aren't in the repo.
[variants.sakura]
title = "Sakura — light, pink"
wallpaper = "wallpapers/profile/st-sakura.jpg"
wallpaper_dest = "~/Pictures/wallpapers/hyprclouds-sakura.jpg"
apply = [
  "~/.config/hypr/scripts/wallpaper.sh set {wallpaper} || true",
  "python3 ~/.config/hyprclouds/hyprclouds_colors.py {wallpaper} light",
]
credit = "This project's st-sakura wallpaper (the author's isn't in the repo)"
[variants.alacakaranlik]
title = "Twilight — dark, purple"
wallpaper = "wallpapers/profile/st-alacakaranlik.jpg"
wallpaper_dest = "~/Pictures/wallpapers/hyprclouds-alacakaranlik.jpg"
apply = [
  "~/.config/hypr/scripts/wallpaper.sh set {wallpaper} || true",
  "python3 ~/.config/hyprclouds/hyprclouds_colors.py {wallpaper} dark",
]
credit = "This project's st-alacakaranlik wallpaper (the author's isn't in the repo)"
[variants.orman]
title = "Forest — dark, orange"
wallpaper = "wallpapers/profile/st-orman.jpg"
wallpaper_dest = "~/Pictures/wallpapers/hyprclouds-orman.jpg"
apply = [
  "~/.config/hypr/scripts/wallpaper.sh set {wallpaper} || true",
  "python3 ~/.config/hyprclouds/hyprclouds_colors.py {wallpaper} dark",
]
credit = "This project's st-orman wallpaper (the author's isn't in the repo)"

# The settings app's Bar page recognizes this bar (ricebar.py).
[bar]
kind = "eww"
label = "hyprclouds (eww)"
note = "The eww bar's settings live in the author's yuck/scss files; colors from the wallpaper (Looks)."

# --- Soup Maker parts (python -m hyprsetup mix; see python/hyprsetup/mix.py) ---
[[part]]
slot = "bar"
title = "Eww bar + control center"
paths = ["~/.config/eww", "~/.config/material-you"]
start = "~/.config/eww/scripts/start.sh"
provides = ["bar", "notify"]
packages = ["playerctl", "pamixer", "brightnessctl", "jq", "socat", "python-dbus", "python-gobject"]
aur = ["eww"]

[[part]]
slot = "launcher"
title = "Rofi (resimli, type-6)"
paths = ["~/.config/rofi"]
commands = { CMD_LAUNCHER = "~/.config/rofi/launchers/type-6/launcher.sh" }
packages = ["rofi"]

[[part]]
slot = "terminal"
title = "Kitty"
paths = ["~/.config/kitty"]
commands = { CMD_TERMINAL = "kitty" }
packages = ["kitty"]

[[part]]
slot = "lock"
title = "Hyprlock lock screen"
paths = ["~/.config/hypr/hyprlock.conf"]
needs = ["~/.config/material-you/colors.conf", "~/.config/hyprclouds/scripts/songdetail.sh", "~/.config/eww/pfp.png"]
commands = { LOCK_CMD = "hyprlock" }
packages = ["hyprlock", "playerctl"]
