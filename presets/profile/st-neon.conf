# ---------------------------------------------------------------------------
#  preset: st-neon
#  title: Neon City — Synthwave
#  desc: A midnight neon city: a banded synthwave sun, magenta-cyan
#        borders, square sharp windows. A HUD-style square bar on
#        top, a rofi grid launcher, kitty.
# ---------------------------------------------------------------------------

THEME="st-neon"
FONT_FAMILY="Orbitron"
FONT_MONO="JetBrainsMono Nerd Font"
FONT_SIZE=10

# --- layout ----------------------------------------------------------------
LAYOUT="dwindle"
GAPS_IN=6
GAPS_OUT=12
BORDER_SIZE=2
BORDER_ANGLE=135
ROUNDING=0
ROUNDING_POWER=2

# --- decoration ------------------------------------------------------------
BLUR="true"
BLUR_SIZE=6
BLUR_PASSES=2
BLUR_XRAY="false"
BLUR_POPUPS="true"
SHADOW="true"
SHADOW_RANGE=20
SHADOW_RENDER_POWER=3
SHADOW_OFFSET="0 0"
ACTIVE_OPACITY=0.92
INACTIVE_OPACITY=0.82
DIM_INACTIVE="false"

# --- animation -------------------------------------------------------------
ANIMATIONS="true"
ANIMATION_PRESET="snappy"
ANIMATION_SPEED=1.0

# --- wallpaper -------------------------------------------------------------
WALLPAPER_IMAGE="wallpapers/profile/st-neon.jpg"
PROFILE_VARIANT="matched"

# --- programs and presets (selected when the profile is applied) -----------
BAR="waybar"
BAR_PRESET="cyberarch-hud"
LAUNCHER="rofi"
TERMINAL="kitty"
NOTIFIER="mako"
WIDGET_SET=""
DOCK_ENABLE="false"
