# ---------------------------------------------------------------------------
#  preset: st-vadi
#  title: Valley — Green Forest (niri style)
#  desc: Lush green mountain slopes; a Quickshell side rail on the left, a big
#        clock and now-playing card top left. Softly rounded, misty windows,
#        long fluid animations. SF Pro Display, foot, swaync.
#  source: a reference image in temaornek/; the wallpaper was
#          drawn by us with tools/script-test-wallpapers.py.
# ---------------------------------------------------------------------------

THEME="st-vadi"
FONT_FAMILY="SF Pro Display"
FONT_MONO="JetBrains Mono"
FONT_SIZE=10

# --- layout ----------------------------------------------------------------
LAYOUT="dwindle"
GAPS_IN=8
GAPS_OUT=16
BORDER_SIZE=2
BORDER_ANGLE=45
ROUNDING=16
ROUNDING_POWER=3

# --- decoration ------------------------------------------------------------
BLUR="true"
BLUR_SIZE=8
BLUR_PASSES=3
BLUR_XRAY="false"
BLUR_POPUPS="true"
SHADOW="true"
SHADOW_RANGE=24
SHADOW_RENDER_POWER=3
SHADOW_OFFSET="0 0"
ACTIVE_OPACITY=0.92
INACTIVE_OPACITY=0.85
DIM_INACTIVE="false"

# --- animation -------------------------------------------------------------
ANIMATIONS="true"
ANIMATION_PRESET="fluid"
ANIMATION_SPEED=1.0

# --- wallpaper -------------------------------------------------------------
WALLPAPER_IMAGE="wallpapers/st-vadi.png"
PROFILE_VARIANT="wallhaven"

# --- programs and presets (selected when the profile is applied) -----------
BAR="quickshell-bar"
BAR_PRESET="st-vadi"
LAUNCHER="fuzzel"
TERMINAL="foot"
NOTIFIER="swaync"
WIDGET_ENGINE="eww"
WIDGET_SET=""
WIDGETS="clock,music"
WIDGET_ZONE_TL="clock,music"
WIDGET_SCALE="1.15"
WIDGET_RADIUS="16"
WIDGET_OPACITY="0.55"
WIDGET_MARGIN="60"
WIDGET_GAP="14"
DOCK_ENABLE="false"
