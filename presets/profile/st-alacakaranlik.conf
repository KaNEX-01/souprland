# ---------------------------------------------------------------------------
#  preset: st-alacakaranlik
#  title: Twilight — Mountain Lake
#  desc: A snowy peak, pine forest and lake reflection under purple-orange
#        clouds. A bar of dark floating islands, a now-playing card top left.
#        Rounded, misty windows. Inter, kitty, swaync.
#  source: a reference image in temaornek/; the wallpaper was
#          drawn by us with tools/script-test-wallpapers.py.
# ---------------------------------------------------------------------------

THEME="st-alacakaranlik"
FONT_FAMILY="Inter"
FONT_MONO="JetBrains Mono"
FONT_SIZE=10

# --- layout ----------------------------------------------------------------
LAYOUT="dwindle"
GAPS_IN=6
GAPS_OUT=12
BORDER_SIZE=2
BORDER_ANGLE=45
ROUNDING=10
ROUNDING_POWER=2

# --- decoration ------------------------------------------------------------
BLUR="true"
BLUR_SIZE=8
BLUR_PASSES=3
BLUR_XRAY="false"
BLUR_POPUPS="true"
SHADOW="true"
SHADOW_RANGE=16
SHADOW_RENDER_POWER=3
SHADOW_OFFSET="0 0"
ACTIVE_OPACITY=0.88
INACTIVE_OPACITY=0.8
DIM_INACTIVE="false"

# --- animation -------------------------------------------------------------
ANIMATIONS="true"
ANIMATION_PRESET="default"
ANIMATION_SPEED=1.0

# --- wallpaper -------------------------------------------------------------
WALLPAPER_IMAGE="wallpapers/profile/st-alacakaranlik.jpg"
PROFILE_VARIANT="matched"

# --- programs and presets (selected when the profile is applied) -----------
BAR="waybar"
BAR_PRESET="st-alacakaranlik"
LAUNCHER="fuzzel"
TERMINAL="kitty"
NOTIFIER="swaync"
WIDGET_ENGINE="eww"
WIDGET_SET=""
WIDGETS="music"
WIDGET_ZONE_TL="music"
WIDGET_SCALE="1.1"
WIDGET_RADIUS="10"
WIDGET_OPACITY="0.6"
WIDGET_MARGIN="18"
WIDGET_GAP="10"
DOCK_ENABLE="false"
