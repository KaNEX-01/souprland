# simeulinuxkaliaiwr/vantage — r/hyprland "My first rice with quickshell" (10)
# https://www.reddit.com/r/hyprland/comments/1v2cof0/
# Posted 2026-07-21 08:43 UTC; the repo went public a day later. The installed commit is the
# first day's last (b2c0ced, the moment the MIT license was added). A Quickshell shell:
# bar, slanted quick launcher on the left, SYS//MONITOR card, big clock, cava
# bars at the bottom, wallpaper strip, color-scheme/palette editor, visual
# modes (normal/minimal/cinema). Colors from the wallpaper via pywal;
# video wallpapers via mpvpaper, images via awww.
#
# At post time the author ran the shell from ~/.config/quickshell/rice with "qs -c rice":
# the script paths in the QML and the Dock commands still say "rice"
# (later renamed to "vantage", the paths weren't updated). So it is installed
# there; the interim name in launch.sh (rice-git) is fixed.
#
# The author's install.sh: copies the shell, adds a blur block to hyprland.lua,
# puts in the example keybindings and the cava config. The Hyprland additions
# are written as ~/.config/hypr/rice.conf (conf mode) and rice.lua (Lua mode).

default_variant = "fuuka"
provides = ["bar", "widget", "launcher", "wallpaper"]

post_install = [
  "chmod +x ~/.config/quickshell/rice/launch.sh ~/.config/quickshell/rice/restart-rice.sh ~/.config/quickshell/rice/scripts/*.sh ~/.config/quickshell/rice/scripts/*.py 2>/dev/null || true",
  "hyprctl reload >/dev/null 2>&1 || true",
]

notes = [
  "The Fuuka and Ken looks are animated wallpapers from MoeWalls; the installer downloads the site's public 720p preview video. Full quality is on their pages (credit).",
  "The wallpaper for the video's third look (monochrome red, long-haired girl in a hat) couldn't be found.",
  "The qutebrowser start page and foot colors are synced by the author's scripts if those programs' config folders exist.",
  "Keybindings: SUPER+D launcher, +V clipboard, +W wallpaper, +M visual mode, +Y color scheme, +P palette.",
]

[source]
repo = "https://github.com/simeulinuxkaliaiwr/vantage"
commit = "b2c0ced8424d6e4b5e72c79a3f49896afee4262f"
post = "https://www.reddit.com/r/hyprland/comments/1v2cof0/my_first_rice_with_quickshell/"
license = "MIT"

[[install]]
from = "."
to = "~/.config/quickshell/rice"
[[install]]
from = "cava-config-rice"
to = "~/.config/cava/cava-config-rice"

[[fix]]
file = "~/.config/quickshell/rice/launch.sh"
replace = ["exec qs -c rice-git", "exec qs -c rice"]
why = "interim name; the shell's own paths and Dock commands say \"rice\""
[[fix]]
file = "~/.config/quickshell/rice/install.sh"
delete = true
why = "the author's install.sh deletes it from the copy"
[[fix]]
file = "~/.config/quickshell/rice/keybinds-example.lua"
delete = true
why = "the author's install.sh deletes it from the copy (the keybindings are in rice.conf)"
[[fix]]
file = "~/.config/quickshell/rice/README.md"
delete = true
why = "the author's install.sh deletes it from the copy"
[[file]]
to = "~/.config/hypr/colors-wal.lua"
content = "-- vantage: the author's write-hypr-theme.sh rewrites this when the look changes.\n"
[[fix]]
file = "~/.config/quickshell/rice/ClipboardHistory.qml"
replace = ["import Quickshell\n", "import QtQuick\nimport Quickshell\n"]
why = "Item comes from QtQuick; without the import, current Quickshell reports 'Item is not a type' and doesn't load the shell at all (the bar never opened)"
[[fix]]
file = "~/.config/quickshell/rice/AppLauncher.qml"
replace = ["import Quickshell\n", "import QtQuick\nimport Quickshell\n"]
why = "same as ClipboardHistory.qml: missing QtQuick import"

[[file]]
to = "~/.config/hypr/rice.conf"
content = "# vantage (hyprsetup profile) — the blur block added by the author's install.sh,\n# keybinds-example.lua and the look generated by write-hypr-theme.sh\n# (colors-wal.lua), converted to this project's conf mode.\nexec-once = ~/.config/quickshell/rice/launch.sh\n\n# Border colors from pywal (~/.config/wal/templates → ~/.cache/wal).\nsource = ~/.cache/wal/colors-hyprland-vantage.conf\ngeneral {\n    border_size = 1\n}\ndecoration {\n    rounding = 12\n    blur {\n        enabled = true\n        size = 8\n        passes = 4\n        vibrancy = 0.17\n    }\n}\nlayerrule = blur on, match:namespace quickshell\nlayerrule = ignore_alpha 0.2, match:namespace quickshell\nlayerrule = blur on, match:namespace quickshell-bar\nlayerrule = ignore_alpha 0.2, match:namespace quickshell-bar\nlayerrule = blur on, match:namespace quickshell-sysinfo\nlayerrule = ignore_alpha 0.2, match:namespace quickshell-sysinfo\nlayerrule = blur on, match:namespace quickshell-dock\nlayerrule = ignore_alpha 0.2, match:namespace quickshell-dock\nlayerrule = blur on, match:namespace quickshell-holorings\nlayerrule = ignore_alpha 0.2, match:namespace quickshell-holorings\nlayerrule = blur on, match:namespace quickshell-bigclock\nlayerrule = ignore_alpha 0.2, match:namespace quickshell-bigclock\nlayerrule = blur on, match:namespace quickshell-notifications\nlayerrule = ignore_alpha 0.2, match:namespace quickshell-notifications\nlayerrule = ignore_alpha 0.08, match:namespace quickshell-bar\n\nanimations {\n    enabled = true\n}\nbezier = riceGlide, 0.22, 1.0, 0.36, 1.0\nbezier = riceSoft, 0.25, 0.1, 0.25, 1.0\nanimation = global, 1, 4, riceGlide\nanimation = windows, 1, 4, riceGlide, popin 85%\nanimation = windowsOut, 1, 4.5, riceSoft, popin 85%\nanimation = fade, 1, 4, riceSoft\nanimation = workspaces, 1, 5, riceGlide, slidefade 12%\nanimation = layersIn, 1, 4, riceGlide, slide\nanimation = layersOut, 1, 4, riceSoft\n\n# keybinds-example.lua (this project's bindings on the same keys are removed first)\nunbind = SUPER, D\nbind = SUPER, D, exec, qs -c rice ipc call appLauncher toggle\nunbind = SUPER, V\nbind = SUPER, V, exec, qs -c rice ipc call clipboardHistory toggle\nunbind = SUPER, W\nbind = SUPER, W, exec, qs -c rice ipc call wallpaperSelector toggle\nunbind = SUPER, M\nbind = SUPER, M, exec, qs -c rice ipc call modeSwitcher toggle\nunbind = SUPER, Y\nbind = SUPER, Y, exec, qs -c rice ipc call colorScheme toggle\nunbind = SUPER, P\nbind = SUPER, P, exec, qs -c rice ipc call paletteEditor toggle\n"
[[file]]
to = "~/.config/hypr/rice.lua"
content = "-- vantage (hyprsetup profile) — the blur block added by the author's install.sh\n-- and keybinds-example.lua; colors/animations from the colors-wal.lua generated\n-- by the author's write-hypr-theme.sh (if present).\nhl.on(\"hyprland.start\", function()\n    hl.exec_cmd(\"~/.config/quickshell/rice/launch.sh\")\nend)\n\n-- BEGIN VANTAGE BLUR\nhl.config({ decoration = { blur = { enabled = true } } })\n\nfor _, ns in ipairs({\n  \"quickshell-bar\", \"quickshell-sysinfo\", \"quickshell-dock\",\n  \"quickshell-holorings\", \"quickshell-bigclock\", \"quickshell-notifications\"\n}) do\n  hl.layer_rule({ match = { namespace = ns }, blur = true, ignore_alpha = 0.2 })\nend\n\nhl.layer_rule({ match = { namespace = \"quickshell-bar\" }, blur = true, ignore_alpha = 0.08 })\n-- END VANTAGE BLUR\n\npcall(require, \"colors-wal\")\n\nhl.unbind(\"SUPER + D\")\nhl.bind(\"SUPER + D\", hl.dsp.exec_cmd(\"qs -c rice ipc call appLauncher toggle\"))\nhl.unbind(\"SUPER + V\")\nhl.bind(\"SUPER + V\", hl.dsp.exec_cmd(\"qs -c rice ipc call clipboardHistory toggle\"))\nhl.unbind(\"SUPER + W\")\nhl.bind(\"SUPER + W\", hl.dsp.exec_cmd(\"qs -c rice ipc call wallpaperSelector toggle\"))\nhl.unbind(\"SUPER + M\")\nhl.bind(\"SUPER + M\", hl.dsp.exec_cmd(\"qs -c rice ipc call modeSwitcher toggle\"))\nhl.unbind(\"SUPER + Y\")\nhl.bind(\"SUPER + Y\", hl.dsp.exec_cmd(\"qs -c rice ipc call colorScheme toggle\"))\nhl.unbind(\"SUPER + P\")\nhl.bind(\"SUPER + P\", hl.dsp.exec_cmd(\"qs -c rice ipc call paletteEditor toggle\"))\n"
[[file]]
to = "~/.config/wal/templates/colors-hyprland-vantage.conf"
content = "general {{\n    col.active_border = rgba({color4.strip}ff) rgba({color6.strip}ff) 45deg\n    col.inactive_border = rgba({color0.strip}aa)\n}}\n"
[[file]]
to = "~/.cache/wal/colors-hyprland-vantage.conf"
content = "# hyprsetup: first start (the fuuka look's pywal palette); when the wallpaper\n# changes, pywal regenerates it from ~/.config/wal/templates.\ngeneral {\n    col.active_border = rgba(28D0A5ff) rgba(52CDC4ff) 45deg\n    col.inactive_border = rgba(14301daa)\n}\n"

[packages]
repo = ["quickshell", "qt6-5compat", "cliphist", "wl-clipboard", "cava", "ffmpeg", "foot",
        "python", "imagemagick", "awww", "file", "hyprlock", "qutebrowser", "jq",
        "ttf-jetbrains-mono-nerd", "ttf-nerd-fonts-symbols"]
aur = ["python-pywal16", "mpvpaper"]

[variants.fuuka]
title = "Fuuka Yamagishi — mint (animated)"
wallpaper = "https://moewalls.com/wp-content/uploads/preview/2026/fuuka-yamagishi-persona-3-reload-preview.webm"
wallpaper_dest = "~/Pictures/Wallpapers/fuuka-yamagishi-persona-3-reload.webm"
apply = ["bash ~/.config/quickshell/rice/scripts/apply-wallpaper.sh {wallpaper}"]
credit = "MoeWalls \u2014 Fuuka Yamagishi Persona 3 Reload Live Wallpaper: https://moewalls.com/anime/fuuka-yamagishi-persona-3-reload-live-wallpaper/"

[variants.ken]
title = "Ken Amada — orange (animated)"
wallpaper = "https://moewalls.com/wp-content/uploads/preview/2024/ken-amada-persona-3-reload-preview.webm"
wallpaper_dest = "~/Pictures/Wallpapers/ken-amada-persona-3-reload.webm"
apply = ["bash ~/.config/quickshell/rice/scripts/apply-wallpaper.sh {wallpaper}"]
credit = "MoeWalls \u2014 Ken Amada Persona 3 Reload Live Wallpaper: https://moewalls.com/anime/ken-amada-persona-3-reload-live-wallpaper/"

# The settings app's Bar page recognizes this bar (ricebar.py).
[bar]
kind = "quickshell"
label = "vantage (Quickshell)"
note = "The shell's settings live in the author's QML code; there is no settings file. Colors from the wallpaper via pywal."

# --- Mix parts (python -m hyprsetup mix; see python/hyprsetup/mix.py) ---
# The shell is split: shell.qml is rewritten with only the components of the selected
# parts (unselected ones become comment lines). Colors are read from the pywal file;
# that file is generated from the mix's color scheme.
[[part]]
slot = "bar"
title = "Quickshell floating bar (+ notification center)"
paths = ["~/.config/quickshell/rice"]
start = "qs -c rice"
provides = ["bar"]
packages = ["quickshell"]
entry = "~/.config/quickshell/rice/shell.qml"
modules = ["Bar", "BarMorph", "NotificationCenter"]
palette_files = ["pywal:~/.cache/wal/colors.json"]
hypr = [
  "layerrule = blur on, match:namespace quickshell",
  "layerrule = ignore_alpha 0.2, match:namespace quickshell",
  "layerrule = blur on, match:namespace quickshell-bar",
  "layerrule = ignore_alpha 0.08, match:namespace quickshell-bar",
  "layerrule = blur on, match:namespace quickshell-notifications",
  "layerrule = ignore_alpha 0.2, match:namespace quickshell-notifications",
]

[[part]]
slot = "launcher"
title = "Launcher opened from the bar"
paths = ["~/.config/quickshell/rice"]
entry = "~/.config/quickshell/rice/shell.qml"
modules = ["AppLauncher"]
commands = { CMD_LAUNCHER = "qs -c rice ipc call appLauncher toggle" }
requires = ["vantage/bar"]
packages = ["quickshell"]

[[part]]
slot = "widget"
title = "Desktop: big clock, audio wave, rings, system, dock"
paths = ["~/.config/quickshell/rice"]
start = "qs -c rice"
provides = ["widget"]
packages = ["quickshell", "cava"]
entry = "~/.config/quickshell/rice/shell.qml"
modules = ["BigClock", "AudioVisualizer", "HoloRings", "SystemMonitor", "Dock"]
needs = ["~/.config/cava/cava-config-rice"]
palette_files = ["pywal:~/.cache/wal/colors.json"]
hypr = [
  "layerrule = blur on, match:namespace quickshell-sysinfo",
  "layerrule = ignore_alpha 0.2, match:namespace quickshell-sysinfo",
  "layerrule = blur on, match:namespace quickshell-dock",
  "layerrule = ignore_alpha 0.2, match:namespace quickshell-dock",
  "layerrule = blur on, match:namespace quickshell-holorings",
  "layerrule = ignore_alpha 0.2, match:namespace quickshell-holorings",
  "layerrule = blur on, match:namespace quickshell-bigclock",
  "layerrule = ignore_alpha 0.2, match:namespace quickshell-bigclock",
]
