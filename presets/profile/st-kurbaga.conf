# ---------------------------------------------------------------------------
#  preset: st-kurbaga
#  title: Frog — Rainy Pond
#  desc: A bird's-eye pond: turquoise water, a frog on a lily pad, leaves in the
#        corners, streaks of rain. Dark transparent windows, a tab bar hanging
#        from the top. CaskaydiaCove, foot, mako.
#  source: a reference image in temaornek/; the wallpaper was
#          drawn by us with tools/script-test-wallpapers.py.
# ---------------------------------------------------------------------------

THEME="st-kurbaga"
FONT_FAMILY="CaskaydiaCove Nerd Font"
FONT_MONO="CaskaydiaCove Nerd Font Mono"
FONT_SIZE=10

# --- layout ----------------------------------------------------------------
LAYOUT="dwindle"
GAPS_IN=6
GAPS_OUT=12
BORDER_SIZE=0
BORDER_ANGLE=90
ROUNDING=6
ROUNDING_POWER=2

# --- decoration ------------------------------------------------------------
BLUR="true"
BLUR_SIZE=6
BLUR_PASSES=3
BLUR_XRAY="false"
BLUR_POPUPS="true"
SHADOW="true"
SHADOW_RANGE=18
SHADOW_RENDER_POWER=3
SHADOW_OFFSET="0 0"
ACTIVE_OPACITY=0.82
INACTIVE_OPACITY=0.72
DIM_INACTIVE="false"

# --- animation -------------------------------------------------------------
ANIMATIONS="true"
ANIMATION_PRESET="fluid"
ANIMATION_SPEED=1.0

# --- wallpaper -------------------------------------------------------------
WALLPAPER_IMAGE="wallpapers/st-kurbaga.png"
PROFILE_VARIANT="photo"

# --- programs and presets (selected when the profile is applied) -----------
BAR="waybar"
BAR_PRESET="st-kurbaga"
LAUNCHER="fuzzel"
TERMINAL="foot"
NOTIFIER="mako"
WIDGET_SET=""
DOCK_ENABLE="false"
