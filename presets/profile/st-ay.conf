# ---------------------------------------------------------------------------
#  preset: st-ay
#  title: Moon — Starry Night
#  desc: A huge, cratered full moon in a starry black sky. A backgroundless
#        colorful capsule bar, rounded windows with shadows. Inter, kitty,
#        swaync.
#  source: a reference image in temaornek/; the wallpaper was
#          drawn by us with tools/script-test-wallpapers.py.
# ---------------------------------------------------------------------------

THEME="st-ay"
FONT_FAMILY="Inter"
FONT_MONO="JetBrainsMono Nerd Font"
FONT_SIZE=10

# --- layout ----------------------------------------------------------------
LAYOUT="dwindle"
GAPS_IN=6
GAPS_OUT=12
BORDER_SIZE=2
BORDER_ANGLE=135
ROUNDING=12
ROUNDING_POWER=3

# --- decoration ------------------------------------------------------------
BLUR="true"
BLUR_SIZE=6
BLUR_PASSES=2
BLUR_XRAY="false"
BLUR_POPUPS="true"
SHADOW="true"
SHADOW_RANGE=20
SHADOW_RENDER_POWER=3
SHADOW_OFFSET="0 0"
ACTIVE_OPACITY=0.95
INACTIVE_OPACITY=0.88
DIM_INACTIVE="false"

# --- animation -------------------------------------------------------------
ANIMATIONS="true"
ANIMATION_PRESET="default"
ANIMATION_SPEED=1.0

# --- wallpaper -------------------------------------------------------------
WALLPAPER_IMAGE="wallpapers/profile/st-ay.jpg"
PROFILE_VARIANT="matched"

# --- programs and presets (selected when the profile is applied) -----------
BAR="waybar"
BAR_PRESET="st-ay"
LAUNCHER="fuzzel"
TERMINAL="kitty"
NOTIFIER="swaync"
WIDGET_SET=""
DOCK_ENABLE="false"
