# ---------------------------------------------------------------------------
#  preset: st-galaksi
#  title: Galaxy — Pixel Space
#  desc: Pixel-art spiral galaxies, a pink core, glowing
#        stars. Small thin-framed tiles on a transparent bar, dot
#        workspaces. Iosevka; kitty, dunst.
#  source: a reference image in temaornek/; the wallpaper was
#          drawn by us with tools/script-test-wallpapers.py.
# ---------------------------------------------------------------------------

THEME="st-galaksi"
FONT_FAMILY="Iosevka Nerd Font"
FONT_MONO="Iosevka Nerd Font Mono"
FONT_SIZE=10

# --- layout ----------------------------------------------------------------
LAYOUT="dwindle"
GAPS_IN=6
GAPS_OUT=12
BORDER_SIZE=2
BORDER_ANGLE=45
ROUNDING=6
ROUNDING_POWER=2

# --- decoration ------------------------------------------------------------
BLUR="true"
BLUR_SIZE=4
BLUR_PASSES=2
BLUR_XRAY="false"
BLUR_POPUPS="true"
SHADOW="false"
SHADOW_RANGE=0
SHADOW_RENDER_POWER=3
SHADOW_OFFSET="0 0"
ACTIVE_OPACITY=0.92
INACTIVE_OPACITY=0.85
DIM_INACTIVE="false"

# --- animation -------------------------------------------------------------
ANIMATIONS="true"
ANIMATION_PRESET="default"
ANIMATION_SPEED=1.0

# --- wallpaper -------------------------------------------------------------
WALLPAPER_IMAGE="wallpapers/st-galaksi.png"
PROFILE_VARIANT="wallhaven"

# --- programs and presets (selected when the profile is applied) -----------
BAR="waybar"
BAR_PRESET="st-galaksi"
LAUNCHER="rofi"
TERMINAL="kitty"
NOTIFIER="dunst"
WIDGET_SET=""
DOCK_ENABLE="false"
