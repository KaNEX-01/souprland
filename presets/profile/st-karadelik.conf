# ---------------------------------------------------------------------------
#  preset: st-karadelik
#  title: Black Hole — Event Horizon
#  desc: A glowing cream ring in the middle of a swirling dust cloud. A thick
#        black frame around the screen: wide outer gap, large rounded corners, a thin
#        cream border. A lean bar in the center. SF Pro Display, kitty, mako.
#  source: a reference image in temaornek/; the wallpaper was
#          drawn by us with tools/script-test-wallpapers.py.
# ---------------------------------------------------------------------------

THEME="st-karadelik"
FONT_FAMILY="SF Pro Display"
FONT_MONO="JetBrains Mono"
FONT_SIZE=10

# --- layout ----------------------------------------------------------------
LAYOUT="dwindle"
GAPS_IN=8
GAPS_OUT=18
BORDER_SIZE=2
BORDER_ANGLE=90
ROUNDING=18
ROUNDING_POWER=3

# --- decoration ------------------------------------------------------------
BLUR="true"
BLUR_SIZE=6
BLUR_PASSES=2
BLUR_XRAY="false"
BLUR_POPUPS="true"
SHADOW="true"
SHADOW_RANGE=30
SHADOW_RENDER_POWER=3
SHADOW_OFFSET="0 0"
ACTIVE_OPACITY=0.9
INACTIVE_OPACITY=0.8
DIM_INACTIVE="false"

# --- animation -------------------------------------------------------------
ANIMATIONS="true"
ANIMATION_PRESET="fluid"
ANIMATION_SPEED=1.0

# --- wallpaper -------------------------------------------------------------
WALLPAPER_IMAGE="wallpapers/profile/st-karadelik.jpg"
PROFILE_VARIANT="matched"

# --- programs and presets (selected when the profile is applied) -----------
BAR="waybar"
BAR_PRESET="st-karadelik"
LAUNCHER="fuzzel"
TERMINAL="kitty"
NOTIFIER="mako"
WIDGET_SET=""
DOCK_ENABLE="false"
