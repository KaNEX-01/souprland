# ---------------------------------------------------------------------------
#  preset: st-kagit
#  title: Ink Paper — Sumi-e
#  desc: A light theme: sepia paper, misty ink mountains and a red seal
#        sun. Plain windows with thin lines, no shadows, no blur;
#        an unfilled outlined bar, wofi, alacritty, mako.
# ---------------------------------------------------------------------------

THEME="st-kagit"
FONT_FAMILY="IBM Plex Serif"
FONT_MONO="IBM Plex Mono"
FONT_SIZE=11

# --- layout ----------------------------------------------------------------
LAYOUT="dwindle"
GAPS_IN=6
GAPS_OUT=14
BORDER_SIZE=1
BORDER_ANGLE=0
ROUNDING=2
ROUNDING_POWER=2

# --- decoration ------------------------------------------------------------
BLUR="false"
BLUR_SIZE=1
BLUR_PASSES=1
BLUR_XRAY="false"
BLUR_POPUPS="false"
SHADOW="false"
SHADOW_RANGE=0
SHADOW_RENDER_POWER=3
SHADOW_OFFSET="0 0"
ACTIVE_OPACITY=1.0
INACTIVE_OPACITY=1.0
DIM_INACTIVE="false"

# --- animation -------------------------------------------------------------
ANIMATIONS="true"
ANIMATION_PRESET="minimal"
ANIMATION_SPEED=1.0

# --- wallpaper -------------------------------------------------------------
WALLPAPER_IMAGE="wallpapers/st-kagit.png"
PROFILE_VARIANT="wallhaven"

# --- programs and presets (selected when the profile is applied) -----------
BAR="waybar"
BAR_PRESET="outline"
LAUNCHER="wofi"
TERMINAL="alacritty"
NOTIFIER="mako"
WIDGET_SET=""
DOCK_ENABLE="false"
