[[fix]]
file = "~/.config/hypr/hyprland/ignore.conf"
create = ""
why = "the exec line in hyprland.conf creates it during the session"
[[fix]]
file = "~/.config/hypr/hyprland/execs.conf"
replace = ["exec-once = caelestia pip -d", "exec-once = ~/.local/bin/caelestia pip -d"]
append = "\n# hyprsetup: the author starts the shell with uwsm + a systemd service; for non-uwsm sessions\nexec-once = sleep 1 && systemctl --user -q is-active caelestia-shell.service || PATH=\"$HOME/.local/bin:$PATH\" ~/.config/quickshell/caelestia/run.fish\n"
why = "~/.local/bin may not be on the session's PATH; there is no service starting the shell"
[[fix]]
file = "~/.config/hypr/hyprland/keybinds.conf"
replace = ["exec, caelestia ", "exec, ~/.local/bin/caelestia "]
why = "~/.local/bin may not be on the session's PATH"
[[fix]]
file = "~/.local/share/caelestia/scripts/scheme/score.py"
replace = ["#!/bin/python", "#!{home}/.local/share/caelestia/venv/bin/python"]
why = "materialyoucolor 2.x (doesn't work with the 3.x in the repos)"
[[fix]]
file = "~/.local/share/caelestia/scripts/scheme/autoadjust.py"
replace = ["#!/bin/python3", "#!{home}/.local/share/caelestia/venv/bin/python"]
why = "materialyoucolor 2.x (doesn't work with the 3.x in the repos)"
[[fix]]
file = "~/.config/quickshell/caelestia/modules/session/Content.qml"
replace = ['command: ["uwsm", "stop"]', 'command: ["sh", "-c", "uwsm stop || hyprctl dispatch exit"]']
why = "exit in non-uwsm sessions"

[packages]
repo = ["quickshell", "fish", "foot", "fuzzel", "ddcutil", "brightnessctl", "cava",
        "bluez-utils", "networkmanager", "lm_sensors", "fd", "imagemagick", "jq", "curl",
        "socat", "inotify-tools", "python", "python-pyaudio", "python-aubio", "python-numpy",
        "ttf-jetbrains-mono-nerd", "ttf-ibm-plex", "ttf-material-symbols-variable",
        "hyprlock", "hypridle", "polkit-gnome", "gnome-keyring", "wireplumber", "cliphist",
        "trash-cli", "gammastep", "geoclue", "wl-clipboard", "grim", "slurp",
        "xdg-user-dirs", "libnotify", "uwsm"]
aur = ["app2unit", "sway-audio-idle-inhibit-git", "sweet-cursors-hyprcursor-git",
       "wayfreeze", "wl-screenrec"]

