# caelestia (soramane) — r/unixporn "[Hyprland] I <3 Quickshell" (14)
# https://www.reddit.com/r/unixporn/comments/1l5ll27/
# Posted 2025-06-07 14:40 UTC (u/Rexcrazy804 shared it on behalf of the author
# u/_soramane). Three parts, each at the last commit before the post:
#   shell  caelestia-dots/shell   11f0ff76 (2025-06-07 23:26 +1000) — Quickshell, GPL-3.0
#   hypr   caelestia-dots/caelestia 492b100 (2025-06-04; then named "hypr")
#   cli    caelestia-dots/cli     6eb615d (2025-06-02; then named "scripts")
# The author's install: "caelestia install hypr|shell|scripts" — puts hypr in
# ~/.config/hypr, the scripts in ~/.local/share/caelestia/scripts (+
# ~/.local/bin/caelestia), the shell in ~/.config/quickshell/caelestia.
# The shell draws the wallpaper itself; colors from the wallpaper
# (caelestia wallpaper → scheme/gen-scheme, materialyoucolor).
#
# Adaptations: the author starts the shell under uwsm as a systemd service;
# here it is started from Hyprland so it also comes up in non-uwsm sessions. The color scripts
# are written against the materialyoucolor 2.x API (3.x has no DynamicScheme);
# 2.0.10 is installed into a separate virtualenv. Without uwsm, the session menu's
# "exit" quits via hyprctl.

default_variant = "violet"

post_install = [
  "python -m venv ~/.local/share/caelestia/venv && ~/.local/share/caelestia/venv/bin/pip install -q materialyoucolor==2.0.10",
  "chmod +x ~/.local/share/caelestia/scripts/*.fish ~/.local/share/caelestia/scripts/*/*.fish ~/.local/share/caelestia/scripts/*.sh ~/.local/share/caelestia/scripts/scheme/*.py ~/.config/hypr/scripts/*.fish ~/.config/quickshell/caelestia/run.fish ~/.config/quickshell/caelestia/assets/*.py 2>/dev/null || true",
  "hyprctl reload >/dev/null 2>&1 || true",
]

notes = [
  "Wallpapers are downloaded from the caelestia team's 'Sora's original demo wallpapers' archive (caelestia-dots/website, pinned commit); the archive is cached once.",
  "To change the look: open the launcher with SUPER and type '>wallpaper', or run 'caelestia wallpaper -f <file>'. Colors are generated from the wallpaper (light/dark automatically).",
  "The Spotify/Discord/Firefox themes are the author's separate 'caelestia install spicetify|discord|firefox' modules; they aren't installed.",
  "The shell is written for the 2025-06 Quickshell release ('root:/' imports); current Quickshell may print warnings.",
]

[source]
repo = "https://github.com/caelestia-dots/shell"
commit = "11f0ff76ad5e7eb5bd7f2570aafa984c842df1d5"
post = "https://www.reddit.com/r/unixporn/comments/1l5ll27/hyprland_i_3_quickshell/"
license = "GPL-3.0"

[[install]]
from = "."
to = "~/.config/quickshell/caelestia"

[[install]]
from = "."
to = "~/.config/hypr"
repo = "https://github.com/caelestia-dots/caelestia"
commit = "492b100abe4a6410fa2a99b82ca1b71dcaa847eb"
# File the author's scripts generate during the session (get-overrides.fish); make
# sure it exists on first load too.
[[install]]
from = "scripts/templates/hyprland/aesthetic.conf"
to = "~/.config/hypr/hyprland/overrides.conf"
repo = "https://github.com/caelestia-dots/caelestia"
commit = "492b100abe4a6410fa2a99b82ca1b71dcaa847eb"

[[install]]
from = "."
to = "~/.local/share/caelestia/scripts"
repo = "https://github.com/caelestia-dots/cli"
# No LICENSE at this commit (GPL-3.0 was added upstream later), so the
# archive is not redistributed; it is fetched from GitHub on install.
license = ""
commit = "6eb615db693ba0b330586a5878f390e437d7b03e"

