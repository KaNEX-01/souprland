# ---------------------------------------------------------------------------
#  preset: st-doom
#  title: DOOM — Hellfire
#  desc: Orange flames and sparks rising from an ember-black ground.
#        Square orange frames, semi-transparent terminals, a HUD-style
#        bar. Iosevka, kitty, dunst.
#  source: a reference image in temaornek/; the wallpaper was
#          drawn by us with tools/script-test-wallpapers.py.
# ---------------------------------------------------------------------------

THEME="st-doom"
FONT_FAMILY="Iosevka Nerd Font"
FONT_MONO="Iosevka Nerd Font Mono"
FONT_SIZE=10

# --- layout ----------------------------------------------------------------
LAYOUT="dwindle"
GAPS_IN=4
GAPS_OUT=8
BORDER_SIZE=2
BORDER_ANGLE=90
ROUNDING=0
ROUNDING_POWER=2

# --- decoration ------------------------------------------------------------
BLUR="true"
BLUR_SIZE=5
BLUR_PASSES=2
BLUR_XRAY="false"
BLUR_POPUPS="true"
SHADOW="true"
SHADOW_RANGE=14
SHADOW_RENDER_POWER=3
SHADOW_OFFSET="0 0"
ACTIVE_OPACITY=0.88
INACTIVE_OPACITY=0.78
DIM_INACTIVE="false"

# --- animation -------------------------------------------------------------
ANIMATIONS="true"
ANIMATION_PRESET="snappy"
ANIMATION_SPEED=1.0

# --- wallpaper -------------------------------------------------------------
WALLPAPER_IMAGE="wallpapers/profile/st-doom.jpg"
PROFILE_VARIANT="matched"

# --- programs and presets (selected when the profile is applied) -----------
BAR="waybar"
BAR_PRESET="st-doom"
LAUNCHER="rofi"
TERMINAL="kitty"
NOTIFIER="dunst"
WIDGET_SET=""
DOCK_ENABLE="false"
