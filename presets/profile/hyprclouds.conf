# ---------------------------------------------------------------------------
#  preset: hyprclouds
#  title: hyprclouds — eww, Material You
#  desc: arfan-on-clouds/hyprclouds (GitHub, 2025-01). An eww bar along the
#        bottom edge, an app strip on the left edge, a control center on the right (profile,
#        music, notifications, quick settings), an eww launcher opening in the center,
#        rofi with images, wlogout, hyprlock with a screenshot background. Colors
#        from the wallpaper (Material You), light and dark modes.
#
#  Your Hyprland settings stay; the values below come from the author's hyprland.conf
#  (the gallery card and Soup Maker's window preview use them; in the session
#  the same ones come from rice.conf).
# ---------------------------------------------------------------------------

THEME="auto"
FONT_FAMILY="SF Pro Display"
FONT_MONO="JetBrainsMono Nerd Font"
GAPS_IN=2
GAPS_OUT=5
BORDER_SIZE=2
ROUNDING=20
BLUR="true"
BLUR_SIZE=10
BLUR_PASSES=3
SHADOW="false"
ACTIVE_OPACITY=1.0
INACTIVE_OPACITY=0.95
ANIMATIONS="true"
ANIMATION_PRESET="custom"
ANIMATION_CUSTOM="bezier = overshot, 0.13, 0.99, 0.5, 1;;animation = layersIn, 1, 7, overshot, slide 80%;;animation = windows, 1, 7, overshot, slide;;animation = windowsIn, 1, 7, overshot, popin;;animation = windowsOut, 1, 7, overshot, slide;;animation = windowsMove, 1, 7, overshot, slide;;animation = border, 1, 8, default;;animation = fade, 1, 8, overshot"
PROFILE_VARIANT="sakura"
