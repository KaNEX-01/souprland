# ---------------------------------------------------------------------------
#  preset: st-mando
#  title: Mando — Sunset Warrior
#  desc: A pale giant sun in an orange sky, smoky clouds, a rocky silhouette and
#        drifting embers. Steel-blue base, sand-cream text; a framed
#        capsule bar, day name and uptime top left. Fira Sans,
#        kitty, swaync.
#  source: a reference image in temaornek/; the wallpaper was
#          drawn by us with tools/script-test-wallpapers.py.
# ---------------------------------------------------------------------------

THEME="st-mando"
FONT_FAMILY="Fira Sans"
FONT_MONO="FiraCode Nerd Font Mono"
FONT_SIZE=10

# --- layout ----------------------------------------------------------------
LAYOUT="dwindle"
GAPS_IN=6
GAPS_OUT=12
BORDER_SIZE=2
BORDER_ANGLE=45
ROUNDING=10
ROUNDING_POWER=2

# --- decoration ------------------------------------------------------------
BLUR="true"
BLUR_SIZE=6
BLUR_PASSES=2
BLUR_XRAY="false"
BLUR_POPUPS="true"
SHADOW="true"
SHADOW_RANGE=18
SHADOW_RENDER_POWER=3
SHADOW_OFFSET="0 0"
ACTIVE_OPACITY=0.93
INACTIVE_OPACITY=0.85
DIM_INACTIVE="false"

# --- animation -------------------------------------------------------------
ANIMATIONS="true"
ANIMATION_PRESET="default"
ANIMATION_SPEED=1.0

# --- wallpaper -------------------------------------------------------------
WALLPAPER_IMAGE="wallpapers/st-mando.png"
PROFILE_VARIANT="photo"

# --- programs and presets (selected when the profile is applied) -----------
BAR="waybar"
BAR_PRESET="st-mando"
LAUNCHER="rofi"
TERMINAL="kitty"
NOTIFIER="swaync"
WIDGET_ENGINE="eww"
WIDGET_SET=""
WIDGETS="clock,uptime"
WIDGET_ZONE_TL="clock,uptime"
WIDGET_SCALE="1.1"
WIDGET_RADIUS="10"
WIDGET_OPACITY="0.0"
WIDGET_MARGIN="40"
WIDGET_GAP="8"
DOCK_ENABLE="false"
