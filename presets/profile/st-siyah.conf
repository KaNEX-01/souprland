# ---------------------------------------------------------------------------
#  preset: st-siyah
#  title: Black — Charcoal
#  desc: Almost nothing: a charcoal-black ground, pale gray light seeping in
#        from a corner. A 20px text bar, the feel of a single full-screen
#        terminal with a thin gray border. JetBrains Mono, foot, mako.
#  source: a reference image in temaornek/; the wallpaper was
#          drawn by us with tools/script-test-wallpapers.py.
# ---------------------------------------------------------------------------

THEME="st-siyah"
FONT_FAMILY="JetBrains Mono"
FONT_MONO="JetBrains Mono"
FONT_SIZE=9

# --- layout ----------------------------------------------------------------
LAYOUT="master"
GAPS_IN=3
GAPS_OUT=6
BORDER_SIZE=1
BORDER_ANGLE=90
ROUNDING=0
ROUNDING_POWER=2

# --- decoration ------------------------------------------------------------
BLUR="false"
BLUR_SIZE=1
BLUR_PASSES=1
BLUR_XRAY="false"
BLUR_POPUPS="false"
SHADOW="false"
SHADOW_RANGE=0
SHADOW_RENDER_POWER=3
SHADOW_OFFSET="0 0"
ACTIVE_OPACITY=1.0
INACTIVE_OPACITY=0.9
DIM_INACTIVE="true"

# --- animation -------------------------------------------------------------
ANIMATIONS="true"
ANIMATION_PRESET="minimal"
ANIMATION_SPEED=1.0

# --- wallpaper -------------------------------------------------------------
WALLPAPER_IMAGE="wallpapers/profile/st-siyah.jpg"
PROFILE_VARIANT="matched"

# --- programs and presets (selected when the profile is applied) -----------
BAR="waybar"
BAR_PRESET="st-siyah"
LAUNCHER="fuzzel"
TERMINAL="foot"
NOTIFIER="mako"
WIDGET_SET=""
DOCK_ENABLE="false"
