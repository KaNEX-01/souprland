# ---------------------------------------------------------------------------
#  preset: st-kizil
#  title: Crimson — Cream Frames
#  desc: A red ground with a black sunburst. Black windows with thin cream
#        borders, almost sharp corners; a floating three-box bar
#        (Roman-numeral workspaces). A terminal-heavy layout with btop.
# ---------------------------------------------------------------------------

THEME="st-kizil"
FONT_FAMILY="JetBrains Mono"
FONT_MONO="JetBrains Mono"
FONT_SIZE=10

# --- layout --------------------------------------------------------------
LAYOUT="dwindle"
GAPS_IN=5
GAPS_OUT=10
BORDER_SIZE=2
BORDER_ANGLE=90
ROUNDING=5
ROUNDING_POWER=2

# --- decoration ----------------------------------------------------------
BLUR="false"
BLUR_SIZE=1
BLUR_PASSES=1
BLUR_XRAY="false"
BLUR_POPUPS="false"
SHADOW="false"
SHADOW_RANGE=0
SHADOW_RENDER_POWER=3
SHADOW_OFFSET="0 0"
ACTIVE_OPACITY=0.94
INACTIVE_OPACITY=0.9
DIM_INACTIVE="false"

# --- animation -----------------------------------------------------------
ANIMATIONS="true"
ANIMATION_PRESET="snappy"
ANIMATION_SPEED=1.0

# --- wallpaper -----------------------------------------------------------
WALLPAPER_IMAGE="wallpapers/profile/st-kizil.jpg"
PROFILE_VARIANT="matched"

# --- presets -------------------------------------------------------------
BAR="waybar"
LAUNCHER="rofi"
TERMINAL="alacritty"
NOTIFIER="dunst"
BAR_PRESET="st-kizil"
DOCK_ENABLE="false"
WIDGET_SET=""
