# ---------------------------------------------------------------------------
#  preset: st-limon
#  title: Lemon — Black Board
#  desc: A pitch-black ground with acid lemon-green comic panels in the
#        center. A thin floating rail on the left, a desktop full of cards: big
#        clock, now playing, system, calendar. SF Pro Rounded, kitty, swaync.
#  source: a reference image in temaornek/; the wallpaper was
#          drawn by us with tools/script-test-wallpapers.py.
# ---------------------------------------------------------------------------

THEME="st-limon"
FONT_FAMILY="SF Pro Rounded"
FONT_MONO="JetBrains Mono"
FONT_SIZE=10

# --- layout ----------------------------------------------------------------
LAYOUT="dwindle"
GAPS_IN=8
GAPS_OUT=16
BORDER_SIZE=2
BORDER_ANGLE=90
ROUNDING=14
ROUNDING_POWER=3

# --- decoration ------------------------------------------------------------
BLUR="true"
BLUR_SIZE=6
BLUR_PASSES=2
BLUR_XRAY="false"
BLUR_POPUPS="true"
SHADOW="false"
SHADOW_RANGE=0
SHADOW_RENDER_POWER=3
SHADOW_OFFSET="0 0"
ACTIVE_OPACITY=0.95
INACTIVE_OPACITY=0.88
DIM_INACTIVE="false"

# --- animation -------------------------------------------------------------
ANIMATIONS="true"
ANIMATION_PRESET="fluid"
ANIMATION_SPEED=1.0

# --- wallpaper -------------------------------------------------------------
WALLPAPER_IMAGE="wallpapers/st-limon.png"
PROFILE_VARIANT="wallhaven"

# --- programs and presets (selected when the profile is applied) -----------
BAR="waybar"
BAR_PRESET="st-limon"
LAUNCHER="rofi"
TERMINAL="kitty"
NOTIFIER="swaync"
WIDGET_ENGINE="eww"
WIDGET_SET=""
WIDGETS="clock,music,sysinfo,calendar,worldclock"
WIDGET_ZONE_TL="clock,music"
WIDGET_ZONE_TR="worldclock,sysinfo"
WIDGET_ZONE_BR="calendar"
WIDGET_SCALE="1.0"
WIDGET_RADIUS="16"
WIDGET_OPACITY="0.9"
WIDGET_MARGIN="20"
WIDGET_GAP="12"
DOCK_ENABLE="false"
