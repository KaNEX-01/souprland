# ---------------------------------------------------------------------------
#  preset: st-zirve
#  title: Summit — Snowy Mountain
#  desc: A light theme: a misty gray sky, a black-and-white snowy peak. A giant
#        clock top center, a navy clock capsule on a light gray strip. Soft
#        corners. IBM Plex Sans, foot, mako.
#  source: a reference image in temaornek/; the wallpaper was
#          drawn by us with tools/script-test-wallpapers.py.
# ---------------------------------------------------------------------------

THEME="st-zirve"
FONT_FAMILY="IBM Plex Sans"
FONT_MONO="IBM Plex Mono"
FONT_SIZE=10

# --- layout ----------------------------------------------------------------
LAYOUT="dwindle"
GAPS_IN=6
GAPS_OUT=12
BORDER_SIZE=2
BORDER_ANGLE=90
ROUNDING=8
ROUNDING_POWER=2

# --- decoration ------------------------------------------------------------
BLUR="false"
BLUR_SIZE=1
BLUR_PASSES=1
BLUR_XRAY="false"
BLUR_POPUPS="false"
SHADOW="true"
SHADOW_RANGE=18
SHADOW_RENDER_POWER=2
SHADOW_OFFSET="0 4"
ACTIVE_OPACITY=1.0
INACTIVE_OPACITY=0.95
DIM_INACTIVE="false"

# --- animation -------------------------------------------------------------
ANIMATIONS="true"
ANIMATION_PRESET="default"
ANIMATION_SPEED=1.0

# --- wallpaper -------------------------------------------------------------
WALLPAPER_IMAGE="wallpapers/profile/st-zirve.jpg"
PROFILE_VARIANT="matched"

# --- programs and presets (selected when the profile is applied) -----------
BAR="waybar"
BAR_PRESET="st-zirve"
LAUNCHER="fuzzel"
TERMINAL="foot"
NOTIFIER="mako"
WIDGET_ENGINE="eww"
WIDGET_SET=""
WIDGETS="clock"
WIDGET_ZONE_TC="clock"
WIDGET_SCALE="2.0"
WIDGET_RADIUS="0"
WIDGET_OPACITY="0.0"
WIDGET_MARGIN="120"
WIDGET_GAP="10"
DOCK_ENABLE="false"
