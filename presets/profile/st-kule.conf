# ---------------------------------------------------------------------------
#  preset: st-kule
#  title: Tower — Night Line
#  desc: A personal dark theme. In the back, the animated "Dark Transmission
#        Tower" from Wallpaper Engine (linux-wallpaperengine); on top, a night strip
#        flush with the screen: workspace numbers + the windows in them,
#        a detailed player in the center. Navy-black, steel blue, pylon
#        warning-light red. Inter; kitty, fuzzel, swaync.
#  source: wallpaper is Steam Workshop 2579315681 (played locally via
#          linux-wallpaperengine as a Wallpaper Engine owner, not copied into
#          the repo).
# ---------------------------------------------------------------------------

THEME="st-kule"
FONT_FAMILY="Inter"
FONT_MONO="CaskaydiaCove Nerd Font Mono"
FONT_SIZE=10

# --- layout ----------------------------------------------------------------
LAYOUT="dwindle"
GAPS_IN=4
GAPS_OUT=8
BORDER_SIZE=1
BORDER_ANGLE=90
ROUNDING=6
ROUNDING_POWER=2

# --- decoration ------------------------------------------------------------
BLUR="true"
BLUR_SIZE=6
BLUR_PASSES=2
BLUR_XRAY="false"
BLUR_POPUPS="true"
SHADOW="true"
SHADOW_RANGE=18
SHADOW_RENDER_POWER=3
SHADOW_OFFSET="0 4"
# Windows don't become transparent (even when unfocused); the terminal's transparency
# comes from kitty's own background opacity, which is left alone.
ACTIVE_OPACITY=1.0
INACTIVE_OPACITY=1.0
DIM_INACTIVE="false"

# --- animation -------------------------------------------------------------
ANIMATIONS="true"
ANIMATION_PRESET="fluid"
ANIMATION_SPEED=1.0

# --- wallpaper -------------------------------------------------------------
# Plays the animated Wallpaper Engine scene on the desktop (Steam Workshop
# item 2579315681 via linux-wallpaperengine).
WALLPAPER_IMAGE=""
WALLPAPER_DAEMON="wallpaperengine"
WPENGINE_ID="2579315681"
WPENGINE_SCREEN=""
WPENGINE_SCALING="fill"
WPENGINE_FPS="30"
WPENGINE_SILENT="true"
WPENGINE_EXTRA_ARGS=""

# --- programs and presets (selected when the profile is applied) -----------
BAR="waybar"
BAR_PRESET="st-kule"
LAUNCHER="fuzzel"
TERMINAL="kitty"
NOTIFIER="swaync"
WIDGET_SET=""
WIDGETS=""
DOCK_ENABLE="false"
