# ---------------------------------------------------------------------------
#  preset: st-kutup
#  title: Aurora — Ice
#  desc: Curtains of aurora over snowy mountains. A plain Quickshell bar with
#        just workspaces and clock, frosted-glass blur,
#        fuzzel, foot, swaync and a world clocks widget.
# ---------------------------------------------------------------------------

THEME="st-kutup"
FONT_FAMILY="Inter"
FONT_MONO="JetBrains Mono"
FONT_SIZE=10

# --- layout ----------------------------------------------------------------
LAYOUT="dwindle"
GAPS_IN=8
GAPS_OUT=18
BORDER_SIZE=1
BORDER_ANGLE=60
ROUNDING=14
ROUNDING_POWER=2

# --- decoration ------------------------------------------------------------
BLUR="true"
BLUR_SIZE=12
BLUR_PASSES=4
BLUR_XRAY="false"
BLUR_POPUPS="true"
SHADOW="true"
SHADOW_RANGE=24
SHADOW_RENDER_POWER=3
SHADOW_OFFSET="0 6"
ACTIVE_OPACITY=0.9
INACTIVE_OPACITY=0.82
DIM_INACTIVE="false"

# --- animation -------------------------------------------------------------
ANIMATIONS="true"
ANIMATION_PRESET="fluid"
ANIMATION_SPEED=1.0

# --- wallpaper -------------------------------------------------------------
WALLPAPER_IMAGE="wallpapers/st-kutup.png"
PROFILE_VARIANT="photo"

# --- programs and presets (selected when the profile is applied) -----------
BAR="quickshell-bar"
BAR_PRESET="quickshell-minimal"
LAUNCHER="fuzzel"
TERMINAL="foot"
NOTIFIER="swaync"
WIDGET_ENGINE="eww"
WIDGET_SET="traveler"
DOCK_ENABLE="false"
