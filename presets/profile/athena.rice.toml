# The settings app's Bar page recognizes this bar (ricebar.py).
[bar]
kind = "eww"
label = "athena (eww)"
note = "The eww bar's settings live in the author's yuck/scss files; the theme (Catppuccin/Tokyo Night) is changed from Looks."

# --- Mix parts (python -m hyprsetup mix; see python/hyprsetup/mix.py) ---
[[part]]
slot = "bar"
title = "Eww bar"
paths = ["~/.config/eww"]
start = "eww daemon; sleep 1; eww open window_bar"
provides = ["bar"]
aur = ["eww"]

[[part]]
slot = "widget"
title = "Eww desktop cards (web, launcher, power)"
paths = ["~/.config/eww"]
start = "sleep 3; eww open-many window_website window_launcher window_power"
provides = ["widget"]
aur = ["eww"]

[[part]]
slot = "launcher"
title = "Rofi (Catppuccin)"
paths = ["~/.config/rofi"]
commands = { CMD_LAUNCHER = "rofi -show drun" }
packages = ["rofi"]

[[part]]
slot = "notify"
title = "Dunst notifications"
paths = ["~/.config/dunst"]
start = "dunst"
provides = ["notify"]
packages = ["dunst"]

[[part]]
slot = "terminal"
title = "Kitty"
paths = ["~/.config/kitty"]
commands = { CMD_TERMINAL = "kitty" }
packages = ["kitty"]
