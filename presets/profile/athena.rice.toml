# haikal-hakim/athena-eww — r/hyprland "[Hyprland + Eww] ... complete overhaul"
# https://www.reddit.com/r/hyprland/comments/1tyv74j/
# Posted 2026-06-06T22:47Z; the commit is the one 10 minutes before that (a42d501).
# The author didn't share their Hyprland config; the lines that start eww and
# the keybindings are written from their README example as ~/.config/hypr/rice.conf,
# which this project's hyprland.conf sources.

default_variant = "mocha"
provides = ["bar", "notify", "widget", "wallpaper"]

post_install = [
  "chmod +x ~/.config/eww/*/scripts/*.sh ~/.config/eww/toggle_theme.sh 2>/dev/null || true",
  "pkill -x waybar; pkill -x hyprpanel; pkill -x mako; pkill -x swaync; true",
  "hyprctl reload >/dev/null 2>&1 || true",
]

notes = [
  "The author didn't share their Hyprland config: gaps/rounding/blur were roughly measured from the video (athena.conf).",
  "The wallpaper in the video (Arch logo over light blue waves) isn't in the repo; Arch's official blue 'conference' wallpaper (archlinux-wallpaper package, CC0) is installed instead.",
  "Weather comes from keyless Open-Meteo; the location is hyprsetup's WEATHER_LOCATION setting (guessed from IP if empty). If an OpenWeatherMap key is entered (dashboard/scripts/weather.py), the author's original path is used.",
]

