[[file]]
to = "~/.config/hypr/rice.conf"
content = """# athena-eww (hyprsetup profile) — from the author's README example.
exec-once = eww daemon
exec-once = sleep 2 && eww open window_bar
exec-once = sleep 3 && eww open window_website
exec-once = sleep 4 && eww open window_launcher
exec-once = sleep 5 && eww open window_power
# Wallpaper (the look writes it): with its own config, without touching the
# user's hyprpaper.conf.
exec-once = hyprpaper -c ~/.config/eww/hyprpaper.conf

# Dashboard (MOD+D) and OSD on the volume/brightness keys. This project's
# bindings on the same keys are removed first; otherwise volume would change twice.
unbind = SUPER, D
bind = SUPER, D, exec, ~/.config/eww/dashboard/scripts/toggle_dashboard.sh
unbind = , XF86AudioRaiseVolume
unbind = , XF86AudioLowerVolume
unbind = , XF86MonBrightnessUp
unbind = , XF86MonBrightnessDown
bindel = , XF86AudioRaiseVolume, exec, bash ~/.config/eww/corner/scripts/osd_vol.sh vol-up
bindel = , XF86AudioLowerVolume, exec, bash ~/.config/eww/corner/scripts/osd_vol.sh vol-down
bindel = , XF86MonBrightnessUp, exec, bash ~/.config/eww/corner/scripts/osd_bright.sh bright-up
bindel = , XF86MonBrightnessDown, exec, bash ~/.config/eww/corner/scripts/osd_bright.sh bright-down
"""

# Same thing, for this project's Lua mode (hyprland.lua → require("rice")).
[[file]]
to = "~/.config/hypr/rice.lua"
content = """-- athena-eww (hyprsetup profile) — from the author's README example.
hl.on("hyprland.start", function()
    hl.exec_cmd("eww daemon")
    hl.exec_cmd("sleep 2 && eww open window_bar")
    hl.exec_cmd("sleep 3 && eww open window_website")
    hl.exec_cmd("sleep 4 && eww open window_launcher")
    hl.exec_cmd("sleep 5 && eww open window_power")
    hl.exec_cmd("hyprpaper -c ~/.config/eww/hyprpaper.conf")
end)

hl.unbind("SUPER + D")
hl.bind("SUPER + D", hl.dsp.exec_cmd("~/.config/eww/dashboard/scripts/toggle_dashboard.sh"))
for _, key in ipairs({"XF86AudioRaiseVolume", "XF86AudioLowerVolume",
                      "XF86MonBrightnessUp", "XF86MonBrightnessDown"}) do
    hl.unbind(key)
end
local osd = "bash ~/.config/eww/corner/scripts/"
hl.bind("XF86AudioRaiseVolume", hl.dsp.exec_cmd(osd .. "osd_vol.sh vol-up"), { repeating = true, locked = true })
hl.bind("XF86AudioLowerVolume", hl.dsp.exec_cmd(osd .. "osd_vol.sh vol-down"), { repeating = true, locked = true })
hl.bind("XF86MonBrightnessUp", hl.dsp.exec_cmd(osd .. "osd_bright.sh bright-up"), { repeating = true, locked = true })
hl.bind("XF86MonBrightnessDown", hl.dsp.exec_cmd(osd .. "osd_bright.sh bright-down"), { repeating = true, locked = true })
"""

# Weather: the author's weather.py wants an OpenWeatherMap key (the file has a
# "YOUR_API_KEY" placeholder); without a key the dashboard showed "0°C Unknown".
# If no key is entered, the data comes from keyless Open-Meteo in the format
# weather.py expects (location: hyprsetup's WEATHER_LOCATION setting).
[[file]]
to = "~/.config/eww/dashboard/scripts/weather_keyless.py"
content = '''"""hyprsetup: keyless weather (Open-Meteo), in OpenWeatherMap format.

weather.py wants the author's OpenWeatherMap key (API_KEY placeholder);
without a key the dashboard showed "0°C Unknown". This module fetches the same
data from keyless Open-Meteo and converts it into the dicts weather.py expects,
so the rest of the author's code runs unchanged.

Location: hyprsetup's WEATHER_LOCATION setting (the HYPRSETUP_WEATHER_LOCATION
environment variable takes precedence); if empty, wttr.in guesses from the IP — the
same rule as the project's own weather module.
"""
import json
import os
import re
import urllib.parse
import urllib.request
from datetime import datetime

_WMO = {
    0: "Clear Sky", 1: "Mainly Clear", 2: "Partly Cloudy", 3: "Overcast",
    45: "Fog", 48: "Fog", 51: "Light Drizzle", 53: "Drizzle", 55: "Drizzle",
    56: "Drizzle", 57: "Drizzle", 61: "Light Rain", 63: "Rain", 65: "Heavy Rain",
    66: "Rain", 67: "Rain", 71: "Light Snow", 73: "Snow", 75: "Heavy Snow",
    77: "Snow", 80: "Rain Shower", 81: "Rain Shower", 82: "Rain Shower",
    85: "Snow Shower", 86: "Snow Shower", 95: "Thunderstorm", 96: "Thunderstorm",
    99: "Thunderstorm",
}


def _get(url):
    req = urllib.request.Request(url, headers={"User-Agent": "EwwWeatherWidget/1.0"})
    with urllib.request.urlopen(req, timeout=8) as response:
        return json.loads(response.read().decode())


def _location():
    name = os.environ.get("HYPRSETUP_WEATHER_LOCATION", "").strip()
    if not name:
        conf = os.path.expanduser("~/.config/hyprsetup/settings.conf")
        try:
            with open(conf, encoding="utf-8") as handle:
                match = re.search(r'^WEATHER_LOCATION="([^"]*)"', handle.read(), re.M)
                name = match.group(1).strip() if match else ""
        except OSError:
            name = ""
    if name:
        found = _get("https://geocoding-api.open-meteo.com/v1/search?count=1&name="
                     + urllib.parse.quote(name))["results"][0]
        return found["latitude"], found["longitude"], found["name"]
    area = _get("https://wttr.in/?format=j1")["nearest_area"][0]
    return (float(area["latitude"]), float(area["longitude"]),
            area["areaName"][0]["value"])


def fetch():
    """(current_raw, forecast_raw) — (None, None) on failure."""
    try:
        lat, lon, place = _location()
        data = _get(
            "https://api.open-meteo.com/v1/forecast?"
            f"latitude={lat}&longitude={lon}&timezone=auto&forecast_days=6"
            "&current=temperature_2m,relative_humidity_2m,weather_code,wind_speed_10m"
            "&daily=weather_code,temperature_2m_max,sunrise,sunset")
    except Exception:
        return None, None
    cur, daily = data["current"], data["daily"]

    def ts(text):
        return datetime.fromisoformat(text).timestamp()

    current = {
        "name": place,
        "dt": datetime.now().timestamp(),
        "main": {"temp": cur["temperature_2m"], "humidity": cur["relative_humidity_2m"]},
        "weather": [{"description": _WMO.get(cur["weather_code"], "Clouds")}],
        "wind": {"speed": cur["wind_speed_10m"] / 3.6},
        "sys": {"sunrise": ts(daily["sunrise"][0]), "sunset": ts(daily["sunset"][0])},
    }
    forecast = {"list": [
        {"dt": ts(day + "T12:00"), "main": {"temp": temp},
         "weather": [{"description": _WMO.get(code, "Clouds")}]}
        for day, temp, code in zip(daily["time"], daily["temperature_2m_max"],
                                   daily["weather_code"])
    ]}
    return current, forecast
'''
[[fix]]
file = "~/.config/eww/dashboard/scripts/weather.py"
replace = ["def main():\n    current_raw = fetch_current()\n    forecast_raw = fetch_forecast()\n", "def main():\n    if API_KEY == \"YOUR_API_KEY\":\n        # hyprsetup: no key entered — keyless Open-Meteo (weather_keyless.py)\n        import weather_keyless\n        current_raw, forecast_raw = weather_keyless.fetch()\n    else:\n        current_raw = fetch_current()\n        forecast_raw = fetch_forecast()\n"]
why = "Without an OpenWeatherMap key, weather, forecast and sunrise/sunset stayed empty"

[[file]]
to = "~/.config/eww/hyprpaper.conf"
content = """wallpaper {
    monitor =
    path = {home}/Pictures/Wallpapers/athena-arch.png
    fit_mode = cover
}
splash = false
ipc = on
"""

[[fix]]
file = "~/.config/eww/dashboard/styles/folders.scss"
create = ""
why = "theme/manifest.scss imports this file, which isn't in the repo; when the SCSS failed to compile eww dropped all styles and drew the bar gray (no widget uses it)"

