        "networkmanager", "hyprshutdown", "power-profiles-daemon", "rofi", "kitty",
        "fastfetch", "blueman", "bluez-utils", "brightnessctl", "wireplumber",
        "inter-font", "ttf-jetbrains-mono-nerd"]
aur = ["eww"]

# Looks: the theme switcher in the author's control center (toggle_theme.sh).
[variants.mocha]
title = "Catppuccin Mocha (dark)"
wallpaper = "/usr/share/backgrounds/archlinux/conference.png"
wallpaper_dest = "~/Pictures/Wallpapers/athena-arch.png"
apply = [
  "printf 'wallpaper {\\n    monitor =\\n    path = %s\\n    fit_mode = cover\\n}\\nsplash = false\\nipc = on\\n' {wallpaper} > ~/.config/eww/hyprpaper.conf",
  "pkill -x hyprpaper; sleep 0.3; hyprpaper -c ~/.config/eww/hyprpaper.conf >/dev/null 2>&1 &",
  "~/.config/eww/toggle_theme.sh catppuccin_mocha",
