# ---------------------------------------------------------------------------
#  preset: st-yaprak
#  title: Leaf — Green Material
#  desc: A dark green leaf wallpaper, soft-cornered dark surfaces with a
#        Material feel and a light green accent. An edge-to-edge bar on top
#        (workspaces with app icons in the center), a floating dock at the bottom.
# ---------------------------------------------------------------------------

THEME="st-yaprak"
FONT_FAMILY="Inter"
FONT_MONO="JetBrains Mono"
FONT_SIZE=10

# --- layout --------------------------------------------------------------
LAYOUT="dwindle"
GAPS_IN=8
GAPS_OUT=18
BORDER_SIZE=1
BORDER_ANGLE=45
ROUNDING=18
ROUNDING_POWER=2

# --- decoration ----------------------------------------------------------
BLUR="true"
BLUR_SIZE=8
BLUR_PASSES=3
BLUR_XRAY="false"
BLUR_POPUPS="true"
SHADOW="true"
SHADOW_RANGE=24
SHADOW_RENDER_POWER=3
SHADOW_OFFSET="0 6"
ACTIVE_OPACITY=0.97
INACTIVE_OPACITY=0.93
DIM_INACTIVE="false"

# --- animation -----------------------------------------------------------
ANIMATIONS="true"
ANIMATION_PRESET="fluid"
ANIMATION_SPEED=1.0

# --- wallpaper -----------------------------------------------------------
WALLPAPER_IMAGE="wallpapers/st-yaprak.png"
PROFILE_VARIANT="wallhaven"

# --- presets -------------------------------------------------------------
BAR="waybar"
LAUNCHER="fuzzel"
TERMINAL="kitty"
NOTIFIER="swaync"
BAR_PRESET="st-yaprak"

# --- dock ----------------------------------------------------------------
DOCK_ENABLE="true"
WIDGET_SET=""
DOCK_POSITION="bottom"
DOCK_AUTOHIDE="false"
DOCK_ICON_SIZE=40
DOCK_MARGIN=10
DOCK_RADIUS=18
DOCK_OPACITY=0.85
DOCK_LAUNCHER="true"
