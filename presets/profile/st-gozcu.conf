# ---------------------------------------------------------------------------
#  preset: st-gozcu
#  title: Sentinel — Green Moon
#  desc: A personal dark theme, sibling of st-kule. In the back, the animated
#        "mountains green" from Wallpaper Engine (linux-wallpaperengine):
#        misty mountains, a neon green moon, a watchtower. Charcoal base, mint
#        green accents; a soft strip flush with the top, a detailed player
#        in the center. Inter; kitty, fuzzel, swaync.
#  source: wallpaper is Steam Workshop 2363450232 (played locally via
#          linux-wallpaperengine as a Wallpaper Engine owner, not copied into
#          the repo).
# ---------------------------------------------------------------------------

THEME="st-gozcu"
FONT_FAMILY="Inter"
FONT_MONO="CaskaydiaCove Nerd Font Mono"
FONT_SIZE=10

# --- layout ----------------------------------------------------------------
LAYOUT="dwindle"
GAPS_IN=4
GAPS_OUT=8
BORDER_SIZE=1
BORDER_ANGLE=90
ROUNDING=6
ROUNDING_POWER=2

# Workspaces are split evenly across connected displays: with two displays the first gets 1-5,
# the second 6-10 (each bar only shows its own display's). Display
# names are detected at install time; no effect with a single display. If nwg-displays
# wrote workspaces.conf, its mapping wins.
WORKSPACE_SPLIT="auto"

# --- decoration ------------------------------------------------------------
BLUR="true"
BLUR_SIZE=6
BLUR_PASSES=2
BLUR_XRAY="false"
BLUR_POPUPS="true"
SHADOW="true"
SHADOW_RANGE=18
SHADOW_RENDER_POWER=3
SHADOW_OFFSET="0 4"
# Windows don't become transparent (even when unfocused); the terminal's transparency
# comes from kitty's own background opacity, which is left alone.
ACTIVE_OPACITY=1.0
INACTIVE_OPACITY=1.0
DIM_INACTIVE="false"

# --- animation -------------------------------------------------------------
ANIMATIONS="true"
ANIMATION_PRESET="fluid"
ANIMATION_SPEED=1.0

# --- wallpaper -------------------------------------------------------------
# Plays the animated Wallpaper Engine scene on the desktop (Steam Workshop
# item 2363450232 via linux-wallpaperengine).
WALLPAPER_IMAGE=""
WALLPAPER_DAEMON="wallpaperengine"
WPENGINE_ID="2363450232"
WPENGINE_SCREEN=""
WPENGINE_SCALING="fill"
WPENGINE_FPS="30"
WPENGINE_SILENT="true"
WPENGINE_EXTRA_ARGS=""

# --- programs and presets (selected when the profile is applied) -----------
BAR="waybar"
BAR_PRESET="st-gozcu"
LAUNCHER="fuzzel"
TERMINAL="kitty"
NOTIFIER="swaync"
WIDGET_SET=""
WIDGETS=""
DOCK_ENABLE="false"
# Green audio bars along the bottom edge (cava): the same mint as the moon, dimmed.
VIS_ENABLE="true"
VIS_MODE="desktop"
VIS_COLOR=""
VIS_BRIGHTNESS=55
VIS_HEIGHT=130
VIS_WIDTH=60

# --- the user's own latest state (2026-10-04) ------------------------------
# Terminal: a transparent window and fastfetch with its own image at startup. The logo image
# is local (~/.config/hyprsetup/images); on another machine without it, it falls back to the
# distro logo.
COLOR_SCHEME="dark"
# Cursor: theme-specific, ships with the repo (assets/cursors, tools/gozcu-cursors.py):
# charcoal body, mint outline; while waiting, moon phases cycle.
CURSOR_THEME="Gozcu-Cursors"
DOCK_MARGIN="10"
TERM_OPACITY="0.405172"
TERM_FETCH="on"
TERM_LOGO="image"
TERM_LOGO_IMAGE="~/.config/hyprsetup/images/term-logo-image-cd6ca3d051.png"
# ALT+Tab: fixes CachyOS's low session priority (it lagged while a game
# was running). On apply a terminal opens and asks for sudo there.
SWITCHER_PRIORITY="session"
