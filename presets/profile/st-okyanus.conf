# ---------------------------------------------------------------------------
#  preset: st-okyanus
#  title: Deep Ocean — Bottom Capsule
#  desc: Underwater: light shafts, turquoise accent. The bar is a floating capsule at the
#        bottom (Quickshell), master layout, wofi spotlight launcher, alacritty and
#        dunst.
# ---------------------------------------------------------------------------

THEME="st-okyanus"
FONT_FAMILY="IBM Plex Sans"
FONT_MONO="IBM Plex Mono"
FONT_SIZE=10

# --- layout ----------------------------------------------------------------
LAYOUT="master"
GAPS_IN=8
GAPS_OUT=16
BORDER_SIZE=2
BORDER_ANGLE=90
ROUNDING=12
ROUNDING_POWER=2

# --- decoration ------------------------------------------------------------
BLUR="true"
BLUR_SIZE=8
BLUR_PASSES=3
BLUR_XRAY="false"
BLUR_POPUPS="true"
SHADOW="true"
SHADOW_RANGE=22
SHADOW_RENDER_POWER=3
SHADOW_OFFSET="0 6"
ACTIVE_OPACITY=0.94
INACTIVE_OPACITY=0.86
DIM_INACTIVE="false"

# --- animation -------------------------------------------------------------
ANIMATIONS="true"
ANIMATION_PRESET="default"
ANIMATION_SPEED=1.0

# --- wallpaper -------------------------------------------------------------
WALLPAPER_IMAGE="wallpapers/st-okyanus.png"
PROFILE_VARIANT="photo"

# --- programs and presets (selected when the profile is applied) -----------
BAR="quickshell-bar"
BAR_PRESET="quickshell-dock"
LAUNCHER="wofi"
TERMINAL="alacritty"
NOTIFIER="dunst"
WIDGET_SET=""
DOCK_ENABLE="false"
