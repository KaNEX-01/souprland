# ---------------------------------------------------------------------------
#  preset: st-crt
#  title: Phosphor CRT — Retro Terminal
#  desc: An old green phosphor screen: scanlines, lines of code. Jet black,
#        square, no animations; a [ bracketed ] bar, pixel font, wofi,
#        alacritty and mako.
# ---------------------------------------------------------------------------

THEME="st-crt"
FONT_FAMILY="Pixelon"
FONT_MONO="Hack"
FONT_SIZE=11

# --- layout ----------------------------------------------------------------
LAYOUT="master"
GAPS_IN=2
GAPS_OUT=4
BORDER_SIZE=1
BORDER_ANGLE=0
ROUNDING=0
ROUNDING_POWER=2

# --- decoration ------------------------------------------------------------
BLUR="false"
BLUR_SIZE=1
BLUR_PASSES=1
BLUR_XRAY="false"
BLUR_POPUPS="false"
SHADOW="false"
SHADOW_RANGE=0
SHADOW_RENDER_POWER=3
SHADOW_OFFSET="0 0"
ACTIVE_OPACITY=1.0
INACTIVE_OPACITY=0.85
DIM_INACTIVE="false"

# --- animation -------------------------------------------------------------
ANIMATIONS="false"
ANIMATION_PRESET="none"
ANIMATION_SPEED=1.0

# --- wallpaper -------------------------------------------------------------
WALLPAPER_IMAGE="wallpapers/st-crt.png"
PROFILE_VARIANT="photo"

# --- programs and presets (selected when the profile is applied) -----------
BAR="waybar"
BAR_PRESET="bracket"
LAUNCHER="wofi"
TERMINAL="alacritty"
NOTIFIER="mako"
WIDGET_SET=""
DOCK_ENABLE="false"
