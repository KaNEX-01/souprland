# ---------------------------------------------------------------------------
#  preset: st-nerv
#  title: NERV — MAGI Panel
#  desc: Crimson brush strokes, a honeycomb grid: the feel of the Evangelion command
#        room. Dark panels, coral/purple/green stripes, a bar with a coral
#        underline. Fira Sans Condensed, Iosevka; kitty, dunst.
#  source: a reference image in temaornek/; the wallpaper was
#          drawn by us with tools/script-test-wallpapers.py.
# ---------------------------------------------------------------------------

THEME="st-nerv"
FONT_FAMILY="Fira Sans Condensed"
FONT_MONO="Iosevka Nerd Font Mono"
FONT_SIZE=10

# --- layout ----------------------------------------------------------------
LAYOUT="master"
GAPS_IN=6
GAPS_OUT=14
BORDER_SIZE=2
BORDER_ANGLE=90
ROUNDING=0
ROUNDING_POWER=2

# --- decoration ------------------------------------------------------------
BLUR="true"
BLUR_SIZE=4
BLUR_PASSES=2
BLUR_XRAY="false"
BLUR_POPUPS="true"
SHADOW="false"
SHADOW_RANGE=0
SHADOW_RENDER_POWER=3
SHADOW_OFFSET="0 0"
ACTIVE_OPACITY=0.93
INACTIVE_OPACITY=0.85
DIM_INACTIVE="false"

# --- animation -------------------------------------------------------------
ANIMATIONS="true"
ANIMATION_PRESET="snappy"
ANIMATION_SPEED=1.0

# --- wallpaper -------------------------------------------------------------
WALLPAPER_IMAGE="wallpapers/st-nerv.png"
PROFILE_VARIANT="photo"

# --- programs and presets (selected when the profile is applied) -----------
BAR="waybar"
BAR_PRESET="st-nerv"
LAUNCHER="rofi"
TERMINAL="kitty"
NOTIFIER="dunst"
WIDGET_ENGINE="eww"
WIDGET_SET=""
WIDGETS="sysinfo,temperature,disk"
WIDGET_ZONE_TR="sysinfo,temperature"
WIDGET_ZONE_BR="disk"
WIDGET_SCALE="1.0"
WIDGET_RADIUS="0"
WIDGET_OPACITY="0.85"
WIDGET_MARGIN="20"
WIDGET_GAP="8"
DOCK_ENABLE="false"
