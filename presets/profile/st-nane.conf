# ---------------------------------------------------------------------------
#  preset: st-nane
#  title: Mint — Persona Cyan
#  desc: Bright mint-cyan geometric shards, slanted stripes. A thin capsule bar
#        floating in the center, a system card top right, a big clock bottom
#        right. Sharp-cornered windows. Fira Sans Condensed, foot, mako.
#  source: a reference image in temaornek/; the wallpaper was
#          drawn by us with tools/script-test-wallpapers.py.
# ---------------------------------------------------------------------------

THEME="st-nane"
FONT_FAMILY="Fira Sans Condensed"
FONT_MONO="JetBrains Mono"
FONT_SIZE=10

# --- layout ----------------------------------------------------------------
LAYOUT="dwindle"
GAPS_IN=6
GAPS_OUT=14
BORDER_SIZE=2
BORDER_ANGLE=120
ROUNDING=4
ROUNDING_POWER=2

# --- decoration ------------------------------------------------------------
BLUR="true"
BLUR_SIZE=5
BLUR_PASSES=2
BLUR_XRAY="false"
BLUR_POPUPS="true"
SHADOW="false"
SHADOW_RANGE=0
SHADOW_RENDER_POWER=3
SHADOW_OFFSET="0 0"
ACTIVE_OPACITY=0.9
INACTIVE_OPACITY=0.82
DIM_INACTIVE="false"

# --- animation -------------------------------------------------------------
ANIMATIONS="true"
ANIMATION_PRESET="snappy"
ANIMATION_SPEED=1.0

# --- wallpaper -------------------------------------------------------------
WALLPAPER_IMAGE="wallpapers/profile/st-nane.jpg"
PROFILE_VARIANT="matched"

# --- programs and presets (selected when the profile is applied) -----------
BAR="waybar"
BAR_PRESET="st-nane"
LAUNCHER="rofi"
TERMINAL="foot"
NOTIFIER="mako"
WIDGET_ENGINE="eww"
WIDGET_SET=""
WIDGETS="sysinfo,clock"
WIDGET_ZONE_TR="sysinfo"
WIDGET_ZONE_BR="clock"
WIDGET_SCALE="1.0"
WIDGET_RADIUS="4"
WIDGET_OPACITY="0.75"
WIDGET_MARGIN="22"
WIDGET_GAP="10"
DOCK_ENABLE="false"
