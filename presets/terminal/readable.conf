# ---------------------------------------------------------------------------
#  preset: readable
#  title: Terminal — Easy Reading
#  desc: Large type and plenty of padding; for presentations, teaching and long
#        sessions. A blinking block cursor keeps you from losing your place.
#
#  Usage:  ./install.sh --term-preset readable
#
#  Terminal presets ONLY define size/behavior; color always comes from THEME.
#  Values are translated for the selected program — kitty, foot, Alacritty and Ghostty
#  are all generated from the same preset (see render.py:_terminal_vars).
# ---------------------------------------------------------------------------

TERM_OPACITY="0.98"
TERM_PADDING="20"
TERM_FONT_SIZE="14"
TERM_CURSOR_STYLE="block"
TERM_CURSOR_BLINK="true"
TERM_SCROLLBACK="10000"
