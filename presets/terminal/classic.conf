# ---------------------------------------------------------------------------
#  preset: classic
#  title: Terminal — Classic
#  desc: Opaque background, block cursor, long scrollback. For those who see the
#        terminal as "the window where work gets done": legibility before transparency.
#
#  Usage:  ./install.sh --term-preset classic
#
#  Terminal presets ONLY define size/behavior; color always comes from THEME.
#  Values are translated for the selected program — kitty, foot, Alacritty and Ghostty
#  are all generated from the same preset (see render.py:_terminal_vars).
# ---------------------------------------------------------------------------

TERM_OPACITY="1.0"
TERM_PADDING="8"
TERM_FONT_SIZE=""
TERM_CURSOR_STYLE="block"
TERM_CURSOR_BLINK="false"
TERM_SCROLLBACK="20000"
