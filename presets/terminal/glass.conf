# ---------------------------------------------------------------------------
#  preset: glass
#  title: Terminal — Frosted Glass
#  desc: High transparency and generous padding — the wallpaper shows through
#        behind the terminal. Makes most sense together with Hyprland's blur.
#
#  Usage:  ./install.sh --term-preset glass
#
#  Terminal presets ONLY define size/behavior; color always comes from THEME.
#  Values are translated for the selected program — kitty, foot, Alacritty and Ghostty
#  are all generated from the same preset (see render.py:_terminal_vars).
# ---------------------------------------------------------------------------

TERM_OPACITY="0.75"
TERM_PADDING="18"
TERM_FONT_SIZE=""
TERM_CURSOR_STYLE="beam"
TERM_CURSOR_BLINK="true"
TERM_SCROLLBACK="10000"
