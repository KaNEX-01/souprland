# ---------------------------------------------------------------------------
#  preset: soft
#  title: Terminal — Soft
#  desc: Slightly transparent, generous padding, thin cursor. The terminal for
#        rounded-capsule bar presets: more legible than glass, lighter than classic.
#
#  Usage:  ./install.sh --term-preset soft
#
#  Terminal presets ONLY define size/behavior; color always comes from THEME.
#  Values are translated for the selected program — kitty, foot, Alacritty and Ghostty
#  are all generated from the same preset (see render.py:_terminal_vars).
# ---------------------------------------------------------------------------
TERM_OPACITY="0.92"
TERM_PADDING="16"
TERM_FONT_SIZE=""
TERM_CURSOR_STYLE="beam"
TERM_CURSOR_BLINK="false"
TERM_SCROLLBACK="10000"
