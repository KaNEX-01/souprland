# ---------------------------------------------------------------------------
#  preset: compact
#  title: Terminal — Compact
#  desc: Small type, tight padding, thin cursor. For people who want the most
#        lines on screen and work in tmux/many splits.
#
#  Usage:  ./install.sh --term-preset compact
#
#  Terminal presets ONLY define size/behavior; color always comes from THEME.
#  Values are translated for the selected program — kitty, foot, Alacritty and Ghostty
#  are all generated from the same preset (see render.py:_terminal_vars).
# ---------------------------------------------------------------------------

TERM_OPACITY="0.95"
TERM_PADDING="2"
TERM_FONT_SIZE="9"
TERM_CURSOR_STYLE="underline"
TERM_CURSOR_BLINK="false"
TERM_SCROLLBACK="50000"
