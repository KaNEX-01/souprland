# ---------------------------------------------------------------------------
#  preset: minimal
#  title: Terminal — Minimal
#  desc: Short scrollback, medium transparency, a steady bar cursor — the leanest,
#        distraction-free setting for "run one command and close" use.
#
#  Usage:  ./install.sh --term-preset minimal
#
#  Terminal presets ONLY define size/behavior; color always comes from THEME.
#  Values are translated for the selected program — kitty, foot, Alacritty and Ghostty
#  are all generated from the same preset (see render.py:_terminal_vars).
# ---------------------------------------------------------------------------

TERM_OPACITY="0.9"
TERM_PADDING="10"
TERM_FONT_SIZE=""
TERM_CURSOR_STYLE="beam"
TERM_CURSOR_BLINK="false"
TERM_SCROLLBACK="2000"
