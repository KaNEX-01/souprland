"LoginScreen.LoginArea.LoginButton/content-color" = "FG"
"LoginScreen.LoginArea.LoginButton/active-content-color" = "BG"
"LoginScreen.LoginArea.LoginButton/border-color" = "ACCENT"
"LoginScreen.LoginArea.Spinner/color" = "ACCENT"
"LoginScreen.LoginArea.WarningMessage/normal-color" = "FG"
