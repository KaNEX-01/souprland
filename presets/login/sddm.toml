# SDDM login screen themes — the community's most-used ones.
#
# The settings app's "Login Screen" page shows this list: themes that are not
# installed are installed from the AUR (in a terminal, paru/yay); installed ones can be
# selected and edited. Any theme installed under /usr/share/sddm/themes that is not
# listed here also shows up on the page and is tuned with the same generic editor; this
# file only adds the description, package name, the folder of preset looks, the
# wallpaper key and the "paint with my palette" mapping.
#
# Edits are NOT written to the theme's own file: SDDM reads <ConfigFile>.user
# on top of the theme's settings (sddm ThemeConfig::setTo).
# The preset look + the user's changes are written to that file; package
# updates don't overwrite it.
#
# Fields:
#   dirs        folder name(s) under /usr/share/sddm/themes; may be a glob
#   presets     folder of preset-look .conf files inside the theme folder
#   background  wallpaper key(s) ("Section/key")
#   background_dir     folder inside the theme where the wallpaper is copied
#   background_prefix  prefix for the value written to the key (e.g. "Backgrounds/")
#   palette     "Section/key" = palette role (BG, BG_DARK, SURFACE, FG,
#               SUBTEXT, ACCENT, ACCENT2, RED, GREEN, YELLOW, CYAN)
#   set_with_palette  fixed values also written when painting with the palette

[[theme]]
id = "astronaut"
title = "Astronaut"
desc = "The most popular SDDM theme: 10 preset looks (astronaut, black hole, cyberpunk, Japanese aesthetic, pixel sakura…), blurred form, virtual keyboard."
repo = "https://github.com/Keyitdev/sddm-astronaut-theme"
stars = 3282
license = "GPL-3.0"
aur = ["sddm-astronaut-theme"]
dirs = ["sddm-astronaut-theme"]
presets = "Themes"
background = ["General/Background"]
background_dir = "Backgrounds"
background_prefix = "Backgrounds/"
[theme.palette]
"General/HeaderTextColor" = "FG"
"General/DateTextColor" = "FG"
"General/TimeTextColor" = "FG"
"General/FormBackgroundColor" = "BG"
"General/BackgroundColor" = "BG"
"General/DimBackgroundColor" = "BG"
"General/LoginFieldBackgroundColor" = "SURFACE"
"General/PasswordFieldBackgroundColor" = "SURFACE"
"General/LoginFieldTextColor" = "FG"
"General/PasswordFieldTextColor" = "FG"
"General/UserIconColor" = "FG"
"General/PasswordIconColor" = "FG"
"General/PlaceholderTextColor" = "SUBTEXT"
"General/WarningColor" = "RED"
"General/LoginButtonTextColor" = "BG"
"General/LoginButtonBackgroundColor" = "ACCENT"
"General/SystemButtonsIconsColor" = "FG"
"General/SessionButtonTextColor" = "FG"
"General/VirtualKeyboardButtonTextColor" = "FG"
"General/DropdownTextColor" = "FG"
"General/DropdownSelectedBackgroundColor" = "ACCENT"
"General/DropdownBackgroundColor" = "BG"
"General/HighlightTextColor" = "BG"
"General/HighlightBackgroundColor" = "ACCENT"
"General/HighlightBorderColor" = "ACCENT"
"General/HoverUserIconColor" = "ACCENT"
"General/HoverPasswordIconColor" = "ACCENT"
"General/HoverSystemButtonsIconsColor" = "ACCENT"
"General/HoverSessionButtonTextColor" = "ACCENT"
"General/HoverVirtualKeyboardButtonTextColor" = "ACCENT"

[[theme]]
id = "silent"
title = "SilentSDDM"
desc = "Modern and highly configurable: separate lock screen + login screen, animated background support, 16 preset looks (Catppuccin, Nord, Gruvbox, Everforest, Rei, Ken…)."
repo = "https://github.com/uiriansan/SilentSDDM"
stars = 1667
license = "GPL-3.0"
aur = ["sddm-silent-theme"]
dirs = ["silent"]
presets = "configs"
background = ["LockScreen/background", "LoginScreen/background"]
background_dir = "backgrounds"
background_prefix = ""
[theme.set_with_palette]
