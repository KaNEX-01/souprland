# ---------------------------------------------------------------------------
#  preset: rounded
#  title: Launcher — Rounded
#  desc: Borderless, centered box with large icons. The match for the
#        capsule and island-style bar presets (islands, pill, Catppuccin…).
#
#  Usage:  ./install.sh --launcher-preset rounded
#
#  Launcher presets ONLY define size/behavior; color always comes from THEME.
#  Values are translated for the selected program — wofi, rofi, fuzzel and
#  walker are all generated from the same preset (see render.py:_launcher_vars).
# ---------------------------------------------------------------------------
LAUNCHER_WIDTH="36"
LAUNCHER_LINES="8"
LAUNCHER_POSITION="center"
LAUNCHER_OPACITY="0.92"
LAUNCHER_ICONS="true"
LAUNCHER_ICON_SIZE="36"
LAUNCHER_PROMPT="Search…"
LAUNCHER_RADIUS=""
LAUNCHER_BORDER="0"
