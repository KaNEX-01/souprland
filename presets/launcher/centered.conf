# ---------------------------------------------------------------------------
#  preset: centered
#  title: Launcher — Centered Box
#  desc: A classic, medium-width launcher box in the center of the screen.
#        Same layout as the repo's old hard-coded values.
#
#  Usage:  ./install.sh --launcher-preset centered
#
#  Launcher presets ONLY define size/behavior; color always comes from THEME.
#  Values are translated for the selected program — wofi, rofi, fuzzel and
#  walker are all generated from the same preset (see render.py:_launcher_vars).
# ---------------------------------------------------------------------------

LAUNCHER_WIDTH="45"
LAUNCHER_LINES="10"
LAUNCHER_POSITION="center"
LAUNCHER_OPACITY="0.93"
LAUNCHER_ICONS="true"
LAUNCHER_ICON_SIZE="32"
LAUNCHER_PROMPT="Search…"
LAUNCHER_RADIUS=""
LAUNCHER_BORDER=""
