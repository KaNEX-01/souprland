# ---------------------------------------------------------------------------
#  preset: glass
#  title: Launcher — Frosted Glass
#  desc: A wide, highly transparent window in the center — the same visual
#        family as the glass-look bar presets (glass, islands).
#
#  Usage:  ./install.sh --launcher-preset glass
#
#  Launcher presets ONLY define size/behavior; color always comes from THEME.
#  Values are translated for the selected program — wofi, rofi, fuzzel and
#  walker are all generated from the same preset (see render.py:_launcher_vars).
# ---------------------------------------------------------------------------

LAUNCHER_WIDTH="50"
LAUNCHER_LINES="12"
LAUNCHER_POSITION="center"
LAUNCHER_OPACITY="0.7"
LAUNCHER_ICONS="true"
LAUNCHER_ICON_SIZE="32"
LAUNCHER_PROMPT="Search…"
LAUNCHER_RADIUS=""
LAUNCHER_BORDER="1"
