# ---------------------------------------------------------------------------
#  preset: sharp
#  title: Launcher — Sharp
#  desc: An opaque, narrow list dropping from the top, with a plain prompt. The
#        match for square, solid bar presets (sharp, slim, outline, NERV, Sentinel…).
#
#  Usage:  ./install.sh --launcher-preset sharp
#
#  Launcher presets ONLY define size/behavior; color always comes from THEME.
#  Values are translated for the selected program — wofi, rofi, fuzzel and
#  walker are all generated from the same preset (see render.py:_launcher_vars).
# ---------------------------------------------------------------------------
LAUNCHER_WIDTH="40"
LAUNCHER_LINES="8"
LAUNCHER_POSITION="top"
LAUNCHER_OPACITY="0.97"
LAUNCHER_ICONS="true"
LAUNCHER_ICON_SIZE="24"
LAUNCHER_PROMPT="›"
LAUNCHER_RADIUS=""
LAUNCHER_BORDER=""
