# ---------------------------------------------------------------------------
#  preset: spotlight
#  title: Launcher — Spotlight
#  desc: Wide and short, near the top of the screen — the macOS
#        Spotlight layout. For quickly opening a single app.
#
#  Usage:  ./install.sh --launcher-preset spotlight
#
#  Launcher presets ONLY define size/behavior; color always comes from THEME.
#  Values are translated for the selected program — wofi, rofi, fuzzel and
#  walker are all generated from the same preset (see render.py:_launcher_vars).
# ---------------------------------------------------------------------------

LAUNCHER_WIDTH="55"
LAUNCHER_LINES="6"
LAUNCHER_POSITION="top"
LAUNCHER_OPACITY="0.9"
LAUNCHER_ICONS="true"
LAUNCHER_ICON_SIZE="28"
LAUNCHER_PROMPT="Search…"
LAUNCHER_RADIUS=""
LAUNCHER_BORDER=""
