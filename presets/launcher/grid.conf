# ---------------------------------------------------------------------------
#  preset: grid
#  title: Launcher — Wide List
#  desc: Nearly full width with many rows: for scanning the app list in one
#        go. Large icons give it a grid feel.
#
#  Usage:  ./install.sh --launcher-preset grid
#
#  Launcher presets ONLY define size/behavior; color always comes from THEME.
#  Values are translated for the selected program — wofi, rofi, fuzzel and
#  walker are all generated from the same preset (see render.py:_launcher_vars).
# ---------------------------------------------------------------------------

LAUNCHER_WIDTH="80"
LAUNCHER_LINES="18"
LAUNCHER_POSITION="center"
LAUNCHER_OPACITY="0.95"
LAUNCHER_ICONS="true"
LAUNCHER_ICON_SIZE="48"
LAUNCHER_PROMPT="Apps"
LAUNCHER_RADIUS=""
LAUNCHER_BORDER=""
