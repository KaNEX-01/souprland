# ---------------------------------------------------------------------------
#  preset: minimal
#  title: Launcher — Plain Text
#  desc: No icons, narrow, few rows; app names only. The look closest to
#        the dmenu tradition, with the lowest visual load.
#
#  Usage:  ./install.sh --launcher-preset minimal
#
#  Launcher presets ONLY define size/behavior; color always comes from THEME.
#  Values are translated for the selected program — wofi, rofi, fuzzel and
#  walker are all generated from the same preset (see render.py:_launcher_vars).
# ---------------------------------------------------------------------------

LAUNCHER_WIDTH="30"
LAUNCHER_LINES="6"
LAUNCHER_POSITION="center"
LAUNCHER_OPACITY="0.85"
LAUNCHER_ICONS="false"
LAUNCHER_ICON_SIZE="16"
LAUNCHER_PROMPT=">"
LAUNCHER_RADIUS=""
LAUNCHER_BORDER="0"
