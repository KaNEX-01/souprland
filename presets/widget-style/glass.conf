# ---------------------------------------------------------------------------
#  preset: glass
#  title: Glass — frosted cards
#  desc: Translucent cards with Hyprland blur behind them, a thin light edge
#        and a drop shadow; ring gauges and a music card with cover art and
#        buttons.
#
#  Usage:  in the settings app, Widgets → Widget style → Apply
#             or in settings.conf: WIDGET_STYLE="glass"
#  Every value below can be changed afterwards on the Widgets page.
# ---------------------------------------------------------------------------

WIDGET_RADIUS="18"
WIDGET_OPACITY="0.35"
WIDGET_BOX="true"
WIDGET_SURFACE="bg"
WIDGET_BORDER="1"
WIDGET_BORDER_TONE="light"
WIDGET_SHADOW="true"
WIDGET_BLUR="true"
WIDGET_METER="ring"
WIDGET_MUSIC="card"
WIDGET_CLOCK="large"
