# ---------------------------------------------------------------------------
#  preset: material
#  title: Material — tonal cards
#  desc: Large rounded cards on the theme's surface tone with a shadow,
#        stacked hour/minute clock, ring gauges and a music card. Material You
#        inspired.
#
#  Usage:  in the settings app, Widgets → Widget style → Apply
#             or in settings.conf: WIDGET_STYLE="material"
#  Every value below can be changed afterwards on the Widgets page.
# ---------------------------------------------------------------------------

WIDGET_RADIUS="26"
WIDGET_OPACITY="0.94"
WIDGET_BOX="true"
WIDGET_SURFACE="surface"
WIDGET_BORDER="0"
WIDGET_BORDER_TONE="soft"
WIDGET_SHADOW="true"
WIDGET_BLUR="false"
WIDGET_METER="ring"
WIDGET_MUSIC="card"
WIDGET_CLOCK="stacked"
