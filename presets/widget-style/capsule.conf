# ---------------------------------------------------------------------------
#  preset: capsule
#  title: Capsule — matches pill bars
#  desc: Borderless pills on a soft surface tone with thin progress bars: the
#        same language as capsule bars like st-gozcu and st-kule.
#
#  Usage:  in the settings app, Widgets → Widget style → Apply
#             or in settings.conf: WIDGET_STYLE="capsule"
#  Every value below can be changed afterwards on the Widgets page.
# ---------------------------------------------------------------------------

WIDGET_RADIUS="999"
WIDGET_OPACITY="0.60"
WIDGET_BOX="true"
WIDGET_SURFACE="surface"
WIDGET_BORDER="0"
WIDGET_BORDER_TONE="soft"
WIDGET_SHADOW="false"
WIDGET_BLUR="true"
WIDGET_METER="bar"
WIDGET_MUSIC="line"
WIDGET_CLOCK="compact"
