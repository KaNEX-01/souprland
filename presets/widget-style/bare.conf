# ---------------------------------------------------------------------------
#  preset: bare
#  title: Bare — text on the wallpaper
#  desc: No boxes at all: a big thin clock and bars drawn straight on the
#        wallpaper with a soft text shadow. The most common clock style in
#        unixporn setups.
#
#  Usage:  in the settings app, Widgets → Widget style → Apply
#             or in settings.conf: WIDGET_STYLE="bare"
#  Every value below can be changed afterwards on the Widgets page.
# ---------------------------------------------------------------------------

WIDGET_RADIUS="0"
WIDGET_OPACITY="0"
WIDGET_BOX="false"
WIDGET_SURFACE="bg"
WIDGET_BORDER="0"
WIDGET_BORDER_TONE="soft"
WIDGET_SHADOW="false"
WIDGET_BLUR="false"
WIDGET_METER="bar"
WIDGET_MUSIC="line"
WIDGET_CLOCK="large"
