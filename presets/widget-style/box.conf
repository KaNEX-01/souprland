# ---------------------------------------------------------------------------
#  preset: box
#  title: Box — the classic look
#  desc: Dark boxes with an accent-coloured border; counters as text, a
#        compact clock. The original hyprsetup widget look.
#
#  Usage:  in the settings app, Widgets → Widget style → Apply
#             or in settings.conf: WIDGET_STYLE="box"
#  Every value below can be changed afterwards on the Widgets page.
# ---------------------------------------------------------------------------

WIDGET_RADIUS="12"
WIDGET_OPACITY="0.85"
WIDGET_BOX="true"
WIDGET_SURFACE="bg"
WIDGET_BORDER="2"
WIDGET_BORDER_TONE="accent"
WIDGET_SHADOW="false"
WIDGET_BLUR="false"
WIDGET_METER="text"
WIDGET_MUSIC="line"
WIDGET_CLOCK="compact"
