# ---------------------------------------------------------------------------
#  preset: dashboard
#  title: Dashboard — all four corners
#  desc: Turns the desktop into a dashboard: a system card on the left, clock and
#        calendar top right, now playing bottom left, counters bottom right. The
#        layout of the widget-desk profile and NERV/DOOM-style dashboard rices.
#        Source: widget-desk profile · videoframe_1997 (NERV) · videoframe_2322 (DOOM)
#
#  Usage:  in the settings app, Widgets → Preset layouts → Apply
#             or in settings.conf: WIDGET_SET="dashboard"
# ---------------------------------------------------------------------------

WIDGETS="fetch-mini,clock,calendar,music,sysinfo,disk,temperature"
WIDGET_ZONE_TL="fetch-mini"
WIDGET_ZONE_TR="clock,calendar"
WIDGET_ZONE_BL="music"
WIDGET_ZONE_BR="sysinfo,disk,temperature"
WIDGET_SCALE="0.95"
WIDGET_MARGIN="14"
WIDGET_GAP="8"
