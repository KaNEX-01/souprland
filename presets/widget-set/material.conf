# ---------------------------------------------------------------------------
#  preset: material
#  title: Material 3
#  desc: Wide rounding, high opacity, a few large boxes: clock top left,
#        music and volume bottom right. Brings end-4/dots-hyprland's Material Design 3
#        language to desktop widgets (goes well with THEME="auto").
#        Source: end-4/dots-hyprland (illogical-impulse) · pphan-sil's eww MD3 panel
#
#  Usage:  in the settings app, Widgets → Preset layouts → Apply
#             or in settings.conf: WIDGET_SET="material"
# ---------------------------------------------------------------------------

WIDGETS="clock,music,volume"
WIDGET_ZONE_TL="clock"
WIDGET_ZONE_BR="music,volume"
WIDGET_SCALE="1.05"
WIDGET_RADIUS="24"
WIDGET_OPACITY="0.92"
WIDGET_MARGIN="18"
WIDGET_GAP="12"
