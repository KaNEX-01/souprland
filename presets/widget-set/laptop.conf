# ---------------------------------------------------------------------------
#  preset: laptop
#  title: Laptop
#  desc: Battery and clock top right; brightness, volume, network and keyboard layout bottom right.
#        Gathers the four things you actually check on a laptop in one corner.
#        Source: the indicator cluster of ML4W · JaKooLit laptop setups
#
#  Usage:  in the settings app, Widgets → Preset layouts → Apply
#             or in settings.conf: WIDGET_SET="laptop"
# ---------------------------------------------------------------------------

WIDGETS="clock,battery,brightness,volume,network,kblayout"
WIDGET_ZONE_TR="clock,battery"
WIDGET_ZONE_BR="brightness,volume,network,kblayout"
WIDGET_SCALE="0.9"
WIDGET_MARGIN="14"
WIDGET_GAP="8"
