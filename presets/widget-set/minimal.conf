# ---------------------------------------------------------------------------
#  preset: minimal
#  title: Minimal — clock only
#  desc: A single big clock top right; no other boxes. The desktop philosophy of
#        plain Nord/Alpine-style setups: keep the wallpaper visible and the
#        information on the bar.
#        Source: the nord-frost · alpine-paper line (gallery-catalog.md)
#
#  Usage:  in the settings app, Widgets → Preset layouts → Apply
#             or in settings.conf: WIDGET_SET="minimal"
# ---------------------------------------------------------------------------

WIDGETS="clock"
WIDGET_ZONE_TR="clock"
WIDGET_SCALE="1.1"
WIDGET_RADIUS="14"
WIDGET_OPACITY="0.7"
WIDGET_MARGIN="20"
WIDGET_GAP="10"
