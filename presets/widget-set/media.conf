# ---------------------------------------------------------------------------
#  preset: media
#  title: Media corner
#  desc: Now playing bottom left, volume bottom right. The desktop layout of
#        music-centric setups (caelestia and its derivatives): the top half of
#        the screen stays completely empty.
#        Source: caelestia-dots/shell · uryastra-beep/hyper-caelestia-rice
#
#  Usage:  in the settings app, Widgets → Preset layouts → Apply
#             or in settings.conf: WIDGET_SET="media"
# ---------------------------------------------------------------------------

WIDGETS="music,volume"
WIDGET_ZONE_BL="music"
WIDGET_ZONE_BR="volume"
WIDGET_SCALE="1.05"
WIDGET_RADIUS="18"
WIDGET_OPACITY="0.9"
WIDGET_MARGIN="16"
WIDGET_GAP="10"
