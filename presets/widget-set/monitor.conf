# ---------------------------------------------------------------------------
#  preset: monitor
#  title: System monitoring
#  desc: An information-dense setup: CPU/memory and temperature top right, disk,
#        uptime and network bottom right. The desktop counterpart of CyberArch HUD
#        and rices observed with sys-gauges.
#        Source: ARCANGEL0/CyberArch-Shell · kde-sunday · cosmic (sys-gauges observation)
#
#  Usage:  in the settings app, Widgets → Preset layouts → Apply
#             or in settings.conf: WIDGET_SET="monitor"
# ---------------------------------------------------------------------------

WIDGETS="sysinfo,temperature,disk,uptime,network"
WIDGET_ZONE_TR="sysinfo,temperature"
WIDGET_ZONE_BR="disk,uptime,network"
WIDGET_SCALE="0.85"
WIDGET_RADIUS="8"
WIDGET_OPACITY="0.92"
WIDGET_MARGIN="12"
WIDGET_GAP="6"
