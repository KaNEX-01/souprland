name: Feature request
description: Suggest a new feature, profile, preset, or improvement
title: "[Feature]: "
labels: ["enhancement"]
body:
  - type: textarea
    id: idea
    attributes:
      label: What would you like to see?
      description: Describe the feature, component, or improvement you have in mind.
    validations:
      required: true
  - type: textarea
    id: context
    attributes:
      label: Additional context (optional)
      description: Links to upstream tools, dotfiles, screenshots, or design ideas.
