<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
  <title>Souprland</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#24273a"/>
      <stop offset="1" stop-color="#181926"/>
    </linearGradient>
    <linearGradient id="bowl" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f5a97f"/>
      <stop offset="1" stop-color="#ed8796"/>
    </linearGradient>
    <linearGradient id="soup" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#8bd5ca"/>
      <stop offset="1" stop-color="#7dc4e4"/>
    </linearGradient>
    <linearGradient id="steam" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0" stop-color="#c6a0f6"/>
      <stop offset="1" stop-color="#8aadf4"/>
    </linearGradient>
  </defs>
  <rect x="8" y="8" width="240" height="240" rx="56" fill="url(#bg)"/>
  <!-- steam: two curls on the sides, a drop in the middle saluting Hyprland -->
  <g fill="none" stroke="url(#steam)" stroke-width="9" stroke-linecap="round">
    <path d="M86 118 C 70 102, 102 88, 86 68"/>
    <path d="M170 118 C 154 102, 186 88, 170 68"/>
  </g>
  <path d="M128 36 C 112 60, 102 76, 102 92 A 26 26 0 0 0 154 92 C 154 76, 144 60, 128 36 Z"
        fill="url(#steam)"/>
  <ellipse cx="118" cy="86" rx="5" ry="9" fill="#ffffff" opacity=".35"/>
  <!-- bowl -->
  <path d="M40 136 H216 C 216 184, 178 212, 128 212 C 78 212, 40 184, 40 136 Z"
        fill="url(#bowl)"/>
  <ellipse cx="128" cy="136" rx="88" ry="16" fill="url(#soup)"/>
  <ellipse cx="128" cy="136" rx="88" ry="16" fill="none" stroke="#f5a97f" stroke-width="5"/>
  <!-- window tiling in the soup: three "tiles" -->
  <g fill="#24273a" opacity=".55">
    <rect x="92" y="130" width="20" height="10" rx="3"/>
    <rect x="118" y="130" width="20" height="10" rx="3"/>
    <rect x="144" y="130" width="20" height="10" rx="3"/>
  </g>
  <!-- ayak -->
  <rect x="100" y="210" width="56" height="10" rx="5" fill="#ed8796"/>
</svg>
