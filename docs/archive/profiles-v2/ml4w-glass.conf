# ---------------------------------------------------------------------------
#  preset: ml4w-glass
#  title: ML4W — Glass
#  desc: The mylinuxforwork/dotfiles (ML4W) style: a semi-transparent glass
#        bar with workspaces in the center, wide margins and strong blur. A
#        neat, corporate-grade, dark blue desktop.
#
#  Usage:  ./install.sh --preset ml4w-glass
#
#  This file only sets the LOOK. Which packages get installed is decided
#  by the component selection. Every setting not given here takes its
#  default from lib/config.sh; values in your own settings.conf override
#  this file.
# ---------------------------------------------------------------------------

THEME="bluefin-moss"
FONT_FAMILY="Noto Sans"
FONT_SIZE=10

# --- layout --------------------------------------------------------------
LAYOUT="dwindle"
GAPS_IN=6
GAPS_OUT=16
BORDER_SIZE=2
BORDER_ANGLE=45
ROUNDING=14
ROUNDING_POWER=2

# --- decoration ----------------------------------------------------------
BLUR="true"
BLUR_SIZE=10
BLUR_PASSES=4
BLUR_XRAY="false"
BLUR_NOISE=0.0117
BLUR_CONTRAST=0.9
BLUR_BRIGHTNESS=1.05
BLUR_VIBRANCY=0.2
BLUR_POPUPS="true"
SHADOW="true"
SHADOW_RANGE=26
SHADOW_RENDER_POWER=3
SHADOW_OFFSET="0 4"
ACTIVE_OPACITY=1.0
INACTIVE_OPACITY=0.9
DIM_INACTIVE="false"
DIM_STRENGTH=0.05

# --- animation -----------------------------------------------------------
ANIMATIONS="true"
ANIMATION_PRESET="fluid"
ANIMATION_SPEED=1.0

# --- wallpaper -----------------------------------------------------------
WALLPAPER_IMAGE="wallpapers/bluefin-moss.png"

# --- presets -------------------------------------------------------------
BAR="waybar"
BAR_PRESET="ml4w-glass"
TERM_PRESET="glass"
LAUNCHER_PRESET="glass"
