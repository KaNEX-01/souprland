# ---------------------------------------------------------------------------
#  preset: illogical-impulse
#  title: Illogical Impulse — Material 3
#  desc: The Material Design 3 style of end-4/dots-hyprland: large corner
#        rounding, soft and fast animation, a palette generated from the
#        wallpaper (THEME="auto"). The bar is Quickshell, not Waybar. One of
#        the most copied setups, with a mobile-UI feel.
#
#  Usage:  ./install.sh --preset illogical-impulse
#
#  This file only sets the LOOK. Which packages get installed is decided
#  by the component selection. Every setting not given here takes its
#  default from lib/config.sh; values in your own settings.conf override
#  this file.
# ---------------------------------------------------------------------------

THEME="auto"
FONT_FAMILY="Noto Sans"
FONT_SIZE=10

# --- layout --------------------------------------------------------------
LAYOUT="dwindle"
GAPS_IN=6
GAPS_OUT=14
BORDER_SIZE=2
BORDER_ANGLE=45
ROUNDING=16
ROUNDING_POWER=3

# --- decoration ----------------------------------------------------------
BLUR="true"
BLUR_SIZE=8
BLUR_PASSES=3
BLUR_XRAY="false"
BLUR_NOISE=0.0117
BLUR_CONTRAST=0.9
BLUR_BRIGHTNESS=1.0
BLUR_VIBRANCY=0.22
BLUR_POPUPS="true"
SHADOW="true"
SHADOW_RANGE=28
SHADOW_RENDER_POWER=3
SHADOW_OFFSET="0 4"
ACTIVE_OPACITY=1.0
INACTIVE_OPACITY=0.96
DIM_INACTIVE="false"
DIM_STRENGTH=0.05

# --- animation -----------------------------------------------------------
ANIMATIONS="true"
ANIMATION_PRESET="fluid"
ANIMATION_SPEED=1.2

# --- wallpaper -----------------------------------------------------------
WALLPAPER_IMAGE="wallpapers/cosmos-violet.png"

# --- presets -------------------------------------------------------------
BAR="quickshell-bar"
BAR_PRESET="illogical-impulse"
TERM_PRESET="glass"
LAUNCHER_PRESET="spotlight"
