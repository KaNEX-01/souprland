# ---------------------------------------------------------------------------
#  preset: gdots-pywal
#  title: Gdots — Pywal Rail
#  desc: Gdots' vertical icon rail and its approach of generating colors from
#        the wallpaper with pywal16. Here the palette is extracted with
#        THEME="auto"; when you change the wallpaper, the whole desktop
#        changes with it.
#
#  Usage:  ./install.sh --preset gdots-pywal
#
#  This file only sets the LOOK. Which packages get installed is decided
#  by the component selection. Every setting not given here takes its
#  default from lib/config.sh; values in your own settings.conf override
#  this file.
# ---------------------------------------------------------------------------

THEME="auto"
FONT_FAMILY="Noto Sans"
FONT_SIZE=10

# --- layout --------------------------------------------------------------
LAYOUT="dwindle"
GAPS_IN=4
GAPS_OUT=10
BORDER_SIZE=2
BORDER_ANGLE=45
ROUNDING=6
ROUNDING_POWER=2

# --- decoration ----------------------------------------------------------
BLUR="true"
BLUR_SIZE=5
BLUR_PASSES=2
BLUR_XRAY="false"
BLUR_NOISE=0.0117
BLUR_CONTRAST=0.9
BLUR_BRIGHTNESS=1.0
BLUR_VIBRANCY=0.17
BLUR_POPUPS="true"
SHADOW="true"
SHADOW_RANGE=14
SHADOW_RENDER_POWER=3
SHADOW_OFFSET="0 4"
ACTIVE_OPACITY=1.0
INACTIVE_OPACITY=0.94
DIM_INACTIVE="false"
DIM_STRENGTH=0.05

# --- animation -----------------------------------------------------------
ANIMATIONS="true"
ANIMATION_PRESET="snappy"
ANIMATION_SPEED=1.0

# --- wallpaper -----------------------------------------------------------
WALLPAPER_IMAGE="wallpapers/void-lilac.png"

# --- presets -------------------------------------------------------------
BAR="waybar"
BAR_PRESET="gdots-rail"
TERM_PRESET="compact"
LAUNCHER_PRESET="minimal"
