# ---------------------------------------------------------------------------
#  preset: kanagawa-ukiyo
#  title: Kanagawa — Ukiyo
#  desc: The tone of wave-themed rices inspired by Japanese ukiyo-e prints
#        (the Kanagawa family): ink-dark background, sand and wave colors,
#        thin top bar.
#
#  Usage:  ./install.sh --preset kanagawa-ukiyo
#
#  This file only sets the LOOK. Which packages get installed is decided
#  by the component selection. Every setting not given here takes its
#  default from lib/config.sh; values in your own settings.conf override
#  this file.
# ---------------------------------------------------------------------------

THEME="sophos-ukiyo"
FONT_FAMILY="Noto Sans"
FONT_SIZE=10

# --- layout --------------------------------------------------------------
LAYOUT="dwindle"
GAPS_IN=5
GAPS_OUT=12
BORDER_SIZE=2
BORDER_ANGLE=45
ROUNDING=8
ROUNDING_POWER=2

# --- decoration ----------------------------------------------------------
BLUR="true"
BLUR_SIZE=6
BLUR_PASSES=2
BLUR_XRAY="false"
BLUR_NOISE=0.0117
BLUR_CONTRAST=0.9
BLUR_BRIGHTNESS=1.0
BLUR_VIBRANCY=0.17
BLUR_POPUPS="true"
SHADOW="true"
SHADOW_RANGE=18
SHADOW_RENDER_POWER=3
SHADOW_OFFSET="0 4"
ACTIVE_OPACITY=1.0
INACTIVE_OPACITY=0.94
DIM_INACTIVE="false"
DIM_STRENGTH=0.05

# --- animation -----------------------------------------------------------
ANIMATIONS="true"
ANIMATION_PRESET="default"
ANIMATION_SPEED=0.9

# --- wallpaper -----------------------------------------------------------
WALLPAPER_IMAGE="wallpapers/sophos-ukiyo.png"

# --- presets -------------------------------------------------------------
BAR="waybar"
BAR_PRESET="dock"
TERM_PRESET="readable"
LAUNCHER_PRESET="centered"
