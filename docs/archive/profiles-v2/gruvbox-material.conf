# ---------------------------------------------------------------------------
#  preset: gruvbox-material
#  title: Gruvbox — Material
#  desc: The classic gruvbox rice: warm earth tones, no transparency or blur,
#        a fully opaque flat bar, nearly sharp corners. Source:
#        Pipshag/dotfiles_gruvbox and gruvbox-material derivatives.
#
#  Usage:  ./install.sh --preset gruvbox-material
#
#  This file only sets the LOOK. Which packages get installed is decided
#  by the component selection. Every setting not given here takes its
#  default from lib/config.sh; values in your own settings.conf override
#  this file.
# ---------------------------------------------------------------------------

THEME="gruvbox-dark"
FONT_FAMILY="JetBrainsMono Nerd Font"
FONT_SIZE=10

# --- layout --------------------------------------------------------------
LAYOUT="dwindle"
GAPS_IN=4
GAPS_OUT=10
BORDER_SIZE=2
BORDER_ANGLE=45
ROUNDING=4
ROUNDING_POWER=2

# --- decoration ----------------------------------------------------------
BLUR="false"
BLUR_SIZE=1
BLUR_PASSES=3
BLUR_XRAY="false"
BLUR_NOISE=0.0117
BLUR_CONTRAST=0.9
BLUR_BRIGHTNESS=1.0
BLUR_VIBRANCY=0.17
BLUR_POPUPS="true"
SHADOW="false"
SHADOW_RANGE=0
SHADOW_RENDER_POWER=3
SHADOW_OFFSET="0 4"
ACTIVE_OPACITY=1.0
INACTIVE_OPACITY=1.0
DIM_INACTIVE="false"
DIM_STRENGTH=0.05

# --- animation -----------------------------------------------------------
ANIMATIONS="true"
ANIMATION_PRESET="default"
ANIMATION_SPEED=1.2

# --- wallpaper -----------------------------------------------------------
WALLPAPER_IMAGE="wallpapers/gruvbox-dark.png"

# --- presets -------------------------------------------------------------
BAR="waybar"
BAR_PRESET="gruvbox-solid"
TERM_PRESET="classic"
LAUNCHER_PRESET="centered"
