# ---------------------------------------------------------------------------
#  preset: everforest-soft
#  title: Everforest — Soft
#  desc: The restful green of Everforest rices: low contrast, soft shadow,
#        thin top bar and wide inner gaps. A palette designed for long
#        sessions.
#
#  Usage:  ./install.sh --preset everforest-soft
#
#  This file only sets the LOOK. Which packages get installed is decided
#  by the component selection. Every setting not given here takes its
#  default from lib/config.sh; values in your own settings.conf override
#  this file.
# ---------------------------------------------------------------------------

THEME="everforest-dark"
FONT_FAMILY="Noto Sans"
FONT_SIZE=10

# --- layout --------------------------------------------------------------
LAYOUT="dwindle"
GAPS_IN=6
GAPS_OUT=14
BORDER_SIZE=2
BORDER_ANGLE=45
ROUNDING=10
ROUNDING_POWER=2

# --- decoration ----------------------------------------------------------
BLUR="true"
BLUR_SIZE=5
BLUR_PASSES=2
BLUR_XRAY="false"
BLUR_NOISE=0.0117
BLUR_CONTRAST=0.85
BLUR_BRIGHTNESS=1.0
BLUR_VIBRANCY=0.17
BLUR_POPUPS="true"
SHADOW="true"
SHADOW_RANGE=18
SHADOW_RENDER_POWER=3
SHADOW_OFFSET="0 4"
ACTIVE_OPACITY=1.0
INACTIVE_OPACITY=0.95
DIM_INACTIVE="false"
DIM_STRENGTH=0.05

# --- animation -----------------------------------------------------------
ANIMATIONS="true"
ANIMATION_PRESET="fluid"
ANIMATION_SPEED=0.9

# --- wallpaper -----------------------------------------------------------
WALLPAPER_IMAGE="wallpapers/everforest-dark.png"

# --- presets -------------------------------------------------------------
BAR="waybar"
BAR_PRESET="slim"
TERM_PRESET="readable"
LAUNCHER_PRESET="centered"
