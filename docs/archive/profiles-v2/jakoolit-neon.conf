# ---------------------------------------------------------------------------
#  preset: jakoolit-neon
#  title: JaKooLit — Neon Circuit
#  desc: The cyberpunk tone of JaKooLit/Hyprland-Dots: bright gradient
#        border, fast and snappy animation, the Simple-L bar layout. Thanks
#        to its distro install scripts it is the most widespread Hyprland
#        set.
#
#  Usage:  ./install.sh --preset jakoolit-neon
#
#  This file only sets the LOOK. Which packages get installed is decided
#  by the component selection. Every setting not given here takes its
#  default from lib/config.sh; values in your own settings.conf override
#  this file.
# ---------------------------------------------------------------------------

THEME="cybr-neon"
FONT_FAMILY="Noto Sans"
FONT_SIZE=10

# --- layout --------------------------------------------------------------
LAYOUT="dwindle"
GAPS_IN=4
GAPS_OUT=10
BORDER_SIZE=3
BORDER_ANGLE=315
ROUNDING=8
ROUNDING_POWER=2

# --- decoration ----------------------------------------------------------
BLUR="true"
BLUR_SIZE=6
BLUR_PASSES=3
BLUR_XRAY="false"
BLUR_NOISE=0.0117
BLUR_CONTRAST=0.9
BLUR_BRIGHTNESS=1.0
BLUR_VIBRANCY=0.3
BLUR_POPUPS="true"
SHADOW="true"
SHADOW_RANGE=24
SHADOW_RENDER_POWER=3
SHADOW_OFFSET="0 4"
ACTIVE_OPACITY=1.0
INACTIVE_OPACITY=0.9
DIM_INACTIVE="false"
DIM_STRENGTH=0.05

# --- animation -----------------------------------------------------------
ANIMATIONS="true"
ANIMATION_PRESET="snappy"
ANIMATION_SPEED=1.4

# --- wallpaper -----------------------------------------------------------
WALLPAPER_IMAGE="wallpapers/cybr-neon.png"

# --- presets -------------------------------------------------------------
BAR="waybar"
BAR_PRESET="jakoolit-simple-l"
TERM_PRESET="compact"
LAUNCHER_PRESET="centered"
