# ---------------------------------------------------------------------------
#  preset: ashen-minimal
#  title: Ashen — Plain Ash
#  desc: An ash-grey, unadorned desktop in the vein of Spelljinxer/dotfiles:
#        thin border, shadow off, island-style bar.
#
#  Usage:  ./install.sh --preset ashen-minimal
#
#  This file only sets the LOOK. Which packages get installed is decided
#  by the component selection. Every setting not given here takes its
#  default from lib/config.sh; values in your own settings.conf override
#  this file.
# ---------------------------------------------------------------------------

THEME="ashen-rain"
FONT_FAMILY="Noto Sans"
FONT_SIZE=10

# --- layout --------------------------------------------------------------
LAYOUT="dwindle"
GAPS_IN=4
GAPS_OUT=10
BORDER_SIZE=1
BORDER_ANGLE=45
ROUNDING=6
ROUNDING_POWER=2

# --- decoration ----------------------------------------------------------
BLUR="true"
BLUR_SIZE=4
BLUR_PASSES=2
BLUR_XRAY="false"
BLUR_NOISE=0.0117
BLUR_CONTRAST=0.9
BLUR_BRIGHTNESS=1.0
BLUR_VIBRANCY=0.17
BLUR_POPUPS="true"
SHADOW="false"
SHADOW_RANGE=0
SHADOW_RENDER_POWER=3
SHADOW_OFFSET="0 4"
ACTIVE_OPACITY=1.0
INACTIVE_OPACITY=0.97
DIM_INACTIVE="false"
DIM_STRENGTH=0.05

# --- animation -----------------------------------------------------------
ANIMATIONS="true"
ANIMATION_PRESET="minimal"
ANIMATION_SPEED=1.4

# --- wallpaper -----------------------------------------------------------
WALLPAPER_IMAGE="wallpapers/ashen-rain.png"

# --- presets -------------------------------------------------------------
BAR="waybar"
BAR_PRESET="islands"
TERM_PRESET="minimal"
LAUNCHER_PRESET="minimal"
