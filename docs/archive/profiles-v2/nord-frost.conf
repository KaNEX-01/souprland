# ---------------------------------------------------------------------------
#  preset: nord-frost
#  title: Nord — Frost
#  desc: The calm blue of the Nord palette: moderate gaps, light blur and an
#        almost invisible bar. One of the most widely copied color schemes;
#        the base of countless Waybar/Hyprland rices.
#
#  Usage:  ./install.sh --preset nord-frost
#
#  This file only sets the LOOK. Which packages get installed is decided
#  by the component selection. Every setting not given here takes its
#  default from lib/config.sh; values in your own settings.conf override
#  this file.
# ---------------------------------------------------------------------------

THEME="nord"
FONT_FAMILY="Noto Sans"
FONT_SIZE=10

# --- layout --------------------------------------------------------------
LAYOUT="dwindle"
GAPS_IN=5
GAPS_OUT=12
BORDER_SIZE=2
BORDER_ANGLE=45
ROUNDING=8
ROUNDING_POWER=2

# --- decoration ----------------------------------------------------------
BLUR="true"
BLUR_SIZE=5
BLUR_PASSES=2
BLUR_XRAY="false"
BLUR_NOISE=0.0117
BLUR_CONTRAST=0.9
BLUR_BRIGHTNESS=1.0
BLUR_VIBRANCY=0.17
BLUR_POPUPS="true"
SHADOW="true"
SHADOW_RANGE=16
SHADOW_RENDER_POWER=3
SHADOW_OFFSET="0 4"
ACTIVE_OPACITY=1.0
INACTIVE_OPACITY=0.96
DIM_INACTIVE="false"
DIM_STRENGTH=0.05

# --- animation -----------------------------------------------------------
ANIMATIONS="true"
ANIMATION_PRESET="default"
ANIMATION_SPEED=1.0

# --- wallpaper -----------------------------------------------------------
WALLPAPER_IMAGE="wallpapers/nord.png"

# --- presets -------------------------------------------------------------
BAR="waybar"
BAR_PRESET="minimal"
TERM_PRESET="classic"
LAUNCHER_PRESET="centered"
