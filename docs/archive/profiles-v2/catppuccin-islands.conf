# ---------------------------------------------------------------------------
#  preset: catppuccin-islands
#  title: Catppuccin — Islands
#  desc: sameemul-haque/dotfiles' Arch + Waybar + Catppuccin setup: a bar
#        split into three islands, pastel palette, medium gaps and soft
#        shadow. One of the most copied Catppuccin layouts.
#
#  Usage:  ./install.sh --preset catppuccin-islands
#
#  This file only sets the LOOK. Which packages get installed is decided
#  by the component selection. Every setting not given here takes its
#  default from lib/config.sh; values in your own settings.conf override
#  this file.
# ---------------------------------------------------------------------------

THEME="catppuccin-mocha"
FONT_FAMILY="Noto Sans"
FONT_SIZE=10

# --- layout --------------------------------------------------------------
LAYOUT="dwindle"
GAPS_IN=5
GAPS_OUT=14
BORDER_SIZE=2
BORDER_ANGLE=45
ROUNDING=12
ROUNDING_POWER=2

# --- decoration ----------------------------------------------------------
BLUR="true"
BLUR_SIZE=7
BLUR_PASSES=3
BLUR_XRAY="false"
BLUR_NOISE=0.0117
BLUR_CONTRAST=0.9
BLUR_BRIGHTNESS=1.0
BLUR_VIBRANCY=0.17
BLUR_POPUPS="true"
SHADOW="true"
SHADOW_RANGE=22
SHADOW_RENDER_POWER=3
SHADOW_OFFSET="0 4"
ACTIVE_OPACITY=1.0
INACTIVE_OPACITY=0.94
DIM_INACTIVE="false"
DIM_STRENGTH=0.05

# --- animation -----------------------------------------------------------
ANIMATIONS="true"
ANIMATION_PRESET="default"
ANIMATION_SPEED=1.1

# --- wallpaper -----------------------------------------------------------
WALLPAPER_IMAGE="wallpapers/catppuccin-mocha.png"

# --- presets -------------------------------------------------------------
BAR="waybar"
BAR_PRESET="sameemul-islands"
TERM_PRESET="glass"
LAUNCHER_PRESET="centered"
