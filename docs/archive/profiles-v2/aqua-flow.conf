# ---------------------------------------------------------------------------
#  preset: aqua-flow
#  title: Aqua — Flow
#  desc: The tone of turquoise-heavy, softly blended setups like mel-
#        edo/awesome-setup: single-capsule bar, medium blur, cool palette.
#
#  Usage:  ./install.sh --preset aqua-flow
#
#  This file only sets the LOOK. Which packages get installed is decided
#  by the component selection. Every setting not given here takes its
#  default from lib/config.sh; values in your own settings.conf override
#  this file.
# ---------------------------------------------------------------------------

THEME="aqua-split"
FONT_FAMILY="Noto Sans"
FONT_SIZE=10

# --- layout --------------------------------------------------------------
LAYOUT="dwindle"
GAPS_IN=6
GAPS_OUT=14
BORDER_SIZE=2
BORDER_ANGLE=45
ROUNDING=14
ROUNDING_POWER=2

# --- decoration ----------------------------------------------------------
BLUR="true"
BLUR_SIZE=7
BLUR_PASSES=3
BLUR_XRAY="false"
BLUR_NOISE=0.0117
BLUR_CONTRAST=0.9
BLUR_BRIGHTNESS=1.0
BLUR_VIBRANCY=0.25
BLUR_POPUPS="true"
SHADOW="true"
SHADOW_RANGE=20
SHADOW_RENDER_POWER=3
SHADOW_OFFSET="0 4"
ACTIVE_OPACITY=1.0
INACTIVE_OPACITY=0.93
DIM_INACTIVE="false"
DIM_STRENGTH=0.05

# --- animation -----------------------------------------------------------
ANIMATIONS="true"
ANIMATION_PRESET="fluid"
ANIMATION_SPEED=1.0

# --- wallpaper -----------------------------------------------------------
WALLPAPER_IMAGE="wallpapers/aqua-split.png"

# --- presets -------------------------------------------------------------
BAR="waybar"
BAR_PRESET="pill-single"
TERM_PRESET="glass"
LAUNCHER_PRESET="glass"
