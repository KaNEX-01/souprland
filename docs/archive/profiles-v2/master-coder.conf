# ---------------------------------------------------------------------------
#  preset: master-coder
#  title: Master — Coding
#  desc: A single large main window + a stack beside it (master layout),
#        narrow gaps and a distraction-free dark palette. The common layout
#        of terminal-heavy rices (HyDE, gruvbox).
#
#  Usage:  ./install.sh --preset master-coder
#
#  This file only sets the LOOK. Which packages get installed is decided
#  by the component selection. Every setting not given here takes its
#  default from lib/config.sh; values in your own settings.conf override
#  this file.
# ---------------------------------------------------------------------------

THEME="evercal-slate"
FONT_FAMILY="JetBrainsMono Nerd Font"
FONT_SIZE=10

# --- layout --------------------------------------------------------------
LAYOUT="master"
GAPS_IN=3
GAPS_OUT=8
BORDER_SIZE=2
BORDER_ANGLE=45
ROUNDING=6
ROUNDING_POWER=2
MASTER_MFACT=0.6
MASTER_NEW_STATUS="slave"

# --- decoration ----------------------------------------------------------
BLUR="true"
BLUR_SIZE=4
BLUR_PASSES=2
BLUR_XRAY="false"
BLUR_NOISE=0.0117
BLUR_CONTRAST=0.9
BLUR_BRIGHTNESS=1.0
BLUR_VIBRANCY=0.17
BLUR_POPUPS="true"
SHADOW="false"
SHADOW_RANGE=0
SHADOW_RENDER_POWER=3
SHADOW_OFFSET="0 4"
ACTIVE_OPACITY=1.0
INACTIVE_OPACITY=0.97
DIM_INACTIVE="false"
DIM_STRENGTH=0.05

# --- animation -----------------------------------------------------------
ANIMATIONS="true"
ANIMATION_PRESET="snappy"
ANIMATION_SPEED=1.4

# --- wallpaper -----------------------------------------------------------
WALLPAPER_IMAGE="wallpapers/evercal-slate.png"

# --- presets -------------------------------------------------------------
BAR="waybar"
BAR_PRESET="stats-only"
TERM_PRESET="compact"
LAUNCHER_PRESET="minimal"
