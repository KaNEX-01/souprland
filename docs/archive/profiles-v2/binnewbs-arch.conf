# ---------------------------------------------------------------------------
#  preset: binnewbs-arch
#  title: Compact Arch
#  desc: binnewbs/arch-hyprland: tight measurements for daily use — narrow
#        gaps, low bar, moderate blur. A rice after efficiency rather than
#        show.
#
#  Usage:  ./install.sh --preset binnewbs-arch
#
#  This file only sets the LOOK. Which packages get installed is decided
#  by the component selection. Every setting not given here takes its
#  default from lib/config.sh; values in your own settings.conf override
#  this file.
# ---------------------------------------------------------------------------

THEME="slate-arch"
FONT_FAMILY="Noto Sans"
FONT_SIZE=10

# --- layout --------------------------------------------------------------
LAYOUT="dwindle"
GAPS_IN=4
GAPS_OUT=9
BORDER_SIZE=2
BORDER_ANGLE=45
ROUNDING=8
ROUNDING_POWER=2

# --- decoration ----------------------------------------------------------
BLUR="true"
BLUR_SIZE=5
BLUR_PASSES=2
BLUR_XRAY="false"
BLUR_NOISE=0.0117
BLUR_CONTRAST=0.9
BLUR_BRIGHTNESS=1.0
BLUR_VIBRANCY=0.17
BLUR_POPUPS="true"
SHADOW="true"
SHADOW_RANGE=16
SHADOW_RENDER_POWER=3
SHADOW_OFFSET="0 4"
ACTIVE_OPACITY=1.0
INACTIVE_OPACITY=0.95
DIM_INACTIVE="false"
DIM_STRENGTH=0.05

# --- animation -----------------------------------------------------------
ANIMATIONS="true"
ANIMATION_PRESET="snappy"
ANIMATION_SPEED=1.3

# --- wallpaper -----------------------------------------------------------
WALLPAPER_IMAGE="wallpapers/slate-arch.png"

# --- presets -------------------------------------------------------------
BAR="waybar"
BAR_PRESET="binnewbs-compact"
TERM_PRESET="compact"
LAUNCHER_PRESET="centered"
