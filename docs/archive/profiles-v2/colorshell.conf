# ---------------------------------------------------------------------------
#  preset: colorshell
#  title: Colorshell — Bottom Dock
#  desc: A floating dock at the bottom, workspaces with app icons in the
#        center and pywal-based color. Source: Colorshell — a setup that
#        gathers the desktop around a dock.
#
#  Usage:  ./install.sh --preset colorshell
#
#  This file only sets the LOOK. Which packages get installed is decided
#  by the component selection. Every setting not given here takes its
#  default from lib/config.sh; values in your own settings.conf override
#  this file.
# ---------------------------------------------------------------------------

THEME="cosmic-void"
FONT_FAMILY="Noto Sans"
FONT_SIZE=10

# --- layout --------------------------------------------------------------
LAYOUT="dwindle"
GAPS_IN=6
GAPS_OUT=14
BORDER_SIZE=2
BORDER_ANGLE=45
ROUNDING=16
ROUNDING_POWER=2

# --- decoration ----------------------------------------------------------
BLUR="true"
BLUR_SIZE=8
BLUR_PASSES=3
BLUR_XRAY="false"
BLUR_NOISE=0.0117
BLUR_CONTRAST=0.9
BLUR_BRIGHTNESS=1.0
BLUR_VIBRANCY=0.24
BLUR_POPUPS="true"
SHADOW="true"
SHADOW_RANGE=28
SHADOW_RENDER_POWER=3
SHADOW_OFFSET="0 4"
ACTIVE_OPACITY=1.0
INACTIVE_OPACITY=0.92
DIM_INACTIVE="false"
DIM_STRENGTH=0.05

# --- animation -----------------------------------------------------------
ANIMATIONS="true"
ANIMATION_PRESET="fluid"
ANIMATION_SPEED=1.1

# --- wallpaper -----------------------------------------------------------
WALLPAPER_IMAGE="wallpapers/cosmic-void.png"

# --- presets -------------------------------------------------------------
BAR="waybar"
BAR_PRESET="colorshell-dock"
TERM_PRESET="glass"
LAUNCHER_PRESET="spotlight"
