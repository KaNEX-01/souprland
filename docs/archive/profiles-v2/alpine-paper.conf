# ---------------------------------------------------------------------------
#  preset: alpine-paper
#  title: Alpine — Paper
#  desc: An even plainer take on the light theme: outlined bar, shadowless
#        windows, monospaced font. From the paper rices in the
#        Flexoki/solarized-light vein.
#
#  Usage:  ./install.sh --preset alpine-paper
#
#  This file only sets the LOOK. Which packages get installed is decided
#  by the component selection. Every setting not given here takes its
#  default from lib/config.sh; values in your own settings.conf override
#  this file.
# ---------------------------------------------------------------------------

THEME="alpine-light"
FONT_FAMILY="Noto Sans"
FONT_SIZE=11

# --- layout --------------------------------------------------------------
LAYOUT="dwindle"
GAPS_IN=4
GAPS_OUT=10
BORDER_SIZE=1
BORDER_ANGLE=45
ROUNDING=6
ROUNDING_POWER=2

# --- decoration ----------------------------------------------------------
BLUR="false"
BLUR_SIZE=1
BLUR_PASSES=3
BLUR_XRAY="false"
BLUR_NOISE=0.0117
BLUR_CONTRAST=0.9
BLUR_BRIGHTNESS=1.0
BLUR_VIBRANCY=0.17
BLUR_POPUPS="true"
SHADOW="false"
SHADOW_RANGE=0
SHADOW_RENDER_POWER=3
SHADOW_OFFSET="0 4"
ACTIVE_OPACITY=1.0
INACTIVE_OPACITY=1.0
DIM_INACTIVE="false"
DIM_STRENGTH=0.05

# --- animation -----------------------------------------------------------
ANIMATIONS="true"
ANIMATION_PRESET="minimal"
ANIMATION_SPEED=1.3

# --- wallpaper -----------------------------------------------------------
WALLPAPER_IMAGE="wallpapers/alpine-light.png"

# --- presets -------------------------------------------------------------
BAR="waybar"
BAR_PRESET="outline"
TERM_PRESET="readable"
LAUNCHER_PRESET="minimal"
