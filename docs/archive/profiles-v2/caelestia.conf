# ---------------------------------------------------------------------------
#  preset: caelestia
#  title: Caelestia — Fluid
#  desc: The pastel, rounded language of caelestia-dots/shell: large corner
#        radius, glass-like surfaces, fluid transitions. Comes with a
#        Quickshell-based bar and a media capsule in the center.
#
#  Usage:  ./install.sh --preset caelestia
#
#  This file only sets the LOOK. Which packages get installed is decided
#  by the component selection. Every setting not given here takes its
#  default from lib/config.sh; values in your own settings.conf override
#  this file.
# ---------------------------------------------------------------------------

THEME="catppuccin-macchiato"
FONT_FAMILY="Noto Sans"
FONT_SIZE=10

# --- layout --------------------------------------------------------------
LAYOUT="dwindle"
GAPS_IN=6
GAPS_OUT=16
BORDER_SIZE=2
BORDER_ANGLE=45
ROUNDING=18
ROUNDING_POWER=4

# --- decoration ----------------------------------------------------------
BLUR="true"
BLUR_SIZE=8
BLUR_PASSES=4
BLUR_XRAY="false"
BLUR_NOISE=0.0117
BLUR_CONTRAST=0.9
BLUR_BRIGHTNESS=1.05
BLUR_VIBRANCY=0.28
BLUR_POPUPS="true"
SHADOW="true"
SHADOW_RANGE=30
SHADOW_RENDER_POWER=3
SHADOW_OFFSET="0 4"
ACTIVE_OPACITY=1.0
INACTIVE_OPACITY=0.93
DIM_INACTIVE="false"
DIM_STRENGTH=0.05

# --- animation -----------------------------------------------------------
ANIMATIONS="true"
ANIMATION_PRESET="fluid"
ANIMATION_SPEED=1.1

# --- wallpaper -----------------------------------------------------------
WALLPAPER_IMAGE="wallpapers/catppuccin-macchiato.png"

# --- presets -------------------------------------------------------------
BAR="quickshell-bar"
BAR_PRESET="caelestia"
TERM_PRESET="glass"
LAUNCHER_PRESET="glass"
