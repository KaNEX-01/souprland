# ---------------------------------------------------------------------------
#  preset: cyberarch-hud
#  title: CyberArch — HUD
#  desc: The HUD of ARCANGEL0/CyberArch-Shell: cornerless windows, a thick
#        accent border, a dimmed background and a dense top strip. Uses the
#        screen like a flight console.
#
#  Usage:  ./install.sh --preset cyberarch-hud
#
#  This file only sets the LOOK. Which packages get installed is decided
#  by the component selection. Every setting not given here takes its
#  default from lib/config.sh; values in your own settings.conf override
#  this file.
# ---------------------------------------------------------------------------

THEME="nerv-magi"
FONT_FAMILY="JetBrainsMono Nerd Font"
FONT_SIZE=10

# --- layout --------------------------------------------------------------
LAYOUT="dwindle"
GAPS_IN=3
GAPS_OUT=8
BORDER_SIZE=3
BORDER_ANGLE=90
ROUNDING=0
ROUNDING_POWER=2

# --- decoration ----------------------------------------------------------
BLUR="true"
BLUR_SIZE=4
BLUR_PASSES=2
BLUR_XRAY="false"
BLUR_NOISE=0.0117
BLUR_CONTRAST=1.1
BLUR_BRIGHTNESS=1.0
BLUR_VIBRANCY=0.17
BLUR_POPUPS="true"
SHADOW="true"
SHADOW_RANGE=12
SHADOW_RENDER_POWER=3
SHADOW_OFFSET="0 4"
ACTIVE_OPACITY=1.0
INACTIVE_OPACITY=0.88
DIM_INACTIVE="true"
DIM_STRENGTH=0.2

# --- animation -----------------------------------------------------------
ANIMATIONS="true"
ANIMATION_PRESET="snappy"
ANIMATION_SPEED=1.5

# --- wallpaper -----------------------------------------------------------
WALLPAPER_IMAGE="wallpapers/nerv-magi.png"

# --- presets -------------------------------------------------------------
BAR="waybar"
BAR_PRESET="cyberarch-hud"
TERM_PRESET="compact"
LAUNCHER_PRESET="grid"
