# ---------------------------------------------------------------------------
#  preset: nebula
#  title: Nebula — Gradient Border
#  desc: A dark cosmic wallpaper, a focused window with a gradient border and
#        an almost invisible bar. Source: Rainz's Hyprland — soft workspace
#        transitions with bezier curves.
#
#  Usage:  ./install.sh --preset nebula
#
#  This file only sets the LOOK. Which packages get installed is decided
#  by the component selection. Every setting not given here takes its
#  default from lib/config.sh; values in your own settings.conf override
#  this file.
# ---------------------------------------------------------------------------

THEME="pixel-cosmos"
FONT_FAMILY="Noto Sans"
FONT_SIZE=10

# --- layout --------------------------------------------------------------
LAYOUT="dwindle"
GAPS_IN=8
GAPS_OUT=20
BORDER_SIZE=3
BORDER_ANGLE=135
ROUNDING=12
ROUNDING_POWER=2

# --- decoration ----------------------------------------------------------
BLUR="true"
BLUR_SIZE=9
BLUR_PASSES=3
BLUR_XRAY="false"
BLUR_NOISE=0.0117
BLUR_CONTRAST=0.9
BLUR_BRIGHTNESS=1.0
BLUR_VIBRANCY=0.3
BLUR_POPUPS="true"
SHADOW="true"
SHADOW_RANGE=32
SHADOW_RENDER_POWER=3
SHADOW_OFFSET="0 6"
ACTIVE_OPACITY=1.0
INACTIVE_OPACITY=0.88
DIM_INACTIVE="false"
DIM_STRENGTH=0.05

# --- animation -----------------------------------------------------------
ANIMATIONS="true"
ANIMATION_PRESET="fluid"
ANIMATION_SPEED=0.9

# --- wallpaper -----------------------------------------------------------
WALLPAPER_IMAGE="wallpapers/pixel-cosmos.png"

# --- presets -------------------------------------------------------------
BAR="waybar"
BAR_PRESET="rainz-nebula"
TERM_PRESET="glass"
LAUNCHER_PRESET="glass"
