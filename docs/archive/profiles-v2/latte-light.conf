# ---------------------------------------------------------------------------
#  preset: latte-light
#  title: Latte — Light Theme
#  desc: The layout of light-theme rices like Catppuccin Latte / Flexoki
#        Light: paper-white background, thin grey border, soft shadow and
#        crisp readability. For working in daylight.
#
#  Usage:  ./install.sh --preset latte-light
#
#  This file only sets the LOOK. Which packages get installed is decided
#  by the component selection. Every setting not given here takes its
#  default from lib/config.sh; values in your own settings.conf override
#  this file.
# ---------------------------------------------------------------------------

THEME="lamp-paper"
FONT_FAMILY="Noto Sans"
FONT_SIZE=10

# --- layout --------------------------------------------------------------
LAYOUT="dwindle"
GAPS_IN=5
GAPS_OUT=12
BORDER_SIZE=2
BORDER_ANGLE=45
ROUNDING=10
ROUNDING_POWER=2

# --- decoration ----------------------------------------------------------
BLUR="true"
BLUR_SIZE=4
BLUR_PASSES=2
BLUR_XRAY="false"
BLUR_NOISE=0.0117
BLUR_CONTRAST=0.9
BLUR_BRIGHTNESS=1.1
BLUR_VIBRANCY=0.17
BLUR_POPUPS="true"
SHADOW="true"
SHADOW_RANGE=14
SHADOW_RENDER_POWER=3
SHADOW_OFFSET="0 4"
ACTIVE_OPACITY=1.0
INACTIVE_OPACITY=1.0
DIM_INACTIVE="false"
DIM_STRENGTH=0.05

# --- animation -----------------------------------------------------------
ANIMATIONS="true"
ANIMATION_PRESET="default"
ANIMATION_SPEED=1.0

# --- wallpaper -----------------------------------------------------------
WALLPAPER_IMAGE="wallpapers/lamp-paper.png"

# --- presets -------------------------------------------------------------
BAR="waybar"
BAR_PRESET="sharp"
TERM_PRESET="readable"
LAUNCHER_PRESET="centered"
