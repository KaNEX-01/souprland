# ---------------------------------------------------------------------------
#  preset: widget-desk
#  title: Widget Desk
#  desc: A dashboard-style setup with clock, calendar, system info and media
#        widgets on the desktop (Arch Eclipse, Colorshell, HyprPanel
#        dashboards). A widget engine must be selected for it to work.
#
#  Usage:  ./install.sh --preset widget-desk
#
#  This file only sets the LOOK. Which packages get installed is decided
#  by the component selection. Every setting not given here takes its
#  default from lib/config.sh; values in your own settings.conf override
#  this file.
# ---------------------------------------------------------------------------

THEME="cosmos-violet"
FONT_FAMILY="Noto Sans"
FONT_SIZE=10

# --- layout --------------------------------------------------------------
LAYOUT="dwindle"
GAPS_IN=6
GAPS_OUT=16
BORDER_SIZE=2
BORDER_ANGLE=45
ROUNDING=14
ROUNDING_POWER=2

# --- decoration ----------------------------------------------------------
BLUR="true"
BLUR_SIZE=8
BLUR_PASSES=3
BLUR_XRAY="false"
BLUR_NOISE=0.0117
BLUR_CONTRAST=0.9
BLUR_BRIGHTNESS=1.0
BLUR_VIBRANCY=0.26
BLUR_POPUPS="true"
SHADOW="true"
SHADOW_RANGE=26
SHADOW_RENDER_POWER=3
SHADOW_OFFSET="0 4"
ACTIVE_OPACITY=1.0
INACTIVE_OPACITY=0.92
DIM_INACTIVE="false"
DIM_STRENGTH=0.05

# --- animation -----------------------------------------------------------
ANIMATIONS="true"
ANIMATION_PRESET="fluid"
ANIMATION_SPEED=1.0

# --- wallpaper -----------------------------------------------------------
WALLPAPER_IMAGE="wallpapers/cosmos-violet.png"

# --- presets -------------------------------------------------------------
BAR="hyprpanel"
BAR_PRESET="hyprpanel-dashboard"
TERM_PRESET="glass"
LAUNCHER_PRESET="spotlight"
WIDGETS="clock,calendar,sysinfo,music"
